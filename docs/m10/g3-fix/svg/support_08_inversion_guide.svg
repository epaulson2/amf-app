<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1122" height="1402" viewBox="0 0 1122 1402" role="img">
<title>Interval Inversion</title><desc>Move the lower note one octave above the upper note</desc>
<defs>
 <radialGradient id="wash"><stop offset="0%" stop-color="#5366A0" stop-opacity=".075"/><stop offset="72%" stop-color="#5366A0" stop-opacity=".018"/><stop offset="100%" stop-color="#5366A0" stop-opacity="0"/></radialGradient>
 <radialGradient id="goldwash"><stop offset="0%" stop-color="#F7DCB7" stop-opacity=".60"/><stop offset="100%" stop-color="#F7DCB7" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="48%" stop-color="#FCF6EF" stop-opacity=".86"/><stop offset="100%" stop-color="#EBDFEC" stop-opacity=".64"/></linearGradient>
 <linearGradient id="goldline"><stop offset="0" stop-color="#FFF3C1"/><stop offset=".52" stop-color="#CD9A51"/><stop offset="1" stop-color="#FBDAA2"/></linearGradient>
 <linearGradient id="shimmer"><stop offset="0" stop-color="#5366A0" stop-opacity=".36"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#5366A0" stop-opacity=".27"/></linearGradient>
 </defs>
