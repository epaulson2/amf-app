<ellipse cx="561.0" cy="1293.0" rx="553.04" ry="55.5" fill="url(#wash)" opacity="0.76" stroke="none" stroke-width="1"/><rect x="115" y="1256" width="892" height="74" rx="37.0" fill="url(#glass)" stroke="#5366A0" stroke-width="2" opacity="0.93"/><text x="561.0" y="1306.32" font-family="'DejaVu Serif',serif" font-size="27" font-weight="bold" font-style="normal" text-anchor="middle" fill="#5366A0" opacity="1">Inversion moves the lower note up an octave.</text></svg>