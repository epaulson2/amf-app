<ellipse cx="820.5" cy="611.0" rx="262.26" ry="46.5" fill="url(#wash)" opacity="0.76" stroke="none" stroke-width="1"/><rect x="609" y="580" width="423" height="62" rx="31.0" fill="url(#glass)" stroke="#8964A4" stroke-width="2" opacity="0.93"/><text x="820.5" y="622.16" font-family="'DejaVu Sans',sans-serif" font-size="27" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8964A4" opacity="1">E♭4–C5: 9 st</text>
<text x="562" y="622" font-family="'DejaVu Sans',sans-serif" font-size="42" font-weight="bold" font-style="normal" text-anchor="middle" fill="#8964A4" opacity="1">↔</text>
<text x="561" y="696" font-family="'DejaVu Serif',serif" font-size="24" font-weight="normal" font-style="normal" text-anchor="middle" fill="#44374B" opacity="1">3 + 9 = 12 semitones   •   interval numbers sum to 9</text>
