<script>
const D=[{"id":"A-02","g":"Shared references","t":"The thirteen interval identity colours","s":"H","teaches":"The thirteen identity colours of the Interval Palette, each next to the name and semitone count it belongs to. The colour is an agreed artistic label for a pair of notes, never a property of sound.","how":"This is the key to every colour in Week 2. Read across a row: colour, number of semitones, then the interval name. A colour is always printed beside its name, so it never has to be guessed, and it is attached to the pair of notes, not to a voice. Compare with the live Palette page; the values are imported from the same file."},{"id":"A-03","g":"Shared references","t":"The Week 2 keyboard window, B3 to C5","s":"2A:1, 2A:7, 2A:9, 2B:3, 2C:7","teaches":"The keyboard window Week 2 uses. It starts on B3, so the note just below C4 is on the picture, and every key is named with its octave number.","how":"Find C4, the white key just left of the group of two black keys in the middle of this window. B3 is the white key immediately to its left. The small numbers above the black keys count each group (two, then three). Every white key carries its octave number, so C4 and C5 are different keys."},{"id":"A-04","g":"Shared references","t":"Reading a two-lane timeline","s":"2A:2, 2B:2, 2C:1, 2C:7","teaches":"How a lane works: each voice has its own row, bars are notes, dashed boxes are rests, and one vertical slice is a single moment of two notes together.","how":"The top lane is the upper voice and the bottom lane is the lower voice. A solid bar is a note sounding for as long as the bar is wide; a dashed box is a rest. The dashed vertical line cuts through both lanes at one moment, and the two notes it crosses are the pair sounding together. This pattern is made up to show how to read a lane; it is not a Week 2 exercise."},{"id":"A-05","g":"Shared references","t":"Counting letters is not counting semitones","s":"2A:3, 2A:4","teaches":"Two different counts for the same two notes: three letters (C, D, E) and four semitone hops from C4 to E4. The black keys count as hops but not as letters.","how":"In the first keyboard the numbers sit only on lettered white keys, C then D then E. In the second keyboard each arc is one hop to the very next key, black or white, from C4 up to E4. Same two notes, two separate rulers, two different numbers."},{"id":"A-06","g":"Shared references","t":"Four motion glyphs","s":"2B:7, 2B:11","teaches":"The four movement words as pure arrows, with no pitch names: one voice holds, voices go opposite ways, voices go the same way by different amounts, and the strict parallel case of equal amounts.","how":"In each sketch the filled circle is the lower voice and the square is the upper voice, moving left to right. Watch the arrows: level or rising, opposite directions, same direction. The last sketch has two equal brackets to show that the distance travelled is the same."},{"id":"A-07","g":"Shared references","t":"What stayed, what changed","s":"2B:10, 2B:11, 2C:5","teaches":"A change in a pair can be described by saying which voice stayed and which moved. The interval changes only because one voice did.","how":"Each row has three parts: the start pair, what stayed and what changed, and the end pair. The colour bar on each pair names that pair, not either voice. Read left to right, then check that the voice that stayed has the same note on both sides."},{"id":"A-09","g":"Shared references","t":"Plogger lens for the four named pairs","s":"2B:5, 2B:6, 2C:5","teaches":"The historic Plogger lens for minor third [3], major third [4], perfect fourth [5], tritone [6]: contour is the family, shadow direction is fundamental or octave, fill is harmonicity. It is a separate label from the identity colour.","how":"Each chip has three separate marks: the outline shape, a shadow to the left, right or both sides, and the fill. The coloured bar beside it is the interval identity colour, which is a different label. The legend underneath states every mark in words and names the printed source this lens comes from."},{"id":"A-09a","g":"Shared references","t":"Plogger lens for the 2A pairs","s":"2A:5, 2A:6","teaches":"The historic Plogger lens for minor third [3], major third [4], perfect fourth [5]: contour is the family, shadow direction is fundamental or octave, fill is harmonicity. It is a separate label from the identity colour.","how":"Each chip has three separate marks: the outline shape, a shadow to the left, right or both sides, and the fill. The coloured bar beside it is the interval identity colour, which is a different label. The legend underneath states every mark in words and names the printed source this lens comes from."},{"id":"A-11","g":"Shared references","t":"Pair badges used in Week 2","s":"2B:5, 2B:6","teaches":"The one badge every named pair in Week 2 uses: colour bar, interval name, the two actual notes, semitones and letters. The same badge appears in every lesson.","how":"Read each badge from the top: interval name and short symbol, then the two notes with their octave numbers, then the two counts. The colour bar belongs to the whole pair. Two badges can share a colour (C4 + F4 and B3 + E4 are both perfect fourths), because colour follows the interval, not the notes."},{"id":"A-12","g":"Shared references","t":"How to read our pictures","s":"H, 2A:5","teaches":"The marks every Week 2 picture uses, including the rule that colour belongs to a pair of notes, not to a voice, and that shape tells the voices apart.","how":"Read this once before the lessons. The two voices are told apart by shape (circle and square), so the picture still works in black and white. Colour appears only after a pair has been named, as a bar that belongs to the two notes together."},{"id":"H-01","g":"Week 2 hub","t":"The Week 2 path: three lessons","s":"H","teaches":"The order of the week: first one voice moves, then both voices move, then two short sketches put the ideas to work.","how":"Follow the arrows from left to right (top to bottom on a phone). Each box names the lesson and what you do in it. The boxes do not give away the vocabulary; it is introduced in the lessons themselves."},{"id":"H-02","g":"Week 2 hub","t":"Week 1 used C3; Week 2 starts at C4","s":"H, 2A:1","teaches":"Week 1 started on C3 and Week 2 starts on C4. They are different keys, one octave apart, and not the same pitch.","how":"Find the two marked C keys: C3 on the left, C4 in the middle. Each C is the white key just left of a group of two black keys. The bracket joins them; it is a comparison between two registers, not an interval you will study this week."},{"id":"H-03","g":"Week 2 hub","t":"From a note to harmony","s":"H","teaches":"How the week's ideas build on each other: a note, two notes (an interval), a line of notes (a voice), a change between pairs (motion), and what the pairs make together (harmony).","how":"Read down the chain. Each box adds one idea to the one above it. The worked example beside \"interval\" uses C4 and E4 and carries the only colour on the page, because it is the only pair that is named here."},{"id":"H-04","g":"Week 2 hub","t":"Three lessons in miniature","s":"H","teaches":"A glimpse of what each lesson looks like on the page: one moving voice, two moving voices, and a timeline with rests.","how":"Each tile is a tiny version of a picture you will meet in that lesson. Only the shapes matter here: circles and squares are the lower and upper voice, dashed shapes show where a voice started, and the dashed boxes in the third tile are rests."},{"id":"2A-01","g":"Lesson 2A — Same letters, different size","t":"Two notes, two voices: C4 and E4","s":"2A:2","teaches":"Two notes can be two voices: a lower one and an upper one. You play C4, then E4, then both together, on your own keyboard.","how":"Find C4 (the circle) and E4 (the square) on the keyboard. The three prompts underneath are things to do on your own keyboard: play the lower note, play the upper note, then play both. The picture does not name the pair yet; that comes later in the lesson."},{"id":"2A-02","g":"Lesson 2A — Same letters, different size","t":"Count the letters: C D E and E F G","s":"2A:3","teaches":"Counting letters, first and last included: C to E is three letters, and E to G is also three letters. At this point no semitones are counted.","how":"The numbers sit on lettered keys only. Start at the lower note and count 1 on it, then each lettered key up to the upper note. Both pairs end on 3 even though the notes are different; the next step counts something else."},{"id":"2A-03","g":"Lesson 2A — Same letters, different size","t":"Count the semitones: every key counts","s":"2A:4","teaches":"Semitones count every key, black or white. C4 to E4 is four hops and E4 to G4 is three hops, although both span three letters.","how":"Each arc is one hop to the very next key, whatever its colour. Count the arcs from the lower note to the upper note; the last number is the total. The two totals differ (4 and 3) even though both pairs span the letters C D E and E F G."},{"id":"2A-04","g":"Lesson 2A — Same letters, different size","t":"Same letters, different size: major and minor third","s":"2A:5","teaches":"Two thirds, three letters each, but four semitones (major third) against three (minor third). E4 and G4 are an actual minor third with its own colour, not the Palette's C4 and E♭4.","how":"The coloured bracket under each keyboard names the pair. The bar on the badge uses the same colour as the keys, because the colour belongs to the pair of notes. The two colours differ because the semitone counts differ, even though both pairs span three letters."},{"id":"2A-05","g":"Lesson 2A — Same letters, different size","t":"One voice moves: a major third becomes a perfect fourth","s":"2A:6","teaches":"When only the upper voice moves up by one semitone, the interval grows from a major third (4 semitones) to a perfect fourth (5). The lower voice stays on C4.","how":"The dashed square is where the upper voice started (E4) and the arrow shows its single step to F4. The lower voice, the circle on C4, does not move. The keys are coloured for the pair where you finish, and the two badges name the start and the end."},{"id":"2A-06","g":"Lesson 2A — Same letters, different size","t":"The foundation can travel","s":"2A:7","teaches":"The lower voice can move too. C4 down to B3 under E4 makes a perfect fourth (5 semitones); C4 up to D4 makes a major second (2 semitones).","how":"Each keyboard starts from the same pair, C4 and E4, shown by dashed marks. Read the arrow above the keys to see which way the lower voice went and by how much, then read the badges for the new pair. The keyboard starts at B3, so the key just below C4 is on the picture."},{"id":"2A-07","g":"Lesson 2A — Same letters, different size","t":"Three changes from one beginning","s":"2A:8, 2A:10","teaches":"One beginning, three small changes, three different results: perfect fourth, perfect fourth, major second. The summary the lesson ends on.","how":"Each card names the change in words, then lists the start pair and the end pair with their colour bars. Compare the end swatches: the first two changes land on the same colour, because both give 5 semitones, even though different notes moved."},{"id":"2A-08","g":"Lesson 2A — Same letters, different size","t":"Your keyboard sheet: build, then change","s":"2A:9","teaches":"A paper companion for working at your own keyboard: write down the notes and counts for a major third, a minor third and three changes. Nothing is scored.","how":"Work on your own keyboard and write what you find on the lines. The first change row is already filled in as an example with its colour bar. The printed version carries the same words and lines in black and white; there is no check button and no score."},{"id":"2A-09","g":"Lesson 2A — Same letters, different size","t":"One after another, and together","s":"2A:2","teaches":"Two notes can be played one after another or at the same time. Together, the lower note sits under the upper note.","how":"In the first row, read left to right: the lower note first, then the upper note. In the second row the two notes share one slot: the square (upper) sits above the circle (lower) because they sound at the same moment. Try both on your own keyboard."},{"id":"2A-10","g":"Lesson 2A — Same letters, different size","t":"The foundation moves: E4 and G4, a minor third","s":"2A:5","teaches":"A third does not have to start on C. E4 to G4 spans three letters and three semitones: a minor third, in the minor third colour.","how":"Count the three arcs from E4 up to G4 (E to F, F to F♯, F♯ to G). The keys and the bracket share the minor third colour because that colour belongs to the pair, wherever it sits on the keyboard. The pair is E4 and G4, not C4 and E♭4."},{"id":"2B-01a","g":"Lesson 2B — How two voices move","t":"Two paths through time","s":"2B:1, 2B:2","teaches":"Each voice has its own path across time (horizontal), and at any one stage the two notes make a gap (vertical). Two directions to look in: along a path, and between the voices.","how":"Read each line from left to right: that is a voice's path. Then look straight up at one stage: the vertical gap there is the two notes at that moment. The picture gives only note names and stages. It does not name the pair or the movement; the lesson does that next."},{"id":"2B-01b","g":"Lesson 2B — How two voices move","t":"Before we name it: two journeys","s":"2B:3","teaches":"Two journeys from the same two notes. Compare them: in each, one voice does something different. The picture shows only the notes and the arrows, so you can decide what you notice before it is named.","how":"Each keyboard starts from the dashed shapes on C4 and E4 and ends on the solid shapes. Follow the arrows and compare the two journeys with your eyes and, if you like, with your own keyboard. There are no labels on the endings: that is deliberate, and the next step supplies the names."},{"id":"2B-02","g":"Lesson 2B — How two voices move","t":"Three families of motion, with exact examples","s":"2B:4","teaches":"The three families of motion as exact keyboard examples: oblique, contrary (both apart and together) and similar. The narrower word \"parallel\" comes later, in step 6.","how":"Each tile is one example with its definition above it. The dashed shapes are where each voice started and the arrows show where it goes. Contrary covers two examples, moving apart and moving together. Match what the arrows do to the words, not the other way round."},{"id":"2B-03","g":"Lesson 2B — How two voices move","t":"Change 1: only the upper voice rises","s":"2B:4, 2B:8","teaches":"The first of the five changes: C4 holds while E4 rises to F4. One voice holds and one moves, which is oblique motion.","how":"The dashed square is where the upper voice began, on E4, and the arrow takes it to F4. The circle on C4 does not move. The page does not yet say what pair this makes; you will name it later, from the same picture."},{"id":"2B-04","g":"Lesson 2B — How two voices move","t":"Change 2: only the lower voice falls","s":"2B:4, 2B:8","teaches":"The second of the five changes: E4 holds while C4 falls to B3. One voice holds, one moves, so this is also oblique.","how":"The dashed circle on C4 is where the lower voice began; the arrow takes it left to B3. The square on E4 stays. The keyboard starts at B3, so the new low note is on the picture."},{"id":"2B-05","g":"Lesson 2B — How two voices move","t":"Change 3: only the lower voice rises","s":"2B:4, 2B:8","teaches":"The third of the five changes: E4 holds while C4 rises to D4. Again one voice holds and one moves, oblique motion, but the lower voice now moves up.","how":"The dashed circle on C4 is the start; the arrow takes the lower voice right to D4, one key below the held E4. Compare with change 2: same voice moving, the other direction."},{"id":"2B-06","g":"Lesson 2B — How two voices move","t":"Change 4: moving apart, B3 and F4, a diminished fifth","s":"2B:5, 2B:8","teaches":"Moving apart: both voices go in opposite directions, C4 down to B3 and E4 up to F4. The new pair B3 + F4 spans five letters and six semitones: a diminished fifth, shown in the tritone colour with its Plogger chip.","how":"The arrows above the keys show the two voices leaving C4 and E4 in opposite directions. The keys B3 and F4 are tinted with the tritone colour, and the six numbered arcs count every key from B3 to F4. The chip is a separate historic lens, not the colour. These are B3 and F4, not the C4 and F♯4 on the Palette card."},{"id":"2B-07","g":"Lesson 2B — How two voices move","t":"Change 5: both rise, a major third becomes a minor third","s":"2B:6, 2B:8","teaches":"Similar motion: both voices rise, the lower by 2 semitones and the upper by 1. Because the distances differ, the interval shrinks from a major third to a minor third, so this is similar and not strict parallel in this course.","how":"Two arrows go the same way but are not the same size: the lower voice steps over a black key (up 2) and the upper takes one step (up 1). That difference is why the pair changes size. The end keys carry the minor third colour."},{"id":"2B-08","g":"Lesson 2B — How two voices move","t":"The five changes, all from C4 + E4","s":"2B:8, 2B:9, 2B:11","teaches":"All five changes side by side, each restarting from the same C4 + E4: which voice moves, the new pair, its interval and its semitone count.","how":"Every row begins from C4 and E4 again; the changes do not chain. Read across: the change in words, the motion word, the end pair, then the interval with its colour. Rows 1 and 2 share a colour because they give the same interval size."},{"id":"2B-09","g":"Lesson 2B — How two voices move","t":"Similar, and strict parallel","s":"2B:6","teaches":"Same direction is not always strict parallel. In the course vocabulary strict parallel needs equal distances and an unchanged interval size. Some books use the word \"parallel\" more widely; both uses are respectable.","how":"The top keyboard is change 5 of the lesson: the two arrows are different sizes and the interval shrinks. The lower keyboard is the strict case, outside the five changes: both arrows are the same size and the end pair is a major third again. Compare the two arrow pairs and the two end colours."},{"id":"2B-10","g":"Lesson 2B — How two voices move","t":"A two-voice path in four stages","s":"2B:10","teaches":"A short path through four stages that uses the lesson's changes in a row. Each stage has its own pair and colour, and the path ends where it began.","how":"Read left to right, stage by stage. Each vertical coloured bar joins the two notes of that stage and names its interval underneath; the lines show how each voice travels between stages. Stages are steps in order, with no clock, so take as long as you like at each."},{"id":"2B-10b","g":"Lesson 2B — How two voices move","t":"Your two-voice path sheet","s":"2B:10","teaches":"A paper sheet for drawing your own four-stage path: write the upper and lower note at each stage, then the interval you find.","how":"Each column is one stage. Write the upper note in the top box and the lower note in the lower box, then work out the letters and semitones in the bottom box using your own keyboard. Join the boxes with lines to draw each voice's path. Nothing is scored."},{"id":"2B-11n","g":"Lesson 2B — How two voices move","t":"Contrary motion, together: the voices move toward each other","s":"2B:4","teaches":"Contrary motion also covers voices that move toward each other: the lower voice rises and the upper voice falls, and the gap between them closes.","how":"The dashed shapes are where the voices started, on B3 and F4. The arrows go toward each other and end on C4 and E4. The picture shows the movement only; nothing is named or counted, and no colour is used."},{"id":"2B-11","g":"Lesson 2B — How two voices move","t":"Contrary motion, together: B3 + F4 to C4 + E4","s":"2B:10","teaches":"Contrary motion can also go together: the lower voice rises one semitone and the upper falls one, closing the gap from a diminished fifth to a major third.","how":"This is the closing move of the four-stage path, drawn on the keyboard. The dashed shapes are B3 and F4; the arrows go toward each other and meet around C4 and E4, where the major third colour appears on the keys."},{"id":"2B-12","g":"Lesson 2B — How two voices move","t":"Two kinds of words: along a path, up a stage","s":"2B:7, 2B:9","teaches":"Movement words (oblique, contrary, similar, parallel) describe what voices do between stages, along the path. Interval words (the names of intervals) describe a pair of notes at a single stage, up the page.","how":"Follow the upper line left to right: that horizontal direction is movement. Then look straight up the page at stage 2: that vertical gap, the only coloured part, is the interval. One kind of word is about travelling, the other about distance at one moment."},{"id":"2B-13","g":"Lesson 2B — How two voices move","t":"The tritone family: B3–F4 beside the Palette card C4–F♯4","s":"2B:5","teaches":"Two different pairs, one tritone colour and one chip. B3–F4 (five letters) and C4–F♯4 (four letters) are both six semitones. The lesson uses B3–F4; the Palette card draws C4–F♯4. They are separate examples of the same family.","how":"Compare the two keyboards. The key colour and the chip are identical because both pairs are six semitones. The note names differ because the pairs sit in different places and are spelled with different letters. The Palette page (card 6) shows the second; this lesson works with the first."},{"id":"2C-01","g":"Lesson 2C — Two voices through time","t":"Two 36-second sketches: same upper line, different lower line","s":"2C:1, 2C:3","teaches":"Two sketches of the same melody over different lower lines. The upper line is identical in both; only the lower voice differs.","how":"Each timeline is 36 seconds wide. Upper lane first, lower lane below. Solid bars are notes, dashed boxes are rests. Compare the two upper lanes: they match exactly. Then compare the two lower lanes: Version A holds one note, Version B changes it twice."},{"id":"2C-02","g":"Lesson 2C — Two voices through time","t":"Version A: one voice holds the landscape","s":"2C:3","teaches":"With a held lower note, the pair changes only when the upper voice moves: C4 + E4 (major third), C4 + F4 (perfect fourth), then C4 + E4 again.","how":"Colour bands appear only while both voices sound; where the upper voice rests there is no pair, so there is no colour. Read the band labels left to right: M3 for 4 semitones, P4 for 5, M3 again. The lower voice is the same note under all three."},{"id":"2C-03","g":"Lesson 2C — Two voices through time","t":"Version B: the landscape begins to travel","s":"2C:4","teaches":"When the lower voice moves under the same melody, one moment changes: from 14 to 20 seconds the pair is B3 + F4, a diminished fifth, instead of C4 + F4.","how":"The dashed lines at 12 and 24 seconds mark where the lower voice changes. At both moments the upper lane is a dashed rest, so no pair changes at that instant. The F4 only sounds from 14 to 20 seconds, over B3, and that band carries the tritone colour."},{"id":"2C-04","g":"Lesson 2C — Two voices through time","t":"Same melody, one moment different: A above B","s":"2C:5","teaches":"Stack the two versions and look: the upper line and the first and last pairs are identical. Only from 14 to 20 seconds does the lower voice change what the pair is.","how":"Both timelines share one time scale so a vertical line crosses both at the same moment. The dashed outline covers 14 to 20 seconds. Inside it the two bands have different colours; outside it they match."},{"id":"2C-05","g":"Lesson 2C — Two voices through time","t":"Three snapshots: what stayed, what changed","s":"2C:5, 2C:6","teaches":"Three moments side by side. In two of them the two versions have the same pair; in exactly one, the middle, they differ.","how":"Read each column as one moment. The two badges in a column are the pair in Version A and the pair in Version B at that moment. Compare across the row: same, different, same. The middle column also gives the semitone count: 5 against 6."},{"id":"2C-06","g":"Lesson 2C — Two voices through time","t":"Four words: voice, vertical interval, voice leading, counterpoint","s":"2C:2, 2C:6","teaches":"Four words for the week's ideas, each with a small picture: one line, the gap between two notes at one moment, how lines travel between moments, and independent lines together.","how":"Each card gives the word, its meaning in one sentence, and a tiny picture built from the same marks as the rest of Week 2. The vertical interval card carries the only colour: C4 + E4, the major third from lesson 2A."},{"id":"2C-07","g":"Lesson 2C — Two voices through time","t":"Plan your miniature: two blank timelines","s":"2C:8, 2C:9","teaches":"A paper planning sheet for your own two sketches: draw where each voice sounds and rests, write note names, and finish three plan sentences.","how":"Each blank timeline runs from 0 to 45 seconds with a tick every 5. The upper lane is for your melody and the lower lane is for the line beneath. Draw bars for notes and leave gaps for rests, writing note names inside. Then complete the three sentences at the bottom. Nothing is scored or sent anywhere."},{"id":"2C-08","g":"Lesson 2C — Two voices through time","t":"What changes, and your response","s":"2C:9","teaches":"Separate what the notes did (a fact) from what you make of it (your response). The facts are shown; the response is yours and has no correct answer.","how":"The left panel states what changed, with the pairs and their colour bars. The right panel is empty on purpose: complete the sentence in your own words. There is no right feeling to write."},{"id":"2C-09","g":"Lesson 2C — Two voices through time","t":"Week 2 in three anchors","s":"2C:10","teaches":"The whole week in three sentences: an interval is a pair counted two ways; motion is what two voices do between pairs; two lines are enough to make changing harmony.","how":"Each card is one idea with one example from the week. Read them as a chain: first the pair, then the movement between pairs, then how a different lower line changes the harmony under the same melody. The picture ends here; Week 3 is introduced in text only."},{"id":"2C-10","g":"Lesson 2C — Two voices through time","t":"The truth check: the lower voice moves while the upper rests","s":"2C:4, 2C:5, 2C:6","teaches":"A check on the sketch: the lower voice changes at 12 and 24 seconds, but the upper voice is resting then, so F4 is never sounding when the lower note changes. F4 appears only from 14 to 20 seconds, over B3.","how":"Look at the two dashed markers. At each, the upper lane is a dashed rest box: no upper note is sounding. Then find the one band, 14 to 20 seconds, where F4 sits over B3. Nothing sounds as F4 over C4 in this version."}];let i=0,v='desktop',z=1,fitMode=true;const $=s=>document.getElementById(s),st=$('stage'),im=$('im');
D.forEach((a,k)=>{const o=document.createElement('option');o.value=k;o.textContent=a.id+' — '+a.t;$('sel').append(o)});
['desktop','phone','print'].forEach(x=>{const b=document.createElement('button');b.textContent=x;b.id='v'+x;b.onclick=()=>{v=x;show(true)};$('vb').append(b)});
function path(){const a=D[i];return 'assets/'+a.id+'/'+a.id+'.'+v}
function apply(){if(fitMode){z=Math.min(st.clientWidth/im.naturalWidth,st.clientHeight/im.naturalHeight,1)||1}im.style.width=(im.naturalWidth*z)+'px'}
function show(keep){const a=D[i];if(!keep)fitMode=true;im.onload=()=>{apply()};im.src=path()+'.png';$('sel').value=i;
['desktop','phone','print'].forEach(x=>$('v'+x).classList.toggle('on',x===v));$('raw').href=path()+'.png';$('svg').href=path()+'.svg';
$('info').innerHTML='<b>'+a.id+'</b> · '+a.g+' · steps '+a.s+' — <b>'+a.t+'</b><br><b>Teaches:</b> '+a.teaches+'<br><b>How to read:</b> '+a.how;location.hash=a.id+'/'+v}
const setz=f=>{fitMode=false;z=Math.max(.05,Math.min(8,z*f));apply()};
$('pv').onclick=()=>{i=(i+D.length-1)%D.length;show()};$('nx').onclick=()=>{i=(i+1)%D.length;show()};$('sel').onchange=e=>{i=+e.target.value;show()};
$('fit').onclick=()=>{fitMode=true;apply()};$('act').onclick=()=>{fitMode=false;z=1;apply()};$('zi').onclick=()=>setz(1.25);$('zo').onclick=()=>setz(.8);
$('bg').onchange=e=>st.style.background=e.target.value;
st.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setz(e.deltaY<0?1.1:.9)}},{passive:false});
let d=null;st.onmousedown=e=>{d=[e.clientX,e.clientY,st.scrollLeft,st.scrollTop];st.classList.add('drag')};
addEventListener('mouseup',()=>{d=null;st.classList.remove('drag')});addEventListener('mousemove',e=>{if(d){st.scrollLeft=d[2]-(e.clientX-d[0]);st.scrollTop=d[3]-(e.clientY-d[1])}});
addEventListener('resize',()=>fitMode&&apply());
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;const k=e.key;if(k==='ArrowRight')$('nx').click();else if(k==='ArrowLeft')$('pv').click();else if(k==='f')$('fit').click();else if(k==='a')$('act').click();else if(k==='+'||k==='=')setz(1.25);else if(k==='-')setz(.8);else if(k==='1')$('vdesktop').click();else if(k==='2')$('vphone').click();else if(k==='3')$('vprint').click()});
const h=location.hash.slice(1).split('/');if(h[0]){const k=D.findIndex(a=>a.id===h[0]);if(k>=0)i=k;if(['phone','print'].includes(h[1]))v=h[1]}show();
</script></body></html>
