roke-width="1.6" data-midi="66" data-key="black"/><rect x="563.8" y="150.0" width="68.4" height="68.2" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="68" data-key="black"/><rect x="698.3" y="150.0" width="68.4" height="68.2" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="70" data-key="black"/><text x="67.0" y="248.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">C</text><text x="421.0" y="248.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">F</text><text x="463.5" y="208.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1B2430">F♯</text><text x="67.0" y="278.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">60</text><text x="185.0" y="278.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">62</text><text x="303.0" y="278.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">64</text><text x="421.0" y="278.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">65</text><text x="539.0" y="278.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">67</text><text x="657.0" y="278.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">69</text><text x="775.0" y="278.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">71</text><text x="893.0" y="278.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">72</text></g><path d="M67.0,142.0 Q244.0,94.0 421.0,142.0" fill="none" stroke="#1D4E89" stroke-width="2.5" marker-end="url(#arr-ink)" data-from="60" data-to="65"/><text x="244.0" y="112.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430" stroke="#FBFAF6" stroke-width="4" paint-order="stroke" stroke-linejoin="round">5 hops</text><path d="M67.0,142.0 Q265.2,30.0 463.5,142.0" fill="none" stroke="#A8470F" stroke-width="2.5" marker-end="url(#arr-ink)" data-from="60" data-to="66"/><text x="265.2" y="80.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430" stroke="#FBFAF6" stroke-width="4" paint-order="stroke" stroke-linejoin="round">6 hops</text><path d="M421.0,300 L463.5,300" stroke="#1B2430" stroke-width="3" marker-end="url(#arr-ink)"/><text x="442.2" y="320.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1B2430">F → F♯: 1 hop</text></g><text x="12.0" y="385.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">C4 to F4 is 5 semitones, a perfect fourth. C4 to F♯4 is 6 semitones, an augmented fourth, also called the tritone.</text><text x="12.0" y="409.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">The melodic change itself is only F4 to F♯4: one semitone, the next key to the right (a black key).</text><text x="12.0" y="433.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">Count with your fingers first; the picture checks you. Terms come after listening.</text></g><text x="24.0" y="569.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">Original AMF graphic, rendered from data (no AI-drawn notation). C4 = MIDI 60.</text></svg>
