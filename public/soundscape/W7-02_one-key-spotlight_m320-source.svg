<svg xmlns="http://www.w3.org/2000/svg" width="320" height="725.0" viewBox="0 0 320 725.0" role="img" aria-labelledby="t d"><title id="t">W7-02 One Key Changes the Distance (m320-source)</title><desc id="d">C4 to F4 is 5 semitones; C4 to F♯4 is 6; F4 to F♯4 is one semitone, shown on a keyboard with hop arcs.</desc><metadata id="amf-source">{&quot;asset_id&quot;: &quot;W7-02&quot;, &quot;collections&quot;: {&quot;lydian&quot;: [60, 62, 64, 66, 67, 69, 71], &quot;major&quot;: [60, 62, 64, 65, 67, 69, 71]}, &quot;data_version&quot;: &quot;w78-data-v1.0&quot;, &quot;facts&quot;: {&quot;C4_to_F#4&quot;: 6, &quot;C4_to_F4&quot;: 5, &quot;F4_to_F#4&quot;: 1, &quot;shared_pitch_classes&quot;: [0, 2, 4, 7, 9, 11]}, &quot;grid&quot;: [{&quot;id&quot;: &quot;plain-F&quot;, &quot;melody&quot;: &quot;A&quot;, &quot;midi_changed&quot;: false, &quot;patch&quot;: &quot;plain&quot;, &quot;pitch&quot;: &quot;F&quot;}, {&quot;id&quot;: &quot;plain-F#&quot;, &quot;melody&quot;: &quot;B&quot;, &quot;midi_changed&quot;: true, &quot;patch&quot;: &quot;plain&quot;, &quot;pitch&quot;: &quot;F#&quot;}, {&quot;id&quot;: &quot;rich-F&quot;, &quot;melody&quot;: &quot;A&quot;, &quot;midi_changed&quot;: false, &quot;patch&quot;: &quot;rich&quot;, &quot;pitch&quot;: &quot;F&quot;}, {&quot;id&quot;: &quot;rich-F#&quot;, &quot;melody&quot;: &quot;B&quot;, &quot;midi_changed&quot;: true, &quot;patch&quot;: &quot;rich&quot;, &quot;pitch&quot;: &quot;F#&quot;}], &quot;melody&quot;: {&quot;A&quot;: [{&quot;dur&quot;: 1.5, &quot;midi&quot;: 60, &quot;name&quot;: &quot;C4&quot;, &quot;start&quot;: 0}, {&quot;dur&quot;: 1.5, &quot;midi&quot;: 62, &quot;name&quot;: &quot;D4&quot;, &quot;start&quot;: 1.5}, {&quot;dur&quot;: 1.5, &quot;midi&quot;: 64, &quot;name&quot;: &quot;E4&quot;, &quot;start&quot;: 3}, {&quot;dur&quot;: 2.5, &quot;midi&quot;: 65, &quot;name&quot;: &quot;F4&quot;, &quot;start&quot;: 4.5}, {&quot;dur&quot;: 1.5, &quot;midi&quot;: 67, &quot;name&quot;: &quot;G4&quot;, &quot;start&quot;: 7},