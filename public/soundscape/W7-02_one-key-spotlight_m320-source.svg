="22.0" height="57.0" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="70" data-key="black"/><text x="27.0" y="230.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">C</text><text x="141.0" y="230.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">F</text><text x="154.7" y="197.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1B2430">F♯</text><text x="27.0" y="260.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">60</text><text x="65.0" y="260.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">62</text><text x="103.0" y="260.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">64</text><text x="141.0" y="260.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">65</text><text x="179.0" y="260.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">67</text><text x="217.0" y="260.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">69</text><text x="255.0" y="260.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">71</text><text x="293.0" y="260.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">72</text></g><path d="M27.0,142.0 Q84.0,94.0 141.0,142.0" fill="none" stroke="#1D4E89" stroke-width="2.5" marker-end="url(#arr-ink)" data-from="60" data-to="65"/><text x="84.0" y="112.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430" stroke="#FBFAF6" stroke-width="4" paint-order="stroke" stroke-linejoin="round">5 hops</text><path d="M27.0,142.0 Q90.8,30.0 154.7,142.0" fill="none" stroke="#A8470F" stroke-width="2.5" marker-end="url(#arr-ink)" data-from="60" data-to="66"/><text x="90.8" y="80.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430" stroke="#FBFAF6" stroke-width="4" paint-order="stroke" stroke-linejoin="round">6 hops</text><path d="M141.0,282 L154.7,282" stroke="#1B2430" stroke-width="3" marker-end="url(#arr-ink)"/><text x="147.8" y="302.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#1B2430">F → F♯: 1 hop</text></g><text x="12.0" y="367.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">C4 to F4 is 5 semitones, a perfect</text><text x="12.0" y="385.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">fourth. C4 to F♯4 is 6 semitones, an</text><text x="12.0" y="403.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">augmented fourth, also called the</text><text x="12.0" y="421.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">tritone.</text><text x="12.0" y="445.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">The melodic change itself is only F4</text><text x="12.0" y="464.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">to F♯4: one semitone, the next key to</text><text x="12.0" y="482.2" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">the right (a black key).</text><text x="12.0" y="506.4" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">Count with your fingers first; the</text><text x="12.0" y="524.6" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">picture checks you. Terms come after</text><text x="12.0" y="542.8" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">listening.</text></g><text x="12.0" y="679.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">view: source</text><text x="12.0" y="697.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">Original AMF graphic, drawn from data.</text><text x="12.0" y="713.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">C4 = MIDI 60.</text></svg>
