<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="A04-native-t A04-native-d"><title id="A04-native-t">C as home, with the white-key journey</title><desc id="A04-native-d">C glows at the centre as the chosen home note in this exercise. Around it, in order: D, E, F, G, A and B. A dotted path goes out from C through each note and back home. Distance from the centre is decoration, not a measurement.</desc><rect width="100%" height="100%" fill="#fff"/><path d="M500 500 L500 170 A330 330 0 0 1 785.7883832488648 335 A330 330 0 0 1 785.7883832488648 665 A330 330 0 0 1 500 830 A330 330 0 0 1 214.21161675113524 665 A330 330 0 0 1 214.21161675113524 335 L500 500" fill="none" stroke="#8f4f8a" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 16" opacity=".8"/><circle cx="500" cy="170" r="54" fill="#fff" stroke="#d99a45" stroke-width="5"/><text x="500" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" text-anchor="middle" fill="#3e2241">D</text><circle cx="785.7883832488648" cy="335" r="54" fill="#fff" stroke="#d99a45" stroke-width="5"/><text x="785.7883832488648" y="355" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" text-anchor="middle" fill="#3e2241">E</text><circle cx="785.7883832488648" cy="665" r="54" fill="#fff" stroke="#d99a45" stroke-width="5"/><text x="785.7883832488648" y="685" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" text-anchor="middle" fill="#3e2241">F</text><circle cx="500" cy="830" r="54" fill="#fff" stroke="#d99a45" stroke-width="5"/><text x="500" y="850" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" text-anchor="middle" fill="#3e2241">G</text><circle cx="214.21161675113524" cy="665" r="54" fill="#fff" stroke="#d99a45" stroke-width="5"/><text x="214.21161675113524" y="685" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" text-anchor="middle" fill="#3e2241">A</text><circle cx="214.21161675113524" cy="335" r="54" fill="#fff" stroke="#d99a45" stroke-width="5"/><text x="214.21161675113524" y="355" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" text-anchor="middle" fill="#3e2241">B</text><circle cx="500" cy="500" r="78" fill="#e8e0ea" stroke="#c8811f" stroke-width="6"/><text x="500" y="526" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" text-anchor="middle" fill="#3e2241">C</text></svg>
