7" y="80.75" width="28.651999999999994" height="100.69999999999999" rx="4.75" fill="url(#A06native-b)"/><rect x="292.21999999999997" y="80.75" width="28.651999999999994" height="100.69999999999999" rx="4.75" fill="url(#A06native-b)"/><text x="30.4" y="235.60000000000002" font-family="Georgia, 'Times New Roman', serif" font-size="24.7" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><text x="376.2" y="235.60000000000002" font-family="Georgia, 'Times New Roman', serif" font-size="24.7" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><path d="M30.4 67.7 Q203.29999999999998 11.700000000000003 370.2 65.7" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 7"/><text x="203.29999999999998" y="25.700000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="middle" fill="#6d326e" font-style="italic">one octave up</text><text x="30.4" y="268.9" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#786a75">lower C</text><text x="376.2" y="268.9" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#786a75">higher C</text><text x="6" y="304.4" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Both are called C. The second is higher: it is one</text><text x="6" y="326.15" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">octave above the first. Play the lower C, then the</text><text x="6" y="347.9" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">higher C, then back.</text></svg>
