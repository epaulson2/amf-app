d"/><path d="M177.204 218.40000000000003 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="165.90200000000002" y="252.25670000000002" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">4</text><path d="M182.204 216.40000000000003 q12.298000000000002 20.9066 24.596000000000004 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M201.8 218.40000000000003 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="194.502" y="248.85330000000005" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">5</text><path d="M206.8 216.40000000000003 q28.599999999999994 48.61999999999999 57.19999999999999 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M259 218.40000000000003 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="235.4" y="262.71000000000004" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">6</text><path d="M35.2 270.40000000000003 h228.8" stroke="#6d326e" stroke-width="1.4" stroke-dasharray="4 4"/><text x="149.6" y="292.40000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#6d326e">6 semitones</text><text x="6" y="322.40000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">B to F is a diminished fifth, also</text><text x="6" y="344.15000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">called a tritone. Count letters: B C D</text><text x="6" y="365.90000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">E F is five letter names. Count keys:</text><text x="6" y="387.65000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">six semitones. The two counts differ</text><text x="6" y="409.40000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">on purpose.</text></svg>
