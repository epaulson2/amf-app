<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 486" width="320" height="486" role="img" aria-labelledby="A02-native-t A02-native-d"><title id="A02-native-t">Pitch versus loudness</title><desc id="A02-native-d">Top: seven white keys; a key and the key to its right are highlighted, with lower to the left and higher to the right. Bottom: the same key played softer and louder, shown as small and large ripples. Higher or lower depends on which key; louder or softer depends on how hard you press.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(0 0)"><text x="6" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.2" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">HIGHER OR LOWER: WHICH KEY</text><rect x="5.949999999999999" y="54.9" width="42.5" height="149.6" rx="5.95" fill="#fff" stroke="#bfa8b3" stroke-width="1.19"/><rect x="50.15" y="54.9" width="42.5" height="149.6" rx="5.95" fill="#e8e0ea" stroke="#c8811f" stroke-width="2.21"/><rect x="94.35" y="54.9" width="42.5" height="149.6" rx="5.95" fill="#e8e0ea" stroke="#3f9b92" stroke-width="2.21"/><rect x="138.54999999999998" y="54.9" width="42.5" height="149.6" rx="5.95" fill="#fff" stroke="#bfa8b3" stroke-width="1.19"/><rect x="182.75" y="54.9" width="42.5" height="149.6" rx="5.95" fill="#fff" stroke="#bfa8b3" stroke-width="1.19"/><rect x="226.95" y="54.9" width="42.5" height="149.6" rx="5.95" fill="#fff" stroke="#bfa8b3" stroke-width="1.19"/><rect x="271.15000000000003" y="54.9" width="42.5" height="149.6" rx="5.95" fill="#fff" stroke="#bfa8b3" stroke-width="1.19"/><rect x="33.38799999999999" y="54.05" width="25.635999999999996" height="90.1" rx="4.25" fill="#4a2a4d"/><rect x="83.776" y="54.05" width="25.635999999999996" height="90.1" rx="4.25" fill="#4a2a4d"/><rect x="165.104" y="54.05" width="25.635999999999996" height="90.1" rx="4.25" fill="#4a2a4d"/><rect x="213.28199999999998" y="54.05" width="25.635999999999996" height="90.1" rx="4.25" fill="#4a2a4d"/><rect x="261.46" y="54.05" width="25.635999999999996" height="90.1" rx="4.25" fill="#4a2a4d"/><text x="27.2" y="46.9" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">← lower</text><text x="292.4" y="46.9" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">higher →</text></g><g transform="translate(0 235)"><text x="6" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.2" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LOUDER OR SOFTER: HOW HARD</text><circle cx="95.87999999999998" cy="62" r="18" fill="none" stroke="#6d326e" stroke-width="2"/><circle cx="95.87999999999998" cy="62" r="7" fill="#6d326e"/><text x="95.87999999999998" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#3e2241">softer</text><text x="95.87999999999998" y="138" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">same key</text><circle cx="223.71999999999997" cy="62" r="30" fill="none" stroke="#6d326e" stroke-width="4"/><circle cx="223.71999999999997" cy="62" r="7" fill="#6d326e"/><text x="223.71999999999997" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#3e2241">louder</text><text x="223.71999999999997" y="138" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">same key</text></g><g transform="translate(0 399)"><text x="6" y="12" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Pitch is where a note lives: right is</text><text x="6" y="33.75" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">higher, left is lower. Loudness is how</text><text x="6" y="55.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">strongly you play it. Pressing the same</text><text x="6" y="77.25" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">key harder makes it louder, not higher.</text></g></svg>
