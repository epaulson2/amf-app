<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" width="660" height="220" role="img" aria-labelledby="A11-native-t A11-native-d"><title id="A11-native-t">Your own sound-to-colour map</title><desc id="A11-native-d">Three empty dashed circles labelled sound 1, sound 2 and sound 3, each with two blank writing lines. Your own sound-to-colour interpretation: there is no fixed colour for any note.</desc><defs>
<linearGradient id="A11native-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="A11native-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="A11native-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="A11native-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="A11native-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="A11native-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="A11native-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><text x="0" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" text-anchor="start" fill="#3e2241">Your own sound-to-color interpretation</text><g transform="translate(0 28)"><circle cx="110" cy="70" r="46" fill="none" stroke="#bd9baf" stroke-width="2" stroke-dasharray="7 6"/><text x="110" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">sound 1</text><path d="M50 168 h120 M50 190 h120" stroke="#d9c9d1" stroke-width="1.4"/><circle cx="330" cy="70" r="46" fill="none" stroke="#bd9baf" stroke-width="2" stroke-dasharray="7 6"/><text x="330" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">sound 2</text><path d="M270 168 h120 M270 190 h120" stroke="#d9c9d1" stroke-width="1.4"/><circle cx="550" cy="70" r="46" fill="none" stroke="#bd9baf" stroke-width="2" stroke-dasharray="7 6"/><text x="550" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">sound 3</text><path d="M490 168 h120 M490 190 h120" stroke="#d9c9d1" stroke-width="1.4"/></g></svg>
