<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 610" width="660" height="610" role="img" aria-labelledby="A09-native-t A09-native-d"><title id="A09-native-t">A note that stays while others visit</title><desc id="A09-native-d">Three timelines of six seconds. In each, C sounds the whole time on the lower line, while one visiting note (E, then G, then D in the three examples) sounds from about 1 to 4.5 seconds on the upper line.</desc><defs>
