<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 434" width="560" height="434" role="img" aria-labelledby="S12-native-t S12-native-d"><title id="S12-native-t">How to read our pictures</title><desc id="S12-native-d">Five symbols: a glow marks the chosen home note; a ribbon is a voice; overlap is what is shared; solid is sounding and dotted is rest or optional; numbers on keys and timelines are the measurement. The size and colour of painted shapes are decoration only.</desc><defs>
<linearGradient id="S12native-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="S12native-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="S12native-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="S12native-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="S12native-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="S12native-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="S12native-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><g transform="translate(0 0)"><circle cx="30" cy="26" r="14" fill="#f6b94f" stroke="#c8811f" stroke-width="2"/></g><text x="86" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.4">GLOW</text><text x="86" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">A glowing centre is the note chosen as home in that</text><text x="86" y="54.474999999999994" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">exercise.</text><g transform="translate(0 80)"><rect x="6" y="14" width="48" height="24" rx="12" fill="#8fcdc6" stroke="#3f9b92" stroke-width="2"/></g><text x="86" y="92" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.4">RIBBON</text><text x="86" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">A separate ribbon or bar is a distinct voice (a line of</text><text x="86" y="134.475" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">notes).</text><g transform="translate(0 160)"><circle cx="22" cy="26" r="16" fill="none" stroke="#c8811f" stroke-width="2.2"/><circle cx="38" cy="26" r="16" fill="none" stroke="#3f9b92" stroke-width="2.2"/></g><text x="86" y="172" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.4">OVERLAP</text><text x="86" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">Where two shapes overlap, that is what the two situations</text><text x="86" y="214.475" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">share.</text><g transform="translate(0 240)"><path d="M4 20 h52" stroke="#6d326e" stroke-width="3"/><path d="M4 34 h52" stroke="#6d326e" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"/></g><text x="86" y="252" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.4">SOLID / DOTTED</text><text x="86" y="272" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">Solid means sounding. Dotted or dashed means resting or</text><text x="86" y="294.475" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">optional.</text><g transform="translate(0 320)"><path d="M6 36 h48 M6 30 v12 M18 32 v8 M30 30 v12 M42 32 v8 M54 30 v12" stroke="#6d326e" stroke-width="2"/></g><text x="86" y="332" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.4">NUMBERS</text><text x="86" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">Numbers on the keys or timelines are the measurement. Trust</text><text x="86" y="374.475" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">those.</text><text x="0" y="420" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#786a75" font-style="italic">The size and colour of painted shapes are decoration, never a measurement.</text></svg>
