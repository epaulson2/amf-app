0000000000003" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1f5c56">upper voice</text><text x="6" y="259.40000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A dyad is two notes sounding together:</text><text x="6" y="281.15000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C below, E above. Play C alone, E</text><text x="6" y="302.90000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">alone, then both.</text></svg>
