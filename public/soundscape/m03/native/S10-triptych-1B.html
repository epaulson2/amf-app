strong>. Fuller teaching is in the lesson step that explains this picture.</figcaption></figure><figure><img src="B01-pair.svg" alt="Two keyboards. Ending 1 plays C D E F G A B and stops on B. Ending 2 plays the same seven notes and then adds the higher C, highlighted as home. Only the second adds the higher C."><figcaption><strong>Same beginning, different last note</strong>. Fuller teaching is in the lesson step that explains this picture.</figcaption></figure></div><p class="muted">Play each idea on your own keyboard. The site makes no sound.</p></main></body></html>
