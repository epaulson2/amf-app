:relative"><figcaption><strong>Shared and only-here notes at the F moment</strong>. Fuller teaching is in the lesson step that explains this picture.</figcaption></figure><figure><img src="F07-native.svg" alt="Left: C to F is five semitones, a perfect fourth. Right: B to F is six semitones, a diminished fifth or tritone. The melody note F is the same in both."><figcaption><strong>C to F versus B to F</strong>. Fuller teaching is in the lesson step that explains this picture.</figcaption></figure></div><p class="muted">Play each idea on your own keyboard. The site makes no sound.</p></main></body></html>
