37" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">F</text><rect x="499.3333333333333" y="72" width="87.99999999999994" height="34" rx="7" fill="#d5ece9" stroke="#3f9b92" stroke-width="1.6"/><text x="543.3333333333333" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><path d="M118 128 h528" stroke="#a3778f" stroke-width="1.4"/><path d="M118 128 v6" stroke="#a3778f"/><text x="118" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">0</text><path d="M206 128 v6" stroke="#a3778f"/><text x="206" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">6</text><path d="M294 128 v6" stroke="#a3778f"/><text x="294" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">12</text><path d="M382 128 v6" stroke="#a3778f"/><text x="382" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">18</text><path d="M470 128 v6" stroke="#a3778f"/><text x="470" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">24</text><path d="M558 128 v6" stroke="#a3778f"/><text x="558" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">30</text><path d="M646 128 v6" stroke="#a3778f"/><text x="646" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">36</text><text x="646" y="168" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-si