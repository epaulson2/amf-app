<text x="565.3333333333333" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">B</text><rect x="602" y="72" width="41.066666666666606" height="34" rx="7" fill="#8fcdc6" stroke="#3f9b92" stroke-width="1.6"/><text x="622.5333333333333" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><path d="M118 128 h528" stroke="#a3778f" stroke-width="1.4"/><path d="M118 128 v6" stroke="#a3778f"/><text x="118" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">0</text><path d="M206 128 v6" stroke="#a3778f"/><text x="206" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">6</text><path d="M294 128 v6" stroke="#a3778f"/><text x="294" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">12</text><path d="M382 128 v6" stroke="#a3778f"/><text x="382" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">18</text><path d="M470 128 v6" stroke="#a3778f"/><text x="470" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">24</text><path d="M558 128 v6" stroke="#a3778f"/><text x="558" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">30</text><path d="M646 128 v6" stroke="#a3778f"/><text x="646" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">36</text><text x="646" y="168" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#786a75" font-style="italic">seconds</text></g></g><g transform="translate(0 404)"><text x="0" y="8" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#5c465b">Both share the held lower C (0 to 36 s) and the upper E (8-12), G (15-19), D (23-27) and</text><text x="0" y="29.025" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#5c465b">B (29-32). Only the second adds the final higher C.</text></g></svg>
