<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 455" width="660" height="455" role="img" aria-labelledby="C07-native-t C07-native-d"><title id="C07-native-t">The same 36 seconds, two endings</title><desc id="C07-native-d">Two 36-second timelines with the same held lower C and the same upper notes E, G, D, B. The second adds one extra upper note, a higher C from 33 to 35.8 seconds.</desc><defs>
