<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 362" width="640" height="362" role="img" aria-labelledby="S05-native-t S05-native-d"><title id="S05-native-t">Set up your own keyboard</title><desc id="S05-native-d">A drawing of a keyboard with black keys in groups of two, then three, then two; left is lower and right is higher. A generic volume knob and three steps: choose a gentle sound, set a comfortable volume, notice the black-key groups.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(0 0)"><text x="6" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.65040650406504" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.2">YOUR KEYBOARD: LEFT IS LOWER, RIGHT IS HIGHER</text><path d="M35.352 53 v-7.2 h80.49600000000001 v7.2" fill="none" stroke="#a3778f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="75.6" y="40.4" font-family="Georgia, 'Times New Roman', serif" font-size="17.1" font-weight="700" text-anchor="middle" fill="#6d326e">2</text><path d="M174.816 53 v-7.2 h129.16799999999998 v7.2" fill="none" stroke="#a3778f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="239.39999999999998" y="40.4" font-family="Georgia, 'Times New Roman', serif" font-size="17.1" font-weight="700" text-anchor="middle" fill="#6d326e">3</text><path d="M362.952 53 v-7.2 h80.4960000000001 v7.2" fill="none" stroke="#a3778f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="403.20000000000005" y="40.4" font-family="Georgia, 'Times New Roman', serif" font-size="17.1" font-weight="700" text-anchor="middle" fill="#6d326e">2</text><rect x="6.300000000000001" y="60.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="53.1" y="60.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="99.9" y="60.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="146.70000000000002" y="60.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="193.5" y="60.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="240.3" y="60.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="287.09999999999997" y="60.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="333.9" y="60.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="380.7" y="60.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="427.5" y="60.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="35.352" y="59.300000000000004" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="88.70400000000001" y="59.300000000000004" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="174.816" y="59.300000000000004" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="225.828" y="59.300000000000004" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="276.84" y="59.300000000000004" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="362.952" y="59.300000000000004" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="416.3040000000001" y="59.300000000000004" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><text x="28.8" y="242.60000000000002" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">← lower</text><text x="450" y="242.60000000000002" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">higher →</text></g><g transform="translate(0 249.60000000000002)"><g><circle cx="40" cy="40" r="26" fill="#fff" stroke="#a3778f" stroke-width="2.4"/><path d="M40 40 L52 22" stroke="#6d326e" stroke-width="3.4" stroke-linecap="round"/><path d="M16.252622263311686 20.073584099717277 L11.656355604597817 16.21685844159804" stroke="#a3778f" stroke-width="2"/><path d="M29.397375556904272 10.86952875563684 L27.345254696950256 5.2313730309213895" stroke="#a3778f" stroke-width="2"/><path d="M45.38309350767484 9.470959656621552 L46.424982573676424 3.5621131385483054" stroke="#a3778f" stroke-width="2"/><path d="M59.92641590028272 16.252622263311682 L63.78314155840196 11.656355604597813" stroke="#a3778f" stroke-width="2"/><path d="M69.13047124436316 29.397375556904272 L74.76862696907861 27.345254696950256" stroke="#a3778f" stroke-width="2"/></g><text x="100" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">1  Choose a gentle sound: a piano, a soft electric piano or a warm pad.</text><text x="100" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">2  Start with a comfortable, quiet volume. You can turn it up later.</text><text x="100" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5c465b">3  Notice the black keys: groups of two, then three. They are your map.</text></g></svg>
