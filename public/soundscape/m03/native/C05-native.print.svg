<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 227" width="660" height="227" role="img" aria-labelledby="C05-native-t C05-native-d"><title id="C05-native-t">Time as a musical relationship</title><desc id="C05-native-d">Twelve-second timeline with one-second ticks. Lower C 0 to 12. Upper E 2 to 4, G 5 to 7, D 9 to 11.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(0 0)"><rect x="118" y="8" width="528" height="46" rx="8" fill="#fff" stroke="#e5d6dc" stroke-width="1"/><text x="6" y="36" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" text-anchor="start" fill="#7a4a12">Lower voice</text><rect x="118" y="14" width="528" height="34" rx="7" fill="#f1dfc0" stroke="#c8811f" stroke-width="1.6"/><text x="382" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><rect x="118" y="66" width="528" height="46" rx="8" fill="#fff" stroke="#e5d6dc" stroke-width="1"/><text x="6" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" text-anchor="start" fill="#1f5c56">Upper voice</text><rect x="206" y="72" width="88" height="34" rx="7" fill="#d5ece9" stroke="#3f9b92" stroke-width="1.6"/><text x="250" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><rect x="338" y="72" width="88" height="34" rx="7" fill="#d5ece9" stroke="#3f9b92" stroke-width="1.6"/><text x="382" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">G</text><rect x="514" y="72" width="88" height="34" rx="7" fill="#d5ece9" stroke="#3f9b92" stroke-width="1.6"/><text x="558" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">D</text><path d="M118 128 h528" stroke="#a3778f" stroke-width="1.4"/><path d="M118 128 v6" stroke="#a3778f"/><text x="118" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">0</text><path d="M162 128 v6" stroke="#a3778f"/><text x="162" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">1</text><path d="M206 128 v6" stroke="#a3778f"/><text x="206" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">2</text><path d="M250 128 v6" stroke="#a3778f"/><text x="250" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">3</text><path d="M294 128 v6" stroke="#a3778f"/><text x="294" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">4</text><path d="M338 128 v6" stroke="#a3778f"/><text x="338" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">5</text><path d="M382 128 v6" stroke="#a3778f"/><text x="382" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">6</text><path d="M426 128 v6" stroke="#a3778f"/><text x="426" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">7</text><path d="M470 128 v6" stroke="#a3778f"/><text x="470" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">8</text><path d="M514 128 v6" stroke="#a3778f"/><text x="514" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middl