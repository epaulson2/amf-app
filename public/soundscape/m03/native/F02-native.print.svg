<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 235" width="660" height="235" role="img" aria-labelledby="F02-native-t F02-native-d"><title id="F02-native-t">Held C beneath the same melody</title><desc id="F02-native-d">A 36-second timeline: the lower voice holds C throughout; the upper voice plays E from 4 to 10, F from 14 to 20, E from 26 to 32, with rests between.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(0 0)"><rect x="118" y="8" width="528" height="46" rx="8" fill="#fff" stroke="#e5d6dc" stroke-width="1"/><text x="6" y="36" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" text-anchor="start" fill="#7a4a12">Lower voice</text><rect x="118" y="14" width="528" height="34" rx="7" fill="#f1dfc0" stroke="#c8811f" stroke-width="1.6"/><text x="382" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><rect x="118" y="66" width="528" height="46" rx="8" fill="#fff" stroke="#e5d6dc" stroke-width="1"/><text x="6" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" text-anchor="start" fill="#1f5c56">Upper voice</text><rect x="176.66666666666666" y="72" width="88.00000000000003" height="34" rx="7" fill="#d5ece9" stroke="#3f9b92" stroke-width="1.6"/><text x="220.66666666666669" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><rect x="323.33333333333337" y="72" width="88" height="34" rx="7" fill="#d5ece9" stroke="#3f9b92" stroke-width="1.6"/><text x="367.33333333333337" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">F</text><rect x="499.3333333333333" y="72" width="87.99999999999994" height="34" rx="7" fill="#d5ece9" stroke="#3f9b92" stroke-width="1.6"/><text x="543.3333333333333" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><rect x="120" y="72" width="54.66666666666666" height="34" rx="7" fill="none" stroke="#a3778f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="147.33333333333331" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">rest</text><rect x="266.6666666666667" y="72" width="54.666666666666686" height="34" rx="7" fill="none" stroke="#a3778f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="294" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">rest</text><rect x="413.33333333333337" y="72" width="83.99999999999994" height="34" rx="7" fill="none" stroke="#a3778f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="455.33333333333337" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">rest</text><rect x="589.3333333333333" y="72" width="54.66666666666674" height="34" rx="7" fill="none" stroke="#a3778f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="616.6666666666666" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">rest</text><path d="M118 128 h528" stroke="#a3778f" stroke-width="1.4"/><path d="M118 128 v6" stroke="#a3778f"/><text x="118" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">0</text><path d="M206 128 v6" stroke="#a3778f"/><text x="206" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">6</text><path d="M294 128 v6" stroke="#a3778f"/><text x="294" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">12</text><path d="M382 128 v6" stroke="#a3778f"/><text x="382" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">18</text><path d="M470 128 v6" stroke="#a3778f"/><text x="470" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">24</text><path d="M558 128 v6" stroke="#a3778f"/><text x="558" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">30</text><path d="M646 128 v6" stroke="#a3778f"/><text x="646" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75">36</text><text x="646" y="168" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#786a75" font-style="italic">seconds</text></g><g transform="translate(0 184)"><text x="0" y="8" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">The lower C is held for all 36 seconds. The upper voice visits E (4-10 s), F (14-20 s)</text><text x="0" y="29.025" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">and E (26-32 s), then leaves each time. C to E is 4 semitones; C to F is 5.</text></g></svg>
