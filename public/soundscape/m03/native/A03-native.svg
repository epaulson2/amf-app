.6"/><rect x="423" y="38" width="50" height="176" rx="7" fill="url(#A03native-w)" stroke="#bfa8b3" stroke-width="1.4"/><rect x="475" y="38" width="50" height="176" rx="7" fill="url(#A03native-w)" stroke="#bfa8b3" stroke-width="1.4"/><rect x="39.279999999999994" y="37" width="30.159999999999997" height="106" rx="5" fill="url(#A03native-b)"/><rect x="98.56" y="37" width="30.159999999999997" height="106" rx="5" fill="url(#A03native-b)"/><rect x="194.24" y="37" width="30.159999999999997" height="106" rx="5" fill="url(#A03native-b)"/><rect x="250.92" y="37" width="30.159999999999997" height="106" rx="5" fill="url(#A03native-b)"/><rect x="307.59999999999997" y="37" width="30.159999999999997" height="106" rx="5" fill="url(#A03native-b)"/><rect x="403.28" y="37" width="30.159999999999997" height="106" rx="5" fill="url(#A03native-b)"/><rect x="462.56000000000006" y="37" width="30.159999999999997" height="106" rx="5" fill="url(#A03native-b)"/><text x="32" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><text x="396" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><path d="M32 230 v-14 m-5 6 l5 -7 l5 7" fill="none" stroke="#6d326e" stroke-width="2.2" stroke-linecap="round"/><path d="M396 230 v-14 m-5 6 l5 -7 l5 7" fill="none" stroke="#6d326e" stroke-width="2.2" stroke-linecap="round"/><text x="6" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">Find a group of two black keys. The white key just to the left of it</text><text x="6" y="267.75" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">is C. The next group of two gives you the next C.</text></svg>
