<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 532 298" width="532" height="298" role="img" aria-labelledby="A03-native-t A03-native-d"><title id="A03-native-t">Finding C from the black keys</title><desc id="A03-native-d">Ten white keys. Black keys sit in a group of two, then three, then two, marked 2, 3, 2. The white key just left of each group of two is C; both Cs are highlighted.</desc><defs>
