<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 411" width="316" height="411" role="img" aria-labelledby="D10-native-t D10-native-d"><title id="D10-native-t">Lesson 2A recap</title><desc id="D10-native-d">An interval is counted in semitones: C to E is four, C to F is five. Then one voice moves while the other stays: C and E become C and F.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(0 0)"><text x="6" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="10.526315789473685" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.2">C+E IS 4 · C+F IS 5</text><rect x="5.6000000000000005" y="32.4" width="40" height="140.8" rx="5.6000000000000005" fill="#e8e0ea" stroke="#c8811f" stroke-width="2.08"/><rect x="47.2" y="32.4" width="40" height="140.8" rx="5.6000000000000005" fill="#fff" stroke="#bfa8b3" stroke-width="1.1199999999999999"/><rect x="88.8" y="32.4" width="40" height="140.8" rx="5.6000000000000005" fill="#e8e0ea" stroke="#3f9b92" stroke-width="2.08"/><rect x="130.4" y="32.4" width="40" height="140.8" rx="5.6000000000000005" fill="#e8e0ea" stroke="#3f9b92" stroke-width="2.08"/><rect x="31.423999999999996" y="31.599999999999998" width="24.128" height="84.80000000000001" rx="4" fill="#4a2a4d"/><rect x="78.84800000000001" y="31.599999999999998" width="24.128" height="84.80000000000001" rx="4" fill="#4a2a4d"/><text x="25.6" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="20.8" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><text x="67.2" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="14.4" font-weight="500" text-anchor="middle" fill="#8a6f85">D</text><text x="108.80000000000001" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="20.8" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><text x="150.4" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="20.8" font-weight="700" text-anchor="middle" fill="#4c2346">F</text></g><g transform="translate(0 207.20000000000002)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.2">THEN ONE VOICE MOVES</text><g transform="translate(0 0)"><rect x="3.5" y="34" width="25" height="88" rx="3.5" fill="#fff" stroke="#bfa8b3" stroke-width="0.7"/><rect x="29.5" y="34" width="25" height="88" rx="3.5" fill="#e8e0ea" stroke="#c8811f" stroke-width="1.3"/><rect x="55.5" y="34" width="25" height="88" rx="3.5" fill="#fff" stroke="#bfa8b3" stroke-width="0.7"/><rect x="81.5" y="34" width="25" height="88" rx="3.5" fill="#e8e0ea" stroke="#3f9b92" stroke-width="1.3"/><rect x="107.5" y="34" width="25" height="88" rx="3.5" fill="#fff" stroke="#bfa8b3" stroke-width="0.7"/><rect x="45.64" y="33.5" width="15.079999999999998" height="53" rx="2.5" fill="#4a2a4d"/><rect x="75.28" y="33.5" width="15.079999999999998" height="53" rx="2.5" fill="#4a2a4d"/><text x="42" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><text x="94" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><text x="68" y="151" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#3e2241">C + E</text><text x="68" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#a67664">1</text></g><text x="158" y="86.5" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" text-anchor="middle" fill="#6d326e">→</text><g transform="translate(180 0)"><rect x="3.5" y="34" width="25" height="88" rx="3.5" fill="#fff" stroke="#bfa8b3" stroke-width="0.7"/><rect x="29.5" y="34" width="25" height="88" rx="3.5" fill="#e8e0ea" stroke="#c8811f" stroke-width="1.3"/>