<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 429" width="316" height="429" role="img" aria-labelledby="D06-native-t D06-native-d"><title id="D06-native-t">Hold E, move the lower C</title><desc id="D06-native-d">Two examples. First C and E become B and E: the lower voice falls one semitone. Second C and E become D and E: the lower voice rises two semitones. The upper E stays.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(0 0)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.2" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LOWER C FALLS TO B</text><g transform="translate(0 0)"><rect x="3.5" y="34" width="25" height="88" rx="3.5" fill="#fff" stroke="#bfa8b3" stroke-width="0.7"/><rect x="29.5" y="34" width="25" height="88" rx="3.5" fill="#e8e0ea" stroke="#c8811f" stroke-width="1.3"/><rect x="55.5" y="34" width="25" height="88" rx="3.5" fill="#fff" stroke="#bfa8b3" stroke-width="0.7"/><rect x="81.5" y="34" width="25" height="88" rx="3.5" fill="#e8e0ea" stroke="#3f9b92" stroke-width="1.3"/><rect x="107.5" y="34" width="25" height="88" rx="3.5" fill="#fff" stroke="#bfa8b3" stroke-width="0.7"/><rect x="45.64" y="33.5" width="15.079999999999998" height="53" rx="2.5" fill="#4a2a4d"/><rect x="75.28" y="33.5" width="15.079999999999998" height="53" rx="2.5" fill="#4a2a4d"/><text x="42" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><text x="94" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><text x="68" y="151" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#3e2241">C + E</text><text x="68" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#a67664">1</text></g><text x="158" y="86.5" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" text-anchor="middle" fill="#6d326e">→</text><g transform="translate(180 0)"><rect x="3.5" y="34" width="25" height="88" rx="3.5" fill="#e8e0ea" stroke="#c8811f" stroke-width="1.3"/><rect x="29.5" y="34" width="25" height="88" rx="3.5" fill="#fff" stroke="#bfa8b3" stroke-width="0.7"/><rect x="55.5" y="34" width="25" height="88" rx="3.5" fill="#fff" stroke="#bfa8b3" stroke-width="0.7"/><rect x="81.5" y="34" width="25" height="88" rx="3.5" fill="#e8e0ea" stroke="#3f9b92" stroke-width="1.3"/><rect x="107.5" y="34" width="25" height="88" rx="3.5" fill="#fff" stroke="#bfa8b3" stroke-width="0.7"/><rect x="45.64" y="33.5" width="15.079999999999998" height="53" rx="2.5" fill="#4a2a4d"/><rect x="75.28" y="33.5" width="15.079999999999998" height="53" rx="2.5" fill="#4a2a4d"/><text x="16" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4c2346">B</text><text x="94" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><text x="68" y="151" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#3e2241">B + E</text><text x="68" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#a67664">2</text></g><text x="0" y="179" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" text-anchor="start" fill="#5c465b" font-style="italic" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">lower falls 1 · upper stays</text></g><g transform="translate(0 225.3)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="70