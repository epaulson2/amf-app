<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 290" width="324" height="290" role="img" aria-labelledby="A01-native-t A01-native-d"><title id="A01-native-t">One note on a keyboard</title><desc id="A01-native-d">A short run of six white keys with one key highlighted and no letters. One sound only: not a chord, not a scale.</desc><rect width="100%" height="100%" fill="#fff"/><rect x="7" y="8" width="50" height="176" rx="7" fill="#fff" stroke="#bfa8b3" stroke-width="1.4"/><rect x="59" y="8" width="50" height="176" rx="7" fill="#fff" stroke="#bfa8b3" stroke-width="1.4"/><rect x="111" y="8" width="50" height="176" rx="7" fill="#e8e0ea" stroke="#c8811f" stroke-width="2.6"/><rect x="163" y="8" width="50" height="176" rx="7" fill="#fff" stroke="#bfa8b3" stroke-width="1.4"/><rect x="215" y="8" width="50" height="176" rx="7" fill="#fff" stroke="#bfa8b3" stroke-width="1.4"/><rect x="267" y="8" width="50" height="176" rx="7" fill="#fff" stroke="#bfa8b3" stroke-width="1.4"/><rect x="39.279999999999994" y="7" width="30.159999999999997" height="106" rx="5" fill="#4a2a4d"/><rect x="98.56" y="7" width="30.159999999999997" height="106" rx="5" fill="#4a2a4d"/><rect x="194.24" y="7" width="30.159999999999997" height="106" rx="5" fill="#4a2a4d"/><rect x="250.92" y="7" width="30.159999999999997" height="106" rx="5" fill="#4a2a4d"/><text x="6" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">One key. One sound. This is not a chord</text><text x="6" y="237.75" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">and not a whole scale: a single note that</text><text x="6" y="259.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">keeps sounding while you hold it.</text></svg>
