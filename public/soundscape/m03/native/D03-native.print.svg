l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="86.475" y="281.74625" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">2</text><path d="M105 244 q18.52499999999999 31.492499999999986 37.04999999999998 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M137.04999999999998 246 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="123.52499999999999" y="281.74625" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">3</text><path d="M142.04999999999998 244 q13.975000000000009 23.757500000000014 27.950000000000017 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M165 246 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="156.02499999999998" y="277.87874999999997" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">4</text><path d="M40 298 h130" stroke="#6d326e" stroke-width="1.4" stroke-dasharray="4 4"/><text x="105" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#6d326e">4 semitones: a major third</text><text x="6" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Count the keys: C to C♯ is</text><text x="6" y="371.75" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">1, to D is 2, to D♯ is 3,</text><text x="6" y="393.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">to E is 4. Black keys</text><text x="6" y="415.25" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">count too.</text></svg>
