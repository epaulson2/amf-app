<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" role="img" aria-labelledby="F01-native-t F01-native-d"><title id="F01-native-t">Same upper melody, two foundations</title><desc id="F01-native-d">Two 36-second timelines with the identical upper line E (4 to 10), F (14 to 20), E (26 to 32). In situation 1 the lower voice holds C throughout. In situation 2 it plays C for 0 to 12, B for 12 to 24 and C for 24 to 36.</desc><defs>
<linearGradient id="F01native-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
