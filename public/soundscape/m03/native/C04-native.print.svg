<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 394" width="660" height="394" role="img" aria-labelledby="C04-native-t C04-native-d"><title id="C04-native-t">Early versus late entrance</title><desc id="C04-native-d">Two twelve-second timelines with the lower C held throughout. In the first, the upper E plays from 2 to 6 seconds. In the second, the same E plays from 7 to 11 seconds. Only the entrance time differs.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(0 0)"><text x="0" y="10" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.2" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">EARLY: E ENTERS AT 2 s (2-6 s)</text><g transform="translate(0 16)"><rect x="118" y="8" width="528" height="46" rx="8" fill="#fff" stroke="#e5d6dc" stroke-width="1"/><text x="6" y="36" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" text-anchor="start" fill="#7a4a12" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Lower voice</text><rect x="118" y="14" width="528" height="34" rx="7" fill="#f1dfc0" stroke="#c8811f" stroke-width="1.6"/><text x="382" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><rect x="118" y="66" width="528" height="46" rx="8" fill="#fff" stroke="#e5d6dc" stroke-width="1"/><text x="6" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" text-anchor="start" fill="#1f5c56" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Upper voice</text><rect x="206" y="72" width="176" height="34" rx="7" fill="#d5ece9" stroke="#3f9b92" stroke-width="1.6"/><text x="294" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><rect x="120" y="72" width="84" height="34" rx="7" fill="none" stroke="#a3778f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="162" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">rest</text><rect x="384" y="72" width="260" height="34" rx="7" fill="none" stroke="#a3778f" stroke-width="1.3" stroke-dasharray="5 4"/><text x="514" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">rest</text><path d="M118 128 h528" stroke="#a3778f" stroke-width="1.4"/><path d="M118 128 v6" stroke="#a3778f"/><text x="118" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">0</text><path d="M206 128 v6" stroke="#a3778f"/><text x="206" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">2</text><path d="M294 128 v6" stroke="#a3778f"/><text x="294" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">4</text><path d="M382 128 v6" stroke="#a3778f"/><text x="382" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#786a75" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">6</text><path d="M470 128 v6" stroke="#a3778f"/><text x="470" y="150" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" f