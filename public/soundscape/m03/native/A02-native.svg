<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 486" width="320" height="486" role="img" aria-labelledby="A02-native-t A02-native-d"><title id="A02-native-t">Pitch versus loudness</title><desc id="A02-native-d">Top: seven white keys; a key and the key to its right are highlighted, with lower to the left and higher to the right. Bottom: the same key played softer and louder, shown as small and large ripples. Higher or lower depends on which key; louder or softer depends on how hard you press.</desc><defs>
<linearGradient id="A02native-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="A02native-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="A02native-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="A02native-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="A02native-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="A02native-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="A02native-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><g transform="translate(0 0)"><text x="6" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.2">HIGHER OR LOWER: WHICH KEY</text><rect x="5.949999999999999" y="54.9" width="42.5" height="149.6" rx="5.95" fill="url(#A02native-w)" stroke="#bfa8b3" stroke-width="1.19"/><rect x="51" y="145" width="40.8" height="73.1" rx="18.7" fill="#f6b94f" opacity=".5" filter="url(#A02native-glow)"/><rect x="50.15" y="54.9" width="42.5" height="149.6" rx="5.95" fill="url(#A02native-lower)" stroke="#c8811f" stroke-width="2.21"/><rect x="95.2" y="145" width="40.8" height="73.1" rx="18.7" fill="#8fcdc6" opacity=".5" filter="url(#A02native-glow)"/><rect x="94.35" y="54.9" width="42.5" height="149.6" rx="5.95" fill="url(#A02native-upper)" stroke="#3f9b92" stroke-width="2.21"/><rect x="138.54999999999998" y="54.9" width="42.5" height="149.6" rx="5.95" fill="url(#A02native-w)" stroke="#bfa8b3" stroke-width="1.19"/><rect x="182.75" y="54.9" width="42.5" height="149.6" rx="5.95" fill="url(#A02native-w)" stroke="#bfa8b3" stroke-width="1.19"/><rect x="226.95" y="54.9" width="42.5" height="149.6" rx="5.95" fill="url(#A02native-w)" stroke="#bfa8b3" stroke-width="1.19"/><rect x="271.15000000000003" y="54.9" width="42.5" height="149.6" rx="5.95" fill="url(#A02native-w)" stroke="#bfa8b3" stroke-width="1.19"/><rect x="33.38799999999999" y="54.05" width="25.635999999999996" height="90.1" rx="4.25" fill="url(#A02native-b)"/><rect x="83.776" y="54.05" width="25.635999999999996" height="90.1" rx="4.25" fill="url(#A02native-b)"/><rect x="165.104" y="54.05" width="25.635999999999996" height="90.1" rx="4.25" fill="url(#A02native-b)"/><rect x="213.28199999999998" y="54.05" width="25.635999999999996" height="90.1" rx="4.25" fill="url(#A02native-b)"/><rect x="261.46" y="54.05" width="25.635999999999996" height="90.1" rx="4.25" fill="url(#A02native-b)"/><text x="27.2" y="46.9" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">← lower</text><text x="292.4" y="46.9" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">higher →</text></g><g transform="translate(0 235)"><text x="6" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.2">LOUDER OR SOFTER: HOW HARD</text><circle cx="95.87999999999998" cy="62" r="18" fill="none" stroke="#d99a45" stroke-width="2"/><circle cx="95.87999999999998" cy="62" r="7" fill="#f6b94f"/><text x="95.87999999999998" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#3e2241">softer</text><text x="95.87999999999998" y="138" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">same key</text><circle cx="223.71999999999997" cy="62" r="30" fill="none" stroke="#d99a45" stroke-width="4"/><circle cx="223.71999999999997" cy="62" r="7" fill="#f6b94f"/><text x="223.71999999999997" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#3e2241">louder</text><text x="223.71999999999997" y="138" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">same key</text></g><g transform="translate(0 399)"><text x="6" y="12" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">Pitch is where a note lives: right is</text><text x="6" y="33.75" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">higher, left is lower. Loudness is how</text><text x="6" y="55.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">strongly you play it. Pressing the same</text><text x="6" y="77.25" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">key harder makes it louder, not higher.</text></g></svg>
