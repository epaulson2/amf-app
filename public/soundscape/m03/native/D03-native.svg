<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 445" width="210" height="445" role="img" aria-labelledby="D03-native-t D03-native-d"><title id="D03-native-t">C to E is four semitones</title><desc id="D03-native-d">Three white keys with the two black keys between them. Four numbered hops carry C to E through C sharp, D and D sharp. Four semitones, a major third.</desc><defs>
<linearGradient id="D03native-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="D03native-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="D03native-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="D03native-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="D03native-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="D03native-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="D03native-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><rect x="10" y="142.5" width="60" height="107.5" rx="27.5" fill="#f6b94f" opacity=".5" filter="url(#D03native-glow)"/><rect x="8.75" y="10" width="62.5" height="220" rx="8.75" fill="url(#D03native-lower)" stroke="#c8811f" stroke-width="3.25"/><rect x="73.75" y="10" width="62.5" height="220" rx="8.75" fill="url(#D03native-w)" stroke="#bfa8b3" stroke-width="1.75"/><rect x="140" y="142.5" width="60" height="107.5" rx="27.5" fill="#8fcdc6" opacity=".5" filter="url(#D03native-glow)"/><rect x="138.75" y="10" width="62.5" height="220" rx="8.75" fill="url(#D03native-upper)" stroke="#3f9b92" stroke-width="3.25"/><rect x="49.099999999999994" y="8.75" width="37.699999999999996" height="132.5" rx="6.25" fill="url(#D03native-b)"/><rect x="123.2" y="8.75" width="37.699999999999996" height="132.5" rx="6.25" fill="url(#D03native-b)"/><text x="40" y="212.5" font-family="Georgia, 'Times New Roman', serif" font-size="32.5" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><text x="105" y="212.5" font-family="Georgia, 'Times New Roman', serif" font-size="22.5" font-weight="500" text-anchor="middle" fill="#8a6f85">D</text><text x="170" y="212.5" font-family="Georgia, 'Times New Roman', serif" font-size="32.5" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><path d="M40 244 q13.975000000000001 23.7575 27.950000000000003 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M62.95 246 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="53.975" y="277.87874999999997" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">1</text><path d="M67.95 244 q18.525 31.492499999999996 37.05 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M100 246 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="86.475" y="281.74625" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">2</text><path d="M105 244 q18.52499999999999 31.492499999999986 37.04999999999998 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M137.04999999999998 246 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="123.52499999999999" y="281.74625" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">3</text><path d="M142.04999999999998 244 q13.975000000000009 23.757500000000014 27.950000000000017 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M165 246 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="156.02499999999998" y="277.87874999999997" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">4</text><path d="M40 298 h130" stroke="#6d326e" stroke-width="1.4" stroke-dasharray="4 4"/><text x="105" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#6d326e">4 semitones: a major third</text><text x="6" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">Count the keys: C to C♯ is</text><text x="6" y="371.75" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">1, to D is 2, to D♯ is 3,</text><text x="6" y="393.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">to E is 4. Black keys</text><text x="6" y="415.25" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">count too.</text></svg>
