ill="#4c2346">E</text><text x="188" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" text-anchor="middle" fill="#4c2346">F</text><text x="240" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" text-anchor="middle" fill="#4c2346">G</text><text x="292" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" text-anchor="middle" fill="#4c2346">A</text><text x="344" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" text-anchor="middle" fill="#4c2346">B</text><text x="32" y="27" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6d326e">1</text><text x="84" y="27" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6d326e">2</text><text x="136" y="27" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6d326e">3</text><text x="188" y="27" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6d326e">4</text><text x="240" y="27" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6d326e">5</text><text x="292" y="27" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6d326e">6</text><text x="344" y="27" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6d326e">7</text><text x="6" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Seven notes, one at a time: C D E F G A B. 