<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 394" width="660" height="394" role="img" aria-labelledby="C04-native-t C04-native-d"><title id="C04-native-t">Early versus late entrance</title><desc id="C04-native-d">Two twelve-second timelines with the lower C held throughout. In the first, the upper E plays from 2 to 6 seconds. In the second, the same E plays from 7 to 11 seconds. Only the entrance time differs.</desc><defs>
