<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" width="660" height="220" role="img" aria-labelledby="A11-native-t A11-native-d"><title id="A11-native-t">Your own sound-to-colour map</title><desc id="A11-native-d">Three empty dashed circles labelled sound 1, sound 2 and sound 3, each with two blank writing lines. Your own sound-to-colour interpretation: there is no fixed colour for any note.</desc><rect width="100%" height="100%" fill="#fff"/><text x="0" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" text-anchor="start" fill="#3e2241">Your own sound-to-color interpretation</text><g transform="translate(0 28)"><circle cx="110" cy="70" r="46" fill="none" stroke="#bd9baf" stroke-width="2" stroke-dasharray="7 6"/><text x="110" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">sound 1</text><path d="M50 168 h120 M50 190 h120" stroke="#d9c9d1" stroke-width="1.4"/><circle cx="330" cy="70" r="46" fill="none" stroke="#bd9baf" stroke-width="2" stroke-dasharray="7 6"/><text x="330" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">sound 2</text><path d="M270 168 h120 M270 190 h120" stroke="#d9c9d1" stroke-width="1.4"/><circle cx="550" cy="70" r="46" fill="none" stroke="#bd9baf" stroke-width="2" stroke-dasharray="7 6"/><text x="550" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" text-anchor="middle" fill="#786a75" font-style="italic">sound 3</text><path d="M490 168 h120 M490 190 h120" stroke="#d9c9d1" stroke-width="1.4"/></g></svg>
