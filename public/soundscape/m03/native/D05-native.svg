<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 204" width="316" height="204" role="img" aria-labelledby="D05-native-t D05-native-d"><title id="D05-native-t">Hold C, move E up to F</title><desc id="D05-native-d">Two keyboards: C and E, then C and F. The lower C stays; the upper voice rises one semitone from E to F.</desc><defs>
