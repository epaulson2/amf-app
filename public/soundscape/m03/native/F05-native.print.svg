<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 161" width="640" height="161" role="img" aria-labelledby="F05-native-t F05-native-d"><title id="F05-native-t">Objective change versus personal response</title><desc id="F05-native-d">Two columns. Left, what changes: the upper melody is identical, only the lower voice differs. Right, an open question: how did that feel to you? No right answer.</desc><rect width="100%" height="100%" fill="#fff"/><rect x="0" y="0" width="312" height="160.75" rx="14" fill="#fff" stroke="#d9a86a" stroke-width="1.6"/><rect x="332" y="0" width="308" height="160.75" rx="14" fill="none" stroke="#bd9baf" stroke-width="1.6" stroke-dasharray="7 6"/><text x="14" y="24" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.4">WHAT CHANGES (FACT)</text><text x="346" y="24" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.4">YOUR RESPONSE (OPEN)</text><g transform="translate(14 0)"><text x="0" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">What changes? The upper melody E, F, E</text><text x="0" y="61.75" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">is exactly the same in both. Only the</text><text x="0" y="83.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">lower voice differs: C held, or C then B</text><text x="0" y="105.25" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">then C. At the F moment the pairs are C</text><text x="0" y="127" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">+ F and B + F.</text></g><g transform="translate(14 0)"><text x="332" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" font-style="italic">How did that feel to you? There is no</text><text x="332" y="61.75" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" font-style="italic">right answer. Notice what you hear</text><text x="332" y="83.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" font-style="italic">around the F in each version, and</text><text x="332" y="105.25" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" font-style="italic">describe it in your own words.</text></g></svg>
