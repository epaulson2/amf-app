native.svg" alt="Two keyboards. Version 1 plays the white keys C D E F G in order and stops on G. Version 2 plays C D E D C and stops on C, the home note. Practice example only."><figcaption><strong>Two endings: away from C and home to C</strong>. Fuller teaching is in the lesson step that explains this picture.</figcaption></figure></div><p class="muted">Play each idea on your own keyboard. The site makes no sound.</p></main></body></html>
