mes New Roman', serif" font-size="14.4" font-weight="500" text-anchor="middle" fill="#8a6f85">F</text><text x="192" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="14.4" font-weight="500" text-anchor="middle" fill="#8a6f85">G</text><text x="233.60000000000002" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="14.4" font-weight="500" text-anchor="middle" fill="#8a6f85">A</text><text x="275.2" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="14.4" font-weight="500" text-anchor="middle" fill="#8a6f85">B</text><text x="316.8" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="14.4" font-weight="500" text-anchor="middle" fill="#8a6f85">C</text></g><g transform="translate(0 255.20000000000002)"><text x="6" y="10" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">Example only: C, D, E, a pause, then C.</text><text x="6" y="31.75" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">Choose three or four of your own white keys,</text><text x="6" y="53.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">leave one pause, then play it again with a</text><text x="6" y="75.25" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">different last note.</text></g></svg>
