<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 316" width="376" height="316" role="img" aria-labelledby="B01-early-t B01-early-d"><title id="B01-early-t">Seven rising notes, unfinished</title><desc id="B01-early-d">Seven white keys numbered 1 to 7 with the letters C D E F G A B, played one at a time. The path stops on the seventh note.</desc><defs>
