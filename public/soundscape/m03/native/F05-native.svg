<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 161" width="640" height="161" role="img" aria-labelledby="F05-native-t F05-native-d"><title id="F05-native-t">Objective change versus personal response</title><desc id="F05-native-d">Two columns. Left, what changes: the upper melody is identical, only the lower voice differs. Right, an open question: how did that feel to you? No right answer.</desc><defs>
<linearGradient id="F05native-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="F05native-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="F05native-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="F05native-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="F05native-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="F05native-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="F05native-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><rect x="0" y="0" width="312" height="160.75" rx="14" fill="#fffaf3" stroke="#d9a86a" stroke-width="1.6"/><rect x="332" y="0" width="308" height="160.75" rx="14" fill="none" stroke="#bd9baf" stroke-width="1.6" stroke-dasharray="7 6"/><text x="14" y="24" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.4">WHAT CHANGES (FACT)</text><text x="346" y="24" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.4">YOUR RESPONSE (OPEN)</text><g transform="translate(14 0)"><text x="0" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">What changes? The upper melody E, F, E</text><text x="0" y="61.75" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">is exactly the same in both. Only the</text><text x="0" y="83.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">lower voice differs: C held, or C then B</text><text x="0" y="105.25" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">then C. At the F moment the pairs are C</text><text x="0" y="127" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b">+ F and B + F.</text></g><g transform="translate(14 0)"><text x="332" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" font-style="italic">How did that feel to you? There is no</text><text x="332" y="61.75" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" font-style="italic">right answer. Notice what you hear</text><text x="332" y="83.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" font-style="italic">around the F in each version, and</text><text x="332" y="105.25" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" font-style="italic">describe it in your own words.</text></g></svg>
