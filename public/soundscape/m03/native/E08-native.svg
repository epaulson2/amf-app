<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 440" width="300" height="440" role="img" aria-labelledby="E08-native-t E08-native-d"><title id="E08-native-t">B to F: the tritone lens</title><desc id="E08-native-d">Five white keys B C D E F. B and F are highlighted; six numbered hops cross the black keys between them. Five letter names, six semitones: a diminished fifth, also called a tritone.</desc><defs>
