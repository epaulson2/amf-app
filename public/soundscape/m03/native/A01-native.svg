<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 290" width="324" height="290" role="img" aria-labelledby="A01-native-t A01-native-d"><title id="A01-native-t">One note on a keyboard</title><desc id="A01-native-d">A short run of six white keys with one key highlighted and no letters. One sound only: not a chord, not a scale.</desc><defs>
<linearGradient id="A01native-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="A01native-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="A01native-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="A01native-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="A01native-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="A01native-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="A01native-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><rect x="7" y="8" width="50" height="176" rx="7" fill="url(#A01native-w)" stroke="#bfa8b3" stroke-width="1.4"/><rect x="59" y="8" width="50" height="176" rx="7" fill="url(#A01native-w)" stroke="#bfa8b3" stroke-width="1.4"/><rect x="112" y="114" width="48" height="86" rx="22" fill="#f6b94f" opacity=".5" filter="url(#A01native-glow)"/><rect x="111" y="8" width="50" height="176" rx="7" fill="url(#A01native-home)" stroke="#c8811f" stroke-width="2.6"/><rect x="163" y="8" width="50" height="176" rx="7" fill="url(#A01native-w)" stroke="#bfa8b3" stroke-width="1.4"/><rect x="215" y="8" width="50" height="176" rx="7" fill="url(#A01native-w)" stroke="#bfa8b3" stroke-width="1.4"/><rect x="267" y="8" width="50" height="176" rx="7" fill="url(#A01native-w)" stroke="#bfa8b3" stroke-width="1.4"/><rect x="39.279999999999994" y="7" width="30.159999999999997" height="106" rx="5" fill="url(#A01native-b)"/><rect x="98.56" y="7" width="30.159999999999997" height="106" rx="5" fill="url(#A01native-b)"/><rect x="194.24" y="7" width="30.159999999999997" height="106" rx="5" fill="url(#A01native-b)"/><rect x="250.92" y="7" width="30.159999999999997" height="106" rx="5" fill="url(#A01native-b)"/><text x="6" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">One key. One sound. This is not a chord</text><text x="6" y="237.75" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">and not a whole scale: a single note that</text><text x="6" y="259.5" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">keeps sounding while you hold it.</text></svg>
