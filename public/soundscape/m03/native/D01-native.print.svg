<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 333" width="300" height="333" role="img" aria-labelledby="D01-native-t D01-native-d"><title id="D01-native-t">C and E together: a dyad</title><desc id="D01-native-d">Five white keys B C D E F. C is highlighted as the lower voice and E as the upper voice.</desc><rect width="100%" height="100%" fill="#fff"/><rect x="7.700000000000001" y="8.8" width="55.00000000000001" height="193.60000000000002" rx="7.700000000000001" fill="#fff" stroke="#bfa8b3" stroke-width="1.54"/><rect x="64.9" y="8.8" width="55.00000000000001" height="193.60000000000002" rx="7.700000000000001" fill="#e8e0ea" stroke="#c8811f" stroke-width="2.8600000000000003"/><rect x="122.10000000000001" y="8.8" width="55.00000000000001" height="193.60000000000002" rx="7.700000000000001" fill="#fff" stroke="#bfa8b3" stroke-width="1.54"/><rect x="179.3" y="8.8" width="55.00000000000001" height="193.60000000000002" rx="7.700000000000001" fill="#e8e0ea" stroke="#3f9b92" stroke-width="2.8600000000000003"/><rect x="236.5" y="8.8" width="55.00000000000001" height="193.60000000000002" rx="7.700000000000001" fill="#fff" stroke="#bfa8b3" stroke-width="1.54"/><rect x="100.40800000000002" y="7.700000000000001" width="33.176" height="116.60000000000001" rx="5.5" fill="#4a2a4d"/><rect x="165.616" y="7.700000000000001" width="33.176" height="116.60000000000001" rx="5.5" fill="#4a2a4d"/><text x="92.4" y="187.00000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="28.6" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><text x="206.8" y="187.00000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="28.6" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><text x="92.4" y="226.40000000000003" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#7a4a12">lower voice</text><text x="206.8" y="226.40000000000003" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1f5c56">upper voice</text><text x="6" y="259.40000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A dyad is two notes sounding together:</text><text x="6" y="281.15000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C below, E above. Play C alone, E</text><text x="6" y="302.90000000000003" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">alone, then both.</text></svg>
