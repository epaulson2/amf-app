<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 2B recap</title><style>body{margin:0;background:#f9f5ed;color:#5c465b;font:17px/1.6 Georgia,serif}main{max-width:900px;margin:0 auto;padding:26px 18px 44px}h1{font-weight:400;font-size:32px;color:#4c2748;margin:4px 0 10px}.eyebrow{font:700 11px ui-sans-serif,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#a3778f;margin:0}.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}figure{margin:0}figcaption{font:14px/1.45 ui-sans-serif,system-ui,sans-serif;color:#6e5263;margin-top:6px}img{max-width:100%;height:auto}.art{width:100%;aspect-ratio:16/9;object-fit:contain}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0}.arrow{font-size:30px;color:#6d326e}table{border-collapse:collapse;width:100%;font:13.5px/1.4 ui-sans-serif,system-ui,sans-serif}th,td{border:1px solid #d9c9d1;padding:6px 8px;text-align:left;vertical-align:top}th{background:#f0e4ea}.muted{font:13.5px/1.5 ui-sans-serif,system-ui,sans-serif;color:#786a75}@media print{body{background:#fff}.art{display:none}}</style></head><body><main><p class="eyebrow">Lesson 2B</p><h1>Recap: three pictures</h1><div class="grid"><figure><img src="E02-native.svg" alt="Three examples where one voice stays and the other moves: upper E up to F; lower C down to B; lower C up to D."><figcaption><strong>Oblique motion: one voice holds</strong>. Fuller teaching is in the lesson step that explains this picture.</figcaption></figure><figure><img src="E03-native.svg" alt="C and E become B and F: the lower voice falls and the upper voice rises. B to F is six semitones, a diminished fifth (tritone)."><figcaption><strong>Contrary motion: moving apart</strong>. Fuller teaching is in the lesson step that explains this picture.</figcaption></figure><figure><img src="E04-native.svg" alt="C and E become D and F: the lower voice rises two semitones and the upper voice rises one. D to F is three semitones, a minor third."><figcaption><strong>Similar motion: rising together</strong>. Fuller teaching is in the lesson step that explains this picture.</figcaption></figure></div><p class="muted">Play each idea on your own keyboard. The site makes no sound.</p></main></body></html>
