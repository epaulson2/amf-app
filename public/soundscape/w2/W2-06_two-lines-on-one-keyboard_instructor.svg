 stroke-linejoin="round">4</text><path d="M310.0,368.0 Q360.0,346.0 410.0,368.0" fill="none" stroke="#1B2430" stroke-width="2.5" marker-end="url(#arr-ink)" data-from="64" data-to="65"/><text x="360.0" y="351.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430" stroke="#FBFAF6" stroke-width="4" paint-order="stroke" stroke-linejoin="round">5</text><text x="60.0" y="584.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1B2430">C4 to F4: 5 hops = 5 semitones = perfect fourth   (letters 4, counted inclusively: a fourth)</text><text x="24.0" y="614.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1B2430">Between beat 1 and beat 2 only the upper voice moved, up one hop. The lower voice held.</text></g><text x="24.0" y="748.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">Voices keep their shape: circle for lower, square for upper. Count hops key by key; every key counts.</text><text x="24.0" y="778.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">Original AMF graphic, rendered from data (no AI-drawn notation). C4 = MIDI 60.</text></svg>
