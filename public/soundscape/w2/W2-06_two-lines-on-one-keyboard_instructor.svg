<svg xmlns="http://www.w3.org/2000/svg" width="960" height="792" viewBox="0 0 960 792" role="img" aria-labelledby="t d"><title id="t">W2-06 Two Lines on One Keyboard (instructor)</title><desc id="d">A C4 to C5 keyboard with two voices placed on it. Beat 1: lower C4, upper E4, four hops apart, a major third. Beat 2: lower C4 holds, upper moves to F4, five hops apart, a perfect fourth.</desc><metadata id="amf-source">{&quot;asset_id&quot;: &quot;W2-06&quot;, &quot;moments&quot;: [[&quot;Beat 1&quot;, &quot;C4&quot;, &quot;E4&quot;, 4], [&quot;Beat 2&quot;, &quot;C4&quot;, &quot;F4&quot;, 5]], &quot;source_data_sha256&quot;: &quot;a7920bf96423056edda2887bfa416554469526a44048ee2a62dc6cb07d96a85f&quot;, &quot;view&quot;: &quot;instructor&quot;}</metadata><defs><marker id="arr-lower" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="arr-upper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8470F"/></marker><marker id="arr-third" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3A8C"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8C96A3" stroke-width="1.5"/></pattern></defs><rect width=