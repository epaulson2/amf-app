<svg xmlns="http://www.w3.org/2000/svg" width="960" height="502" viewBox="0 0 960 502" role="img" aria-labelledby="t d"><title id="t">SYS-05 Motion Glyph Library (source)</title><desc id="d">Five small glyphs: no motion, oblique, contrary, similar and optional parallel. Each is computed from a real pair of dyads, for example oblique is C4 and E4 moving to C4 and F4.</desc><metadata id="amf-source">{&quot;asset_id&quot;: &quot;SYS-05&quot;, &quot;glyphs&quot;: [[&quot;none&quot;, [60, 64, 60, 64]], [&quot;oblique&quot;, [60, 64, 60, 65]], [&quot;contrary&quot;, [60, 64, 59, 65]], [&quot;similar&quot;, [60, 64, 62, 65]], [&quot;parallel&quot;, [60, 64, 62, 66]]], &quot;source_data_sha256&quot;: &quot;9ef2ed36b19c5ab2efc4950c96c90d980cc7680df8590b8dfefa5cdd6650677b&quot;, &quot;view&quot;: &quot;source&quot;}</metadata><defs><marker id="arr-lower" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="arr-upper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8470F"/></marker><marker id="arr-third" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3A8C"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8C96A3" stroke-width="1.5"/></pattern></defs><rect width="960" height="502" fill="#FBFAF6"/><rect x="0.0" y="0.0" width="960.0" height="78.0" rx="0" fill="#1B2430"/><text x="24.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#FBFAF6">SYS-05</text><text x="24.0" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#FBFAF6">Motion Glyph Library</text><text x="936.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#FBFAF6">Source master (all layers)</text><text x="936.0" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#FBFAF6">held, oblique, contrary, similar</text><g transform="translate(0,78)"><text x="24.0" y="30.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1B2430">Motion glyphs: circle = lower voice, square = upper voice, arrow = it moved</text><rect x="16.0" y="58.0" width="170.0" height="250.0" rx="8" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.2"/><circle cx="40.0" cy="130.0" r="8" fill="#1D4E89" stroke="#1D4E89" stroke-width="2.5"/><rect x="76.0" y="102.0" width="16" height="16" fill="#A8470F" stroke="#A8470F" stroke-width="2.5"/><text x="26.0" y="186.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1B2430">no motion</text><text x="26.0" y="210.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">both hold</text><text x="26.0" y="266.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#4B5563">C4+E4</text><text x="26.0" y="284.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#4B5563">→ C4+E4</text><rect x="198.0" y="58.0" width="170.0" height="250.0" rx="8" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.2"/><circle cx="222.0" cy="130.0" r="8" fill="#1D4E89" stroke="#1D4E89" stroke-width="2.5"/><rect x="258.0" y="102.0" width="16" height="16" fill="#A8470F" stroke="#A8470F" stroke-width="2.5"/><line x1="266.0" y1="98.0" x2="266.0" y2="92.0" stroke="#A8470F" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-upper)"/><text x="208.0" y="186.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1B2430">oblique</text><text x="208.0" y="210.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">one holds, one moves</text><text x="208.0" y="266.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#4B5563">C4+E4</text><text x="208.0" y="284.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#4B5563">→ C4+F4</text><rect x="380.0" y="58.0" width="170.0" height="250.0" rx="8" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.2"/><circle cx="404.0" cy="130.0" r="8" fill="#1D4E89" stroke="#1D4E89" stroke-width="2.5"/><rect x="440.0" y="102.0" width="16" height="16" fill="#A8470F" stroke="#A8470F" stroke-width="2.5"/><line x1="404.0" y1="142.0" x2="404.0" y2="148.0" stroke="#1D4E89" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-lower)"/><line x1="448.0" y1="98.0" x2="448.0" y2="92.0" stroke="#A8470F" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-upper)"/><text x="390.0" y="186.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1B2430">contrary</text><text x="390.0" y="210.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">opposite directions</text><text x="390.0" y="266.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#4B5563">C4+E4</text><text x="390.0" y="284.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#4B5563">→ B3+F4</text><rect x="562.0" y="58.0" width="170.0" height="250.0" rx="8" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.2"/><circle cx="586.0" cy="130.0" r="8" fill="#1D4E89" stroke="#1D4E89" stroke-width="2.5"/><rect x="622.0" y="102.0" width="16" height="16" fill="#A8470F" stroke="#A8470F" stroke-width="2.5"/><line x1="586.0" y1="118.0" x2="586.0" y2="112.0" stroke="#1D4E89" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-lower)"/><line x1="630.0" y1="98.0" x2="630.0" y2="78.0" stroke="#A8470F" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-upper)"/><text x="572.0" y="186.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1B2430">similar</text><text x="572.0" y="210.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">same direction,</text><text x="572.0" y="228.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">interval changes</text><text x="572.0" y="266.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#4B5563">C4+E4</text><text x="572.0" y="284.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#4B5563">→ D4+F4</text><rect x="744.0" y="58.0" width="170.0" height="250.0" rx="8" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.2"/><circle cx="768.0" cy="130.0" r="8" fill="#1D4E89" stroke="#1D4E89" stroke-width="2.5"/><rect x="804.0" y="102.0" width="16" height="16" fill="#A8470F" stroke="#A8470F" stroke-width="2.5"/><line x1="768.0" y1="118.0" x2="768.0" y2="98.0" stroke="#1D4E89" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-lower)"/><line x1="812.0" y1="98.0" x2="812.0" y2="78.0" stroke="#A8470F" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-upper)"/><text x="754.0" y="186.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1B2430">parallel (optional)</text><text x="754.0" y="210.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">same direction,</text><text x="754.0" y="228.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#1B2430">interval kept</text><text x="754.0" y="266.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#4B5563">C4+E4</text><text x="754.0" y="284.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#4B5563">→ D4+F♯4</text><text x="24.0" y="350.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">These words describe what the voices did. They are not rules about what is allowed.</text></g><text x="24.0" y="488.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">Original AMF graphic, rendered from data (no AI-drawn notation). C4 = MIDI 60.</text></svg>
