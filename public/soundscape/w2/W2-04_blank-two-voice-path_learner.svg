<svg xmlns="http://www.w3.org/2000/svg" width="960" height="716.0" viewBox="0 0 960 716.0" role="img" aria-labelledby="t d"><title id="t">W2-04 Blank Two-Voice Path Sheet (learner)</title><desc id="d">A blank pitch-versus-time grid with eight beats and rows for every semitone from G3 to C5. Beat 1 already shows C4 and E4. The learner draws two lines, marks which voice moved, and writes the interval at each beat.</desc><metadata id="amf-source">{&quot;answer_data&quot;: &quot;withheld; see the source or instructor master&quot;, &quot;asset_id&quot;: &quot;W2-04&quot;, &quot;source_data_sha256&quot;: &quot;27c98c43fcb00f19d9ee19fcd7c276c35f312a16c27d4d847469f30fa87176bb&quot;, &quot;view&quot;: &quot;learner&quot;}</metadata><defs><marker id="arr-lower" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="arr-upper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8470F"/></marker><marker id="arr-third" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3A8C"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8C96A3" stroke-width="1.5"/></pattern></defs><rect width="960" height="716.0" fill="