<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1124" width="720" height="1124" role="img" aria-labelledby="IPF-sheet-01-t IPF-sheet-01-d"><title id="IPF-sheet-01-t">Minor second (m2): information sheet</title><desc id="IPF-sheet-01-d">Minor second, m2: C4 to D♭4, 1 semitone. A keyboard from C4 to C5 with both keys highlighted in this interval's identity colour and 1 numbered semitone hops. Two time strips show the notes one after another and together. Plogger [1] lens: Dissonant family (jagged), ← Fundamental, Non-harmonic (Plogger), dense/dark.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(6 4)"><g transform="translate(0 0)"><rect x="0" y="4" width="10" height="84" rx="5" fill="#C25562"/><text x="24" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" text-anchor="start" fill="#4C2748">Minor second</text><text x="24" y="54" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.2">IP-01 · m2 · 1 SEMITONE · PLOGGER [1]</text><text x="24" y="76" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#4a3a4a">C4 → D♭4 · MIDI 60 → 61</text><text x="24" y="96" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">2 letter names counted inclusively (C to D)</text></g><g transform="translate(0 116)"><rect x="7" y="70" width="86.5" height="150" rx="6" fill="#f2eef0" stroke="#C25562" stroke-width="3.2"/><text x="50.25" y="210" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="700" text-anchor="middle" fill="#4C2748">C</text><rect x="95.5" y="70" width="86.5" height="150" rx="6" fill="#fff" stroke="#bfa8b3" stroke-width="1.3"/><text x="138.75" y="210" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">D</text><rect x="184" y="70" width="86.5" height="150" rx="6" fill="#fff" stroke="#bfa8b3" stroke-width="1.3"/><text x="227.25" y="210" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">E</text><rect x="272.5" y="70" width="86.5" height="150" rx="6" fill="#fff" stroke="#bfa8b3" stroke-width="1.3"/><text x="315.75" y="210" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">F</text><rect x="361" y="70" width="86.5" height="150" rx="6" fill="#fff" stroke="#bfa8b3" stroke-width="1.3"/><text x="404.25" y="210" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">G</text><rect x="449.5" y="70" width="86.5" height="150" rx="6" fill="#fff" stroke="#bfa8b3" stroke-width="1.3"/><text x="492.75" y="210" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">A</text><rect x="538" y="70" width="86.5" height="150" rx="6" fill="#fff" stroke="#bfa8b3" stroke-width="1.3"/><text x="581.25" y="210" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">B</text><rect x="626.5" y="70" width="86.5" height="150" rx="6" fill="#fff" stroke="#bfa8b3" stroke-width="1.3"/><text x="669.75" y="210" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">C</text><rect x="62.63999999999999" y="69" width="51.33" height="93" rx="4" fill="#C25562" stroke="#2a1630" stroke-width="2.4"/><rect x="65.63999999999999" y="151" width="45.33" height="5" rx="2.5" fill="#fffaf3" opacity=".85"/><rect x="163.53" y="69" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="326.37" y="69" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="422.835" y="69" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="519.3" y="69" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><circle cx="50.25" cy="180" r="10" fill="#C25562" stroke="#fffaf3" stroke-width="2"/><path d="M50.25 50 V74" stroke="#C25562" stroke-width="2"/><rect x="10.049999999999997" y="29" width="80.4" height="21" rx="10.5" fill="#fff" stroke="#C25562" stroke-width="2"/><text x="50.25" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">C4 start</text><path d="M88.30499999999999 25 V72" stroke="#C25562" stroke-width="2"/><rect x="52.25499999999999" y="4" width="72.10000000000001" height="21" rx="10.5" fill="#fff" stroke="#C25562" stroke-width="2"/><text x="88.30499999999999" y="19" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">D♭4 end</text></g><g transform="translate(0 360)"><path d="M50.25 8 q19.027499999999996 22 38.05499999999999 0" fill="none" stroke="#C25562" stroke-width="2.4" stroke-linecap="round"/><text x="69.2775" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">1</text><path d="M50.25 54 V60 H88.30499999999999 V54" fill="none" stroke="#C25562" stroke-width="2"/><text x="69.2775" y="80" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#4C2748">1 semitone</text></g><g transform="translate(0 458)"><g transform="translate(0 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">MELODIC · ONE AFTER ANOTHER</text><text x="0" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">lower</text><rect x="62" y="24" width="280" height="32" rx="8" fill="#fff" stroke="#e5d6dc"/><rect x="64" y="28" width="136" height="24" rx="6" fill="#f2eef0" stroke="#C25562" stroke-width="2"/><text x="132" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">C4</text><text x="0" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">upper</text><rect x="62" y="62" width="280" height="32" rx="8" fill="#fff" stroke="#e5d6dc"/><rect x="204" y="66" width="136" height="24" rx="6" fill="#f2eef0" stroke="#C25562" stroke-width="2"/><text x="272" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">D♭4</text><path d="M62 106 H338" stroke="#a3778f" stroke-width="1.4"/><path d="M332 102 l7 4 l-7 4" fill="none" stroke="#a3778f" stroke-width="1.4"/><text x="342" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#786a75" font-style="italic">time</text><text x="0" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#5c465b">C4 first, then D♭4</text></g><g transform="translate(366 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">HARMONIC · TOGETHER</text><text x="0" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">lower</text><rect x="62" y="24" width="280" height="32" rx="8" fill="#fff" stroke="#e5d6dc"/><rect x="64" y="28" width="276" height="24" rx="6" fill="#f2eef0" stroke="#C25562" stroke-width="2"/><text x="202" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">C4</text><text x="0" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">upper</text><rect x="62" y="62" width="280" height="32" rx="8" fill="#fff" stroke="#e5d6dc"/><rect x="64" y="66" width="276" height="24" rx="6" fill="#f2eef0" stroke="#C25562" stroke-width="2"/><text x="202" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">D♭4</text><path d="M62 106 H338" stroke="#a3778f" stroke-width="1.4"/><path d="M332 102 l7 4 l-7 4" fill="none" stroke="#a3778f" stroke-width="1.4"/><text x="342" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#786a75" font-style="italic">time</text><text x="0" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#5c465b">C4 and D♭4 at once</text></g></g><g transform="translate(0 606)"><g transform="translate(0 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">PLOGGER LENS · [1] · m2</text><g transform="translate(0 22) scale(1)"><path d="M0 12 L11.5 2 L23 12 L34.5 2 L46 12 L57.5 2 L69 12 L80.5 2 L92 12 L92 46 L80.5 56 L69 46 L57.5 56 L46 46 L34.5 56 L23 46 L11.5 56 L0 46 Z" transform="translate(3 0)" fill="#5c465b" opacity=".5"/><g transform="translate(12 0)"><defs><clipPath id="IPFsheet01p-cl1"><path d="M0 12 L11.5 2 L23 12 L34.5 2 L46 12 L57.5 2 L69 12 L80.5 2 L92 12 L92 46 L80.5 56 L69 46 L57.5 56 L46 46 L34.5 56 L23 46 L11.5 56 L0 46 Z"/></clipPath></defs><path d="M0 12 L11.5 2 L23 12 L34.5 2 L46 12 L57.5 2 L69 12 L80.5 2 L92 12 L92 46 L80.5 56 L69 46 L57.5 56 L46 46 L34.5 56 L23 46 L11.5 56 L0 46 Z" fill="#4C2748"/><path d="M0 12 L11.5 2 L23 12 L34.5 2 L46 12 L57.5 2 L69 12 L80.5 2 L92 12 L92 46 L80.5 56 L69 46 L57.5 56 L46 46 L34.5 56 L23 46 L11.5 56 L0 46 Z" fill="none" stroke="#4C2748" stroke-width="2.4" stroke-linejoin="round"/><text x="46" y="35" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#fffaf3">[1]</text></g></g><text x="130" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A Shape: Dissonant family</text><text x="130" y="55" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">(jagged)</text><text x="130" y="77" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">B Shadow: ← Fundamental</text><text x="130" y="99" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C Fill: Non-harmonic</text><text x="130" y="116" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">(Plogger), dense/dark</text></g><g transform="translate(354 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">HOW TO READ THE THREE PLOGGER MARKS</text><text x="0" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A Shape (outline): jagged = dissonant family ·</text><text x="0" y="48.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">rounded = modal family · straight =</text><text x="0" y="65" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">perfect-group family. A family label, not a</text><text x="0" y="81.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">measured sound wave.</text><text x="0" y="103" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">B Shadow (side): ← Fundamental [1]–[5] · ↔ Both</text><text x="0" y="119.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">[6] · → Octave [7]–[11]. Always paired with its</text><text x="0" y="136" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">arrow.</text><text x="0" y="157.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C Fill (inside): dense/dark = non-harmonic ·</text><text x="0" y="174" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">open/light = harmonic · midtone dotted = neutral</text><text x="0" y="190.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">[6] · hatched = false-harmonic [9].</text><text x="0" y="212" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A historic teaching lens (Archived printed</text><text x="0" y="228.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">pictograph (R2_pictograph_reference.html) and</text><text x="0" y="245" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">app/DiChordPictograph.tsx), not acoustic law.</text><text x="0" y="261.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">The identity colour is a separate, artistic</text><text x="0" y="278" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">label.</text></g></g><g transform="translate(0 921.5)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">WHAT STAYS, WHAT CHANGES (NEIGHBOURS)</text><text x="0" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Next lower: Perfect unison (P1, 0 semitones). Root C4 stays; upper note D♭4→C4, one key</text><text x="0" y="49" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">apart. Plogger: N/A at a boundary.</text><text x="0" y="72" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Next higher: Major second (M2, 2 semitones). Root C4 stays; upper note D♭4→D4, one key apart.</text><text x="0" y="89" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Plogger: A same, B same, C changes.</text></g><g transform="translate(0 1049.5)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">How to read: find C4 on your keyboard, then count 1 keys up, white and black, to D♭4. The</text><text x="0" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">numbered arcs are those hops. Top left shows the two notes one after another, top right</text><text x="0" y="50" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">the same two notes together.</text></g></g></svg>
