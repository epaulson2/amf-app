<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 978" width="720" height="978" role="img" aria-labelledby="IPF-sheet-00-t IPF-sheet-00-d"><title id="IPF-sheet-00-t">Perfect unison (P1): information sheet</title><desc id="IPF-sheet-00-d">Perfect unison, C4 with C4, zero semitones. One key highlighted on a keyboard from C4 to C5. Two time strips show the same note one after another and at once. Plogger is not applicable at the boundary.</desc><defs>
<linearGradient id="IPFsheet00-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="IPFsheet00-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="IPFsheet00-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="IPFsheet00-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="IPFsheet00-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="IPFsheet00-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="IPFsheet00-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><g transform="translate(6 4)"><g transform="translate(0 0)"><rect x="0" y="4" width="10" height="84" rx="5" fill="#76848C"/><text x="24" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" text-anchor="start" fill="#4C2748">Perfect unison</text><text x="24" y="54" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.2">IP-00 · P1 · 0 SEMITONES</text><text x="24" y="76" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#4a3a4a">C4 → C4 · MIDI 60 → 60</text><text x="24" y="96" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">1 letter name counted inclusively (C to C)</text></g><g transform="translate(0 116)"><rect x="7" y="45" width="86.5" height="150" rx="6" fill="#d0d5d8" stroke="#76848C" stroke-width="3.2"/><text x="50.25" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="700" text-anchor="middle" fill="#4C2748">C</text><rect x="95.5" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="138.75" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">D</text><rect x="184" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="227.25" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">E</text><rect x="272.5" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="315.75" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">F</text><rect x="361" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="404.25" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">G</text><rect x="449.5" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="492.75" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">A</text><rect x="538" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="581.25" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">B</text><rect x="626.5" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="669.75" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">C</text><rect x="62.63999999999999" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="163.53" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="326.37" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="422.835" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="519.3" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><circle cx="50.25" cy="155" r="10" fill="#76848C" stroke="#fffaf3" stroke-width="2"/><path d="M50.25 25 V49" stroke="#76848C" stroke-width="2"/><rect x="1" y="4" width="152" height="21" rx="10.5" fill="#e1e4e6" stroke="#76848C" stroke-width="2"/><text x="77" y="19" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">C4 · both notes</text></g><g transform="translate(0 335)"><text x="360" y="22" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#4C2748">0 semitones: one key, played twice</text></g><g transform="translate(0 387)"><g transform="translate(0 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">MELODIC · ONE AFTER ANOTHER</text><text x="0" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">lower</text><rect x="62" y="24" width="280" height="32" rx="8" fill="#fffaf3" stroke="#e5d6dc"/><rect x="64" y="28" width="136" height="24" rx="6" fill="#d0d5d8" stroke="#76848C" stroke-width="2"/><text x="132" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">C4</text><text x="0" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">upper</text><rect x="62" y="62" width="280" height="32" rx="8" fill="#fffaf3" stroke="#e5d6dc"/><rect x="204" y="66" width="136" height="24" rx="6" fill="#d0d5d8" stroke="#76848C" stroke-width="2"/><text x="272" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">C4</text><path d="M62 106 H338" stroke="#a3778f" stroke-width="1.4"/><path d="M332 102 l7 4 l-7 4" fill="none" stroke="#a3778f" stroke-width="1.4"/><text x="342" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#786a75" font-style="italic">time</text><text x="0" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#5c465b">C4 first, then C4</text></g><g transform="translate(366 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">HARMONIC · TOGETHER</text><text x="0" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">lower</text><rect x="62" y="24" width="280" height="32" rx="8" fill="#fffaf3" stroke="#e5d6dc"/><rect x="64" y="28" width="276" height="24" rx="6" fill="#d0d5d8" stroke="#76848C" stroke-width="2"/><text x="202" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">C4</text><text x="0" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">upper</text><rect x="62" y="62" width="280" height="32" rx="8" fill="#fffaf3" stroke="#e5d6dc"/><rect x="64" y="66" width="276" height="24" rx="6" fill="#d0d5d8" stroke="#76848C" stroke-width="2"/><text x="202" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">C4</text><path d="M62 106 H338" stroke="#a3778f" stroke-width="1.4"/><path d="M332 102 l7 4 l-7 4" fill="none" stroke="#a3778f" stroke-width="1.4"/><text x="342" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#786a75" font-style="italic">time</text><text x="0" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#5c465b">C4 and C4 at once</text></g></g><g transform="translate(0 535)"><g transform="translate(0 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">PLOGGER LENS · N/A · P1</text><g transform="translate(0 22) scale(1)"><rect x="12" y="6" width="92" height="46" rx="8" fill="none" stroke="#8a7a86" stroke-width="2" stroke-dasharray="6 5"/><text x="58" y="34" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#6b5a68">N/A</text></g><text x="130" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A Shape: N/A, reference</text><text x="130" y="55" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">boundary</text><text x="130" y="77" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">B Shadow: N/A, reference</text><text x="130" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">boundary</text><text x="130" y="116" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C Fill: N/A, reference</text><text x="130" y="133" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">boundary</text><text x="0" y="100" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Plogger [1]–[11] model: N/A</text><text x="0" y="116" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">(boundary/reference). Unison has no original</text><text x="0" y="132" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">di-chord.</text></g><g transform="translate(354 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">HOW TO READ THE THREE PLOGGER MARKS</text><text x="0" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A Shape (outline): jagged = dissonant family ·</text><text x="0" y="48.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">rounded = modal family · straight =</text><text x="0" y="65" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">perfect-group family. A family label, not a</text><text x="0" y="81.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">measured sound wave.</text><text x="0" y="103" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">B Shadow (side): ← Fundamental [1]–[5] · ↔ Both</text><text x="0" y="119.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">[6] · → Octave [7]–[11]. Always paired with its</text><text x="0" y="136" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">arrow.</text><text x="0" y="157.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C Fill (inside): dense/dark = non-harmonic ·</text><text x="0" y="174" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">open/light = harmonic · midtone dotted = neutral</text><text x="0" y="190.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">[6] · hatched = false-harmonic [9].</text><text x="0" y="212" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A historic teaching lens from the archived</text><text x="0" y="228.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">printed Plogger di-chord pictograph, not</text><text x="0" y="245" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">acoustic law. The identity colour is a separate,</text><text x="0" y="261.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">artistic label.</text></g></g><g transform="translate(0 834)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">WHAT STAYS, WHAT CHANGES (NEIGHBOURS)</text><text x="0" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Next higher: Minor second (m2, 1 semitone). Root C4 stays; upper note C4→D♭4, one key apart.</text><text x="0" y="49" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Plogger: N/A at a boundary.</text></g><g transform="translate(0 922)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">How to read: one key is highlighted because both notes are the same pitch. Melodic: the</text><text x="0" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">same C twice, one after the other. Harmonic: one C, doubled. Distance: zero keys.</text></g></g></svg>
