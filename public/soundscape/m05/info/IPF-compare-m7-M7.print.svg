ke fill">(jagged)</text><text x="130" y="77" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">B Shadow: → Octave</text><text x="130" y="99" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C Fill: Harmonic (Plogger),</text><text x="130" y="116" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">open/light</text></g><g transform="translate(364 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">PLOGGER LENS · [11] · M7</text><g transform="translate(0 22) scale(1)"><path d="M0 12 L11.5 2 L23 12 L34.5 2 L46 12 L57.5 2 L69 12 L80.5 2 L92 12 L92 46 L80.5 56 L69 46 L57.5 56 L46 46 L34.5 56 L23 46 L11.5 56 L0 46 Z" transform="translate(21 0)" fill="#5c465b" opacity=".5"/><g transform="translate(12 0)"><defs><clipPath id="IPFcomparem7M7p-clp111"><path d="M0 12 L11.5 2 L23 12 L34.5 2 L46 12 L57.5 2 L69 12 L80.5 2 L92 12 L92 46 L80.5 56 L69 46 L57.5 56 L46 46 L34.5 56 L23 46 L11.5 56 L0 46 Z"/></clipPath></defs><path d="M0 12 L11.5 2 L23 12 L34.5 2 L46 12 L57.5 2 L69 12 L80.5 2 L92 12 L92 46 L80.5 56 L69 46 L57.5 56 L46 46 L34.5 56 L23 46 L11.5 56 L0 46 Z" fill="#4C2748"/><path d="M0 12 L11.5 2 L23 12 L34.5 2 L46 12 L57.5 2 L69 12 L80.5 2 L92 12 L92 46 L80.5 56 L69 46 L57.5 56 L46 46 L34.5 56 L23 46 L11.5 56 L0 46 Z" fill="none" stroke="#4C2748" stroke-width="2.4" stroke-linejoin="round"/><text x="46" y="35" font-family="ui-sans-serif, system-ui, 'Segoe UI', sa