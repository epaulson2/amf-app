fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="326.37" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="422.835" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="519.3" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><circle cx="50.25" cy="155" r="10" fill="#4F816B" stroke="#fffaf3" stroke-width="2"/><path d="M50.25 25 V49" stroke="#4F816B" stroke-width="2"/><rect x="10.049999999999997" y="4" width="80.4" height="21" rx="10.5" fill="#fff" stroke="#4F816B" stroke-width="2"/><text x="50.25" y="19" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">C4 start</text><circle cx="315.75" cy="155" r="10" fill="#4F816B" stroke="#fffaf3" stroke-width="2"/><path d="M315.75 25 V49" stroke="#4F816B" stroke-width="2"/><rect x="283.85" y="4" width="63.800000000000004" height="21" rx="10.5" fill="#fff" stroke="#4F816B" stroke-width="2"/><text x="315.75" y="19" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">F4 end</text></g><g transform="translate(0 335)"><path d="M50.25 8 q19.027499999999996 22 38.05499999999999 0" fill="none" stroke="#4F816B" stroke-width="2.4" stroke-linecap="round"/><text x="69.2775" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">1</text><path d="M88.30499999999999 8 q25.222500000000004 22 50.44500000000001 0" fill="none" stroke="#4F816B" stroke-width="2.4" stroke-linecap="round"/><text x="113.5275" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">2</text><path d="M138.75 8 q25.222499999999997 22 50.44499999999999 0" fill="none" stroke="#4F816B" stroke-width="2.4" stroke-linecap="round"/><text x="163.9725" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">3</text><path d="M189.195 8 q19.027500000000003 22 38.05500000000001 0" fill="none" stroke="#4F816B" stroke-width="2.4" stroke-linecap="round"/><text x="208.2225" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">4</text><path d="M227.25 8 q44.25 22 88.5 0" fill="none" stroke="#4F816B" stroke-width="2.4" stroke-linecap="round"/><text x="271.5" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">5</text><path d="M50.25 54 V60 H315.75 V54" fill="none" stroke="#4F816B" stroke-width="2"/><text x="183" y="80" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#4C2748">5 semitones</text></g><g transform="translate(0 433)"><g transform="translate(0 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">MELODIC · ONE AFTER ANOTHER</text><text x="0" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">lower</text><rect x="62" y="24" width="280" height="32" rx="8" fill="#fff" stroke="#e5d6dc"/><rect x="64" y="28" width="136" height="24" rx="6" fill="#f2eef0" stroke="#4F816B" stroke-width="2"/><text x="132" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">C4</text><text x="0" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">upper</text><rect x="62" y="62" width="280" height="32" rx="8" fill="#fff" stroke="#e5d6dc"/><rect x="204" y="66" width="136" height="24" rx="6" fill="#f2eef0" stroke="#4F816B" stroke-width="2"/><text x="272" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">F4</text><path d="M62 106 H338" stroke="#a3778f" stroke-width="1.4"/><path d="M332 102 l7 4 l-7 4" fill="none" stroke="#a3778f" stroke-width="1.4"/><text x="342" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#786a75" font-style="italic">time</text><text x="0" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#5c465b">C4 first, then F4</text></g><g transform="translate(366 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">HARMONIC · TOGETHER</text><text x="0" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">lower</text><rect x="62" y="24" width="280" height="32" rx="8" fill="#fff" stroke="#e5d6dc"/><rect x="64" y="28" width="276" height="24" rx="6" fill="#f2eef0" stroke="#4F816B" stroke-width="2"/><text x="202" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">C4</text><text x="0" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">upper</text><rect x="62" y="62" width="280" height="32" rx="8" fill="#fff" stroke="#e5d6dc"/><rect x="64" y="66" width="276" height="24" rx="6" fill="#f2eef0" stroke="#4F816B" stroke-width="2"/><text x="202" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">F4</text><path d="M62 106 H338" stroke="#a3778f" stroke-width="1.4"/><path d="M332 102 l7 4 l-7 4" fill="none" stroke="#a3778f" stroke-width="1.4"/><text x="342" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#786a75" font-style="italic">time</text><text x="0" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#5c465b">C4 and F4 at once</text></g></g><g transform="translate(0 581)"><g transform="translate(0 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">PLOGGER LENS · [5] · P4</text><g transform="translate(0 22) scale(1)"><path d="M3 8 H89 V50 H3 Z" transform="translate(3 0)" fill="#5c465b" opacity=".5"/><g transform="translate(12 0)"><defs><clipPath id="IPFsheet05p-cl5"><path d="M3 8 H89 V50 H3 Z"/></clipPath></defs><path d="M3 8 H89 V50 H3 Z" fill="#4C2748"/><path d="M3 8 H89 V50 H3 Z" fill="none" stroke="#4C2748" stroke-width="2.4" stroke-linejoin="round"/><text x="46" y="35" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#fffaf3">[5]</text></g></g><text x="130" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A Shape: Perfect-group</text><text x="130" y="55" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">family (straight)</text><text x="130" y="77" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">B Shadow: ← Fundamental</text><text x="130" y="99" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C Fill: Non-harmonic</text><text x="130" y="116" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">(Plogger), dense/dark</text></g><g transform="translate(354 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">HOW TO READ THE THREE PLOGGER MARKS</text><text x="0" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A Shape (outline): jagged = dissonant family ·</text><text x="0" y="48.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">rounded = modal family · straight =</text><text x="0" y="65" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">perfect-group family. A family label, not a</text><text x="0" y="81.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">measured sound wave.</text><text x="0" y="103" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">B Shadow (side): ← Fundamental [1]–[5] · ↔ Both</text><text x="0" y="119.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">[6] · → Octave [7]–[11]. Always paired with its</text><text x="0" y="136" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">arrow.</text><text x="0" y="157.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C Fill (inside): dense/dark = non-harmonic ·</text><text x="0" y="174" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">open/light = harmonic · midtone dotted = neutral</text><text x="0" y="190.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">[6] · hatched = false-harmonic [9].</text><text x="0" y="212" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A historic teaching lens (Archived printed</text><text x="0" y="228.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">pictograph (R2_pictograph_reference.html) and</text><text x="0" y="245" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">app/DiChordPictograph.tsx), not acoustic law.</text><text x="0" y="261.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">The identity colour is a separate, artistic</text><text x="0" y="278" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">label.</text></g></g><g transform="translate(0 896.5)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">WHAT STAYS, WHAT CHANGES (NEIGHBOURS)</text><text x="0" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Next lower: Major third (M3, 4 semitones). Root C4 stays; upper note F4→E4, one key apart.</text><text x="0" y="49" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Plogger: A changes, B same, C changes.</text><text x="0" y="72" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Next higher: Tritone (A4/d5, 6 semitones). Root C4 stays; upper note F4→F♯4, one key apart.</text><text x="0" y="89" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Plogger: A same, B changes, C changes.</text></g><g transform="translate(0 1024.5)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">How to read: find C4 on your keyboard, then count 5 keys up, white and black, to F4. The</text><text x="0" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">numbered arcs are those hops. Top left shows the two notes one after another, top right</text><text x="0" y="50" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">the same two notes together.</text></g></g></svg>
