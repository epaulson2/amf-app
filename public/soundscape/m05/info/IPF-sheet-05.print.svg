<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1099" width="720" height="1099" role="img" aria-labelledby="IPF-sheet-05-t IPF-sheet-05-d"><title id="IPF-sheet-05-t">Perfect fourth (P4): information sheet</title><desc id="IPF-sheet-05-d">Perfect fourth, P4: C4 to F4, 5 semitones. A keyboard from C4 to C5 with both keys highlighted in this interval's identity colour and 5 numbered semitone hops. Two time strips show the notes one after another and together. Plogger [5] lens: Perfect-group family (straight), ← Fundamental, Non-harmonic (Plogger), dense/dark.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(6 4)"><g transform="translate(0 0)"><rect x="0" y="4" width="10" height="84" rx="5" fill="#4F816B"/><text x="24" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" text-anchor="start" fill="#4C2748">Perfect fourth</text><text x="24" y="54" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.2">IP-05 · P4 · 5 SEMITONES · PLOGGER [5]</text><text x="24" y="76" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#4a3a4a">C4 → F4 · MIDI 60 → 65</text><text x="24" y="96" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">4 letter names counted inclusively (C to F)</text></g><g transform="translate(0 116)"><rect x="7" y="45" width="86.5" height="150" rx="6" fill="#f2eef0" stroke="#4F816B" stroke-width="3.2"/><text x="50.25" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="700" text-anchor="middle" fill="#4C2748">C</text><rect x="95.5" y="45" width="86.5" height="150" rx="6" fill="#fff" stroke="#bfa8b3" stroke-width="1.3"/><text x="138.75" y="185" font-family="ui-sans-serif, system-ui, 'Sego