<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-labelledby="IPF-intro-05-t IPF-intro-05-d"><title id="IPF-intro-05-t">Melodic versus harmonic</title><desc id="IPF-intro-05-d">Two time strips for the same notes C4 and E4. In the melodic strip C4 sounds first and E4 second. In the harmonic strip both sound together for the whole span.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(6 4)"><g transform="translate(0 0)"><g transform="translate(0 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">MELODIC · ONE AFTER ANOTHER</text><text x="0" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">lower</text><rect x="62" y="24" width="280" height="32" rx="8" fill="#fff" stroke="#e5d6dc"/><rect x="64" y="28" width="136" height="24" rx="6" fill="#f2eef0" stroke="#AB812D" stroke-width="2"/><text x="132" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">C4</text><text x="0" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">upper</text><rect x="62" y="62" width="280" height="32" rx="8" fill="#fff" stroke="#e5d6dc"/><rect x="204" y="66" width="136" height="24" rx="6" fill="#f2eef0" stroke="#AB812D" stroke-width="2"/><text x="272" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">E4</text><path d="M62 106 H338" stroke="#a3778f" stroke-width="1.4"/><path d="M332 102 l7 4 l-7 4" fill="none" stroke="#a3778f" stroke-width="1.4"/><text x="342" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#786a75" font-style="italic">time</text><text x="0" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#5c465b">C4 first, then E4</text></g><g transform="translate(366 0)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">HARMONIC · TOGETHER</text><text x="0" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">lower</text><rect x="62" y="24" width="280" height="32" rx="8" fill="#fff" stroke="#e5d6dc"/><rect x="64" y="28" width="276" height="24" rx="6" fill="#f2eef0" stroke="#AB812D" stroke-width="2"/><text x="202" y="45" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">C4</text><text x="0" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" text-anchor="start" fill="#4C2748">upper</text><rect x="62" y="62" width="280" height="32" rx="8" fill="#fff" stroke="#e5d6dc"/><rect x="64" y="66" width="276" height="24" rx="6" fill="#f2eef0" stroke="#AB812D" stroke-width="2"/><text x="202" y="83" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">E4</text><path d="M62 106 H338" stroke="#a3778f" stroke-width="1.4"/><path d="M332 102 l7 4 l-7 4" fill="none" stroke="#a3778f" stroke-width="1.4"/><text x="342" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#786a75" font-style="italic">time</text><text x="0" y="124" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#5c465b">C4 and E4 at once</text></g></g><g transform="translate(0 146)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Same two notes, C4 and E4. Melodic: one after another. Harmonic: together. The distance</text><text x="0" y="33" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">between the notes does not change; the way they meet in time does.</text></g></g></svg>
