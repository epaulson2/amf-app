<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 367" width="720" height="367" role="img" aria-labelledby="IPF-intro-04-t IPF-intro-04-d"><title id="IPF-intro-04-t">What is an interval? C4 to E4</title><desc id="IPF-intro-04-d">A keyboard from C4 to C5 with C4 and E4 highlighted in the major-third identity colour and four numbered semitone hops between them: C to C-sharp, to D, to D-sharp, to E.</desc><defs>
<linearGradient id="IPFintro04-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="IPFintro04-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="IPFintro04-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="IPFintro04-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="IPFintro04-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="IPFintro04-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="IPFintro04-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><g transform="translate(6 4)"><g transform="translate(0 0)"><rect x="7" y="45" width="86.5" height="150" rx="6" fill="#e2d4b8" stroke="#AB812D" stroke-width="3.2"/><text x="50.25" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="700" text-anchor="middle" fill="#4C2748">C</text><rect x="95.5" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="138.75" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">D</text><rect x="184" y="45" width="86.5" height="150" rx="6" fill="#e2d4b8" stroke="#AB812D" stroke-width="3.2"/><text x="227.25" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="700" text-anchor="middle" fill="#4C2748">E</text><rect x="272.5" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="315.75" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">F</text><rect x="361" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="404.25" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">G</text><rect x="449.5" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="492.75" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">A</text><rect x="538" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="581.25" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">B</text><rect x="626.5" y="45" width="86.5" height="150" rx="6" fill="#fffdf8" stroke="#bfa8b3" stroke-width="1.3"/><text x="669.75" y="185" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">C</text><rect x="62.63999999999999" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="163.53" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="326.37" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="422.835" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="519.3" y="44" width="51.33" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><circle cx="50.25" cy="155" r="10" fill="#AB812D" stroke="#fffaf3" stroke-width="2"/><path d="M50.25 25 V49" stroke="#AB812D" stroke-width="2"/><rect x="5.049999999999997" y="4" width="90.4" height="21" rx="10.5" fill="#ede3d1" stroke="#AB812D" stroke-width="2"/><text x="50.25" y="19" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">C4 start</text><circle cx="227.25" cy="155" r="10" fill="#AB812D" stroke="#fffaf3" stroke-width="2"/><path d="M227.25 25 V49" stroke="#AB812D" stroke-width="2"/><rect x="190.85" y="4" width="72.80000000000001" height="21" rx="10.5" fill="#ede3d1" stroke="#AB812D" stroke-width="2"/><text x="227.25" y="19" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">E4 end</text></g><g transform="translate(0 217)"><path d="M50.25 8 q19.027499999999996 22 38.05499999999999 0" fill="none" stroke="#AB812D" stroke-width="2.4" stroke-linecap="round"/><text x="69.2775" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">1</text><path d="M88.30499999999999 8 q25.222500000000004 22 50.44500000000001 0" fill="none" stroke="#AB812D" stroke-width="2.4" stroke-linecap="round"/><text x="113.5275" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">2</text><path d="M138.75 8 q25.222499999999997 22 50.44499999999999 0" fill="none" stroke="#AB812D" stroke-width="2.4" stroke-linecap="round"/><text x="163.9725" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">3</text><path d="M189.195 8 q19.027500000000003 22 38.05500000000001 0" fill="none" stroke="#AB812D" stroke-width="2.4" stroke-linecap="round"/><text x="208.2225" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4C2748">4</text><path d="M50.25 54 V60 H227.25 V54" fill="none" stroke="#AB812D" stroke-width="2"/><text x="138.75" y="80" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#4C2748">4 semitones = a major third</text></g><g transform="translate(0 313)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">An interval measures the distance between two notes. Count every key, white and black,</text><text x="0" y="33" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">from C up to E: four hops. The distance, four semitones, is the interval.</text></g></g></svg>
