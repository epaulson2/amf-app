mily="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#4a3a4a">C Fill</text><text x="249.5" y="200" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">dark</text><text x="488.5" y="200" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4C2748">light</text><rect x="612" y="185" width="92" height="20" rx="10" fill="#fff" stroke="#6d326e" stroke-width="1.6"/><text x="658" y="200" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#6d326e">Δ changes</text><path d="M0 208 H708" stroke="#e6dccb"/></g><g transform="translate(0 818)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">HOW TO READ THE THREE PLOGGER MARKS</text><text x="0" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A Shape (outline): jagged = dissonant family · rounded = modal family · straight = perfect-group</text><text x="0" y="48.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">family. A family label, not a measured sound wave.</text><text x="0" y="70" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">B Shadow (side): ← Fundamental [1]–[5] · ↔ Both [6] · → Octave [7]–[11]. Always paired with its</text><text x="0" y="86.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">arrow.</text><text x="0" y="108" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C Fill (inside): dense/dark = non-harmonic · open/light = harmonic · midtone dotted = neutral [6]</text><text x="0" y="124.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">· hatched = false-harmonic [9].</text><text x="0" y="146" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A historic teaching lens (Archived printed pictograph (R2_pictograph_reference.html) and</text><text x="0" y="162.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">app/DiChordPictograph.tsx), not acoustic law. The identity colour is a separate, artistic label.</text></g></g></svg>
