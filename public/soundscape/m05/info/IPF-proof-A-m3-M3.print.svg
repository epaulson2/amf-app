<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1014" width="720" height="1014" role="img" aria-labelledby="IPF-proof-A-m3-M3-t IPF-proof-A-m3-M3-d"><title id="IPF-proof-A-m3-M3-t">Minor third versus major third</title><desc id="IPF-proof-A-m3-M3-d">Minor third versus major third. A keyboard from C4 to C5 with C4 as the shared root and the upper notes E♭4 (m3, 3 semitones), E4 (M3, 4 semitones) each in its own identity colour. A table lists what stayed (root C4) and what changed (upper note, semitone count, and the Plogger shape, shadow and fill where they apply).</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(6 4)"><g transform="translate(0 0)"><text x="0" y="24" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" text-anchor="start" fill="#4C2748">Minor third versus major third</text><text x="0" y="46" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C4 to E♭4 (3) and C4 to E4 (4): one semitone apart on the upper note.</text></g><g transform="translate(0 72)"><rect x="7" y="70" width="86.5" height="150" rx="6" fill="#f2eef0" stroke="#4C2748" stroke-width="3.2"/><text x="50.25" y="210" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="700" text-anchor="middle" fill="#4C2748">C</text><rect x="95.5" y="70" width="86.5" height="150" rx="6" fill="#fff" stroke="#bfa8b3" stroke-width="1.3"/><text x="138.75" y="210" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.895000000000003" font-weight="500" text-anchor="middle" fill="#7d6477">D</text><rect x="184" y="70" width="86.5" height="150" rx="6" fill="#f2eef0" stroke="#AB812D" stroke-width="3.2"/><text x="227.25" y="210" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="23.8950000000