<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" width="920" height="150" role="img" aria-labelledby="IPV-07-native-t IPV-07-native-d"><title id="IPV-07-native-t">Thirteen intervals on a 0 to 12 semitone ruler</title><desc id="IPV-07-native-d">A ruler from 0 to 12 semitones above C4 with thirteen marked landmarks in order: P1, m2, M2, m3, M3, P4, A4 or d5, P5, m6, M6, m7, M7, P8. The ruler shows measured distance only.</desc><rect width="100%" height="100%" fill="#fff"/><text x="6" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#a67664" letter-spacing="1.2" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">THIRTEEN LANDMARKS · SEMITONES ABOVE C4 (EQUAL-TEMPERED)</text><path d="M40 100 H880" stroke="#a3778f" stroke-width="2"/><circle cx="40" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="40" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">0</text><text x="40" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">P1</text><circle cx="110" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="110" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">1</text><text x="110" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">m2</text><circle cx="180" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="180" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">2</text><text x="180" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">M2</text><circle cx="250" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="250" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">3</text><text x="250" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">m3</text><circle cx="320" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="320" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">4</text><text x="320" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">M3</text><circle cx="390" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="390" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">5</text><text x="390" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">P4</text><circle cx="460" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="460" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">6</text><text x="460" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">A4/d5</text><circle cx="530" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="530" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">7</text><text x="530" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">P5</text><circle cx="600" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="600" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">8</text><text x="600" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">m6</text><circle cx="670" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="670" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">9</text><text x="670" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">M6</text><circle cx="740" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="740" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">10</text><text x="740" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">m7</text><circle cx="810" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="810" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">11</text><text x="810" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">M7</text><circle cx="880" cy="100" r="9" fill="#fff" stroke="#6d326e" stroke-width="2"/><text x="880" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">12</text><text x="880" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">P8</text></svg>
