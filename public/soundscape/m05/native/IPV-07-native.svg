e-width="2"/><text x="670" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">9</text><text x="670" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">M6</text><circle cx="740" cy="100" r="9" fill="#f6b94f" stroke="#6d326e" stroke-width="2"/><text x="740" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">10</text><text x="740" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">m7</text><circle cx="810" cy="100" r="9" fill="#f6b94f" stroke="#6d326e" stroke-width="2"/><text x="810" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">11</text><text x="810" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">M7</text><circle cx="880" cy="100" r="9" fill="#f6b94f" stroke="#6d326e" stroke-width="2"/><text x="880" y="104.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#3e2241">12</text><text x="880" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#4c2346">P8</text></svg>
