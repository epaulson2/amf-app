 19.006 22.36 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M49.36 212 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="43.18" y="241.503" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">1</text><path d="M54.36 210 q14.82 25.194 29.64 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M79 212 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="69.18" y="244.597" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">2</text><path d="M84 210 q14.819999999999993 25.19399999999999 29.639999999999986 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M108.63999999999999 212 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="98.82" y="244.59699999999998" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">3</text><path d="M113.63999999999999 210 q11.180000000000007 19.00600000000001 22.360000000000014 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M131 212 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="124.82" y="241.50300000000001" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#6d326e">4</text><path d="M32 264 h104" stroke="#6d326e" stroke-width="1.4" stroke-dasharray="4 4"/><text x="95.3" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#6d326e">4 semitones: C to E</text><text x="6" y="316" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">An interval measures the distance between two</text><text x="6" y="337.75" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">notes. Count every key, white and black, from C</text><text x="6" y="359.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">up to E: four hops.</text></svg>
