<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 428 618" width="428" height="618" role="img" aria-labelledby="IPV-06-native-t IPV-06-native-d"><title id="IPV-06-native-t">Reading the keyboard: white-key neighbours are not always one semitone</title><desc id="IPV-06-native-d">A keyboard from C4 to C5 showing black keys in groups of two then three. C to D spans two semitones because C-sharp sits between them. E to F spans only one semitone because there is no black key between E and F.</desc><defs>
