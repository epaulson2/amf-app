<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 386 744" width="386" height="744" role="img" aria-labelledby="IPV-35-native-t IPV-35-native-d"><title id="IPV-35-native-t">Adding a third note changes the whole sound-world</title><desc id="IPV-35-native-d">Three keyboards from C4. First C and E alone, a major third of 4 semitones. Second C, E and G together, a C-major triad. Third C, E-flat and G, a C-minor triad, where moving one key down changes the quality.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(0 0)"><text x="6" y="16" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" text-anchor="start" fill="#4c2346">Two notes: C and E</text><rect x="6.300000000000001" y="31.2" width="45" height="158.4" rx="6.3" fill="#e8e0ea" stroke="#c8811f" stroke-width="2.3400000000000003"/><rect x="53.1" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="99.9" y="31.2" width="45" height="158.4" rx="6.3" fill="#e8e0ea" stroke="#3f9b92" stroke-width="2.3400000000000003"/><rect x="146.70000000000002" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="193.5" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="240.3" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="287.09999999999997" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="333.9" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="35.352" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="88.70400000000001" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="174.816" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="225.828" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="276.84" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><text x="28.8" y="177" font-family="Georgia, 'Times New Roman', serif" font-size="23.400000000000002" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><text x="122.4" y="177" font-family="Georgia, 'Times New Roman', serif" font-size="23.400000000000002" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><text x="6" y="214.6" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">a major third with nothing added</text></g><g transform="translate(0 238.9)"><text x="6" y="16" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" text-anchor="start" fill="#4c2346">Add G: C, E and G</text><rect x="6.300000000000001" y="31.2" width="45" height="158.4" rx="6.3" fill="#e8e0ea" stroke="#c8811f" stroke-width="2.3400000000000003"/><rect x="53.1" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="99.9" y="31.2" width="45" height="158.4" rx="6.3" fill="#e8e0ea" stroke="#3f9b92" stroke-width="2.3400000000000003"/><rect x="146.70000000000002" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="193.5" y="31.2" width="45" height="158.4" rx="6.3" fill="#e8e0ea" stroke="#7a4a8c" stroke-width="2.3400000000000003"/><rect x="240.3" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="287.09999999999997" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="333.9" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="35.352" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="88.70400000000001" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="174.816" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="225.828" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="276.84" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><text x="28.8" y="177" font-family="Georgia, 'Times New Roman', serif" font-size="23.400000000000002" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><text x="122.4" y="177" font-family="Georgia, 'Times New Roman', serif" font-size="23.400000000000002" font-weight="700" text-anchor="middle" fill="#4c2346">E</text><text x="216" y="177" font-family="Georgia, 'Times New Roman', serif" font-size="23.400000000000002" font-weight="700" text-anchor="middle" fill="#4c2346">G</text><text x="6" y="214.6" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">a C-major triad (C to E is 4 semitones, E to</text><text x="6" y="234.9" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">G is 3)</text></g><g transform="translate(0 498.1)"><text x="6" y="16" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" text-anchor="start" fill="#4c2346">Change E to E♭: C, E♭ and G</text><rect x="6.300000000000001" y="31.2" width="45" height="158.4" rx="6.3" fill="#e8e0ea" stroke="#c8811f" stroke-width="2.3400000000000003"/><rect x="53.1" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="99.9" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="146.70000000000002" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="193.5" y="31.2" width="45" height="158.4" rx="6.3" fill="#e8e0ea" stroke="#7a4a8c" stroke-width="2.3400000000000003"/><rect x="240.3" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="287.09999999999997" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="333.9" y="31.2" width="45" height="158.4" rx="6.3" fill="#fff" stroke="#bfa8b3" stroke-width="1.26"/><rect x="35.352" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="88.70400000000001" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#e8e0ea" stroke="#3f9b92" stroke-width="2.7"/><text x="102.276" y="115.80000000000001" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#3e2241">E♭</text><rect x="174.816" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="225.828" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><rect x="276.84" y="30.3" width="27.144" height="95.4" rx="4.5" fill="#4a2a4d"/><text x="28.8" y="177" font-family="Georgia, 'Times New Roman', serif" font-size="23.400000000000002" font-weight="700" text-anchor="middle" fill="#4c2346">C</text><text x="216" y="177" font-family="Georgia, 'Times New Roman', serif" font-size="23.400000000000002" font-weight="700" text-anchor="middle" fill="#4c2346">G</text><text x="6" y="214.6" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">a C-minor triad (C to E♭ is 3 semitones, E♭</text><text x="6" y="234.9" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">to G is 4)</text></g></svg>
