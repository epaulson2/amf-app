" font-size="13" font-weight="700" text-anchor="middle" fill="#6d326e">3</text><path d="M23.04 220.48 h58.78079999999999" stroke="#6d326e" stroke-width="1.4" stroke-dasharray="4 4"/><text x="57.7" y="242.48" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#6d326e">3 semitones</text><g transform="translate(344.15999999999997 0)"><text x="6" y="16" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" text-anchor="start" fill="#4c2346">Major third · M3 · 4</text><rect x="5.04" y="29.759999999999998" width="36" height="126.72" rx="5.04" fill="#e8e0ea" stroke="#c8811f" stroke-width="1.8719999999999999"/><rect x="42.48" y="29.759999999999998" width="36" height="126.72" rx="5.04" fill="#fff" stroke="#bfa8b3" stroke-width="1.008"/><rect x="79.92" y="29.759999999999998" width="36" height="126.72" rx="5.04" fill="#e8e0ea" stroke="#3f9b92" stroke-width="1.8719999999999999"/><rect x="117.36" y="29.759999999999998" width="36" height="126.72" rx="5.04" fill="#fff" stroke="#bfa8b3" stroke-width="1.008"/><rect x="154.79999999999998" y="29.759999999999998" width="36" height="126.72" rx="5.04" fill="#fff" stroke="#bfa8b3" stroke-width="1.008"/><rect x="192.23999999999998" y="29.759999999999998" width="36" height="126.72" rx="5.04" fill="#fff" stroke="#bfa8b3" stroke-width="1.008"/><rect x="229.67999999999998" y="29.759999999999998" width="36" height="126.72" rx="5.04" fill="#fff" stroke="#bfa8b3" stroke-width="1.008"/><rect x="267.12" y="29.759999999999998" width="36" height="126.72" rx="5.04" fill="#fff" stroke="#bfa8b3" stroke-width="1.008"/><rect x="28.281599999999994" y="29.04" width="21.715199999999996" height="76.32" rx="3.5999999999999996" fill="#4a2a4d"/><rect x="70.9632" y="29.04" width="21.715199999999996" height="76.32" rx="3.5999999999999996" fill="#4a2a4d"/><rect x="139.8528" y="29.04" width="21.715199999999996" height="76.32" rx="3.5999999999999996" fill="#4a2a4d"/><rect x="180.6624"