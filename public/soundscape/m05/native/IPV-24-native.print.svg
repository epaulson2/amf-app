320000000008 16.09920000000001 0" fill="none" stroke="#6d326e" stroke-width="2.4" stroke-linecap="round"/><path d="M92.92 168.48 l5 -7 l2 8" fill="none" stroke="#6d326e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="89.87039999999999" y="195.32216" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#6d326e">4</text><path d="M23.04 220.48 h74.88" stroke="#6d326e" stroke-width="1.4" stroke-dasharray="4 4"/><text x="60.480000000000004" y="242.48" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" text-anchor="middle" fill="#6d326e">4 semitones</text></g><text x="6" y="276.48" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">What stayed: C4. What changed: E♭ became E, one key higher, so three</text><text x="6" y="298.23" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">semitones became four. This single change is what later separates minor</text><text x="6" y="319.98" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5c465b" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">and major triads.</text></svg>
