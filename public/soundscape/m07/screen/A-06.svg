<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 605" width="760" height="605" role="img" aria-labelledby="m07-a-06-screen-t m07-a-06-screen-d"><title id="m07-a-06-screen-t">Four motion glyphs</title><desc id="m07-a-06-screen-d">Four tiles. Oblique: the lower circle stays level while the upper square rises. Contrary: the lower circle falls while the upper square rises. Similar: both rise, the lower by more than the upper. Strict parallel: both rise by the same amount, shown with two equal dotted brackets. No pitch names are shown.</desc><defs>
<linearGradient id="m07-a-06-screen-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="m07-a-06-screen-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="m07-a-06-screen-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="m07-a-06-screen-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="m07-a-06-screen-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="m07-a-06-screen-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="m07-a-06-screen-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">SHARED · MOVEMENT WORDS</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Four ways two voices can travel</text></g><g transform="translate(0 73)"><g transform="translate(0 0)"><rect x="0" y="0" width="362" height="216" rx="12" fill="#fffaf3" stroke="#e5d6dc" stroke-width="1.5"/><text x="14" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Oblique</text><path d="M38 66 L316 36 M316 36 l-10.163502907621305 -4.207518110094514 M316 36 l-9.031868464383624 6.278961063907995" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><rect x="31" y="59" width="14" height="14" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><path d="M38 112 L316 112 M316 112 l-9.6534081807941 -5.273680924646233 M316 112 l-9.6534081807941 5.273680924646233" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="38" cy="112" r="7" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="14" y="172" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">One voice holds; the other moves.</text></g><g transform="translate(382 0)"><rect x="0" y="0" width="362" height="216" rx="12" fill="#fffaf3" stroke="#e5d6dc" stroke-width="1.5"/><text x="14" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Contrary</text><path d="M38 66 L316 40 M316 40 l-10.102543068468236 -4.351852886960262 M316 40 l-9.120385249555119 6.149680715264605" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><rect x="31" y="59" width="14" height="14" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><path d="M38 112 L316 138 M316 138 l-9.120385249555119 -6.149680715264605 M316 138 l-10.102543068468236 4.351852886960262" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="38" cy="112" r="7" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="14" y="172" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">The voices go opposite ways, apart or</text><text x="14" y="189.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">together.</text></g><g transform="translate(0 236)"><rect x="0" y="0" width="362" height="216" rx="12" fill="#fffaf3" stroke="#e5d6dc" stroke-width="1.5"/><text x="14" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Similar</text><path d="M38 66 L316 32 M316 32 l-10.222223428539856 -4.062775920108189 M316 32 l-8.941798944086651 6.406577217479777" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><rect x="31" y="59" width="14" height="14" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><path d="M38 112 L316 96 M316 96 l-9.940479286586303 -4.710294210869285 M316 96 l-9.334439788332173 5.819642071296248" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="38" cy="112" r="7" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="14" y="172" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Both go the same way, by different</text><text x="14" y="189.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">amounts.</text></g><g transform="translate(382 236)"><rect x="0" y="0" width="362" height="216" rx="12" fill="#fffaf3" stroke="#e5d6dc" stroke-width="1.5"/><text x="14" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Strict parallel</text><path d="M38 66 L316 42 M316 42 l-10.071229068892768 -4.4238382703133885 M316 42 l-9.16403983480047 6.0844370245890635" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><rect x="31" y="59" width="14" height="14" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><path d="M38 112 L316 88 M316 88 l-10.071229068892768 -4.4238382703133885 M316 88 l-9.16403983480047 6.0844370245890635" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="38" cy="112" r="7" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><path d="M328 66 V42 M328 112 V88" stroke="#9a8798" stroke-width="2.4" stroke-dasharray="2 4"/><text x="14" y="172" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Same way, same number of semitones.</text></g></g><g transform="translate(0 541)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Circle = lower voice, square = upper voice. Arrows only; the exact notes are on the lesson</text><text x="0" y="32.9" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">pictures.</text></g></g></svg>
