<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 843" width="760" height="843" role="img" aria-labelledby="m07-2a-06-screen-t m07-2a-06-screen-d"><title id="m07-2a-06-screen-t">The foundation can travel</title><desc id="m07-2a-06-screen-d">Start C4 + E4, end B3 + E4. The lower voice moves from C4 to B3, down 1 semitone. The upper voice holds E4. Result: a perfect fourth, 5 semitones. Second panel: Start C4 + E4, end D4 + E4. The lower voice moves from C4 to D4, up 2 semitones. The upper voice holds E4. Result: a major second, 2 semitones.</desc><defs>
