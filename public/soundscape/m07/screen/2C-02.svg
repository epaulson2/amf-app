<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="m07-2c-02-screen-t m07-2c-02-screen-d"><title id="m07-2c-02-screen-t">Version A: one voice holds the landscape</title><desc id="m07-2c-02-screen-d">Upper voice: E4 4 to 10 s, F4 14 to 20 s, E4 26 to 32 s (rests in between). Lower voice: C4 0 to 36 s. Sounding pairs: 4 to 10 s: C4 + E4, major third; 14 to 20 s: C4 + F4, perfect fourth; 26 to 32 s: C4 + E4, major third. Colour bands mark only the times when both voices sound.</desc><defs>
