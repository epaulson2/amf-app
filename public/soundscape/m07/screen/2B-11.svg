<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="760" height="414" role="img" aria-labelledby="m07-2b-11-screen-t m07-2b-11-screen-d"><title id="m07-2b-11-screen-t">Contrary motion, together: B3 + F4 to C4 + E4</title><desc id="m07-2b-11-screen-d">Start B3 + F4, end C4 + E4. The lower voice moves from B3 to C4, up 1 semitone. The upper voice moves from F4 to E4, down 1 semitone. The voices move toward each other: contrary motion, together. Diminished fifth (6 semitones) to major third (4 semitones).</desc><defs>
