oke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C Fill: Harmonic (Plogger),</text><text x="130" y="116" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">open/light</text></g></g><g transform="translate(0 166)"><rect x="0" y="4" width="360" height="8" rx="4" fill="#4F816B"/><text x="0" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Identity colour: Perfect fourth</text><g transform="translate(0 28)"><text x="0" y="12" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1">PLOGGER LENS · [5] · P4</text><g transform="translate(0 22) scale(1)"><path d="M3 8 H89 V50 H3 Z" transform="translate(3 0)" fill="#5c465b" opacity=".5"/><g transform="translate(12 0)"><defs><clipPath id="m07-a-09-screen-clm0755"><path d="M3 8 H89 V50 H3 Z"/></clipPath></defs><path d="M3 8 H89 V50 H3 Z" fill="#4C2748"/><path d="M3 8 H89 V50 H3 Z" fill="none" stroke="#4C2748" stroke-width="2.4" stroke-linejoin="round"/><text x="46" y="35" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#fffaf3">[5]</text></g></g><text x="130" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A Shape: Perfect-group family</text><text x="130" y="55" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">(straight)</text><text x=