<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 517" width="760" height="517" role="img" aria-labelledby="m07-2c-09-print-t m07-2c-09-print-d"><title id="m07-2c-09-print-t">Week 2 in three anchors</title><desc id="m07-2c-09-print-d">Three cards. 1 An interval: two notes together, counted in letters and semitones, example C4 + E4, a major third. 2 Motion: how two voices change between pairs: oblique, contrary, similar. 3 Two lines can make changing harmony: C4 + F4, a perfect fourth, against B3 + F4, a diminished fifth, under the same upper note.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LESSON 2C · STEP 10</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Week 2 in three ideas</text></g><g transform="translate(0 67)"><rect x="1" y="1" width="742" height="145" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" text-anchor="start" fill="#4C2748">1 · An interval is a pair</text><text x="14" y="52" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Two notes together, counted in letters and in semitones.</text><g transform="translate(14 78)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#AB812D"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">major third · M3</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C4 + E4 · 4 semitones · 3 letters</text></g></g><g transform="translate(0 224)"><rect x="1" y="1" width="742" height="113.6" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" text-anchor="start" fill="#4C2748">2 · Motion is what voices do</text><text x="14" y="52" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">How two voices change from one pair to the next.</text><g transform="translate(14 78)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Oblique: one holds. Contrary: opposite ways. Similar: the same way.</text></g></g><g transform="translate(0 349.6)"><rect x="1" y="1" width="742" height="145" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" text-anchor="start" fill="#4C2748">3 · Two lines can change the harmony</text><text x="14" y="52" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Under the same upper note, a different lower note makes a different pair.</text><g transform="translate(14 78)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#4F816B"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">perfect fourth · P4</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C4 + F4 · 5 semitones · 4 letters</text><g transform="translate(368 0)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#5366A0"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">diminished fifth · d5</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">B3 + F4 · 6 semitones · 5 letters</text></g></g></g></g></svg>
