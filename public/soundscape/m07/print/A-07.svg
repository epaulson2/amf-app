<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 347" width="760" height="347" role="img" aria-labelledby="m07-a-07-print-t m07-a-07-print-d"><title id="m07-a-07-print-t">What stayed, what changed</title><desc id="m07-a-07-print-d">Row one: C4 + E4, a major third of 4 semitones, becomes C4 + F4, a perfect fourth of 5 semitones. The lower voice C4 stayed; the upper voice moved from E4 to F4. Row two: C4 + F4 becomes B3 + F4, a diminished fifth of 6 semitones. The upper voice F4 stayed; the lower voice moved from C4 to B3.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">SHARED · COMPARE TWO PAIRS</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Which voice stayed, which one changed</text></g><g transform="translate(0 71)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#AB812D"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">major third · M3</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C4 + E4 · 4 semitones · 3 letters</text><path d="M354 28.5 h36 M382 22.5 l8 6 l-8 6" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(402 0)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#4F816B"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">perfect fourth · P4</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C4 + F4 · 5 semitones · 4 letters</text></g><g transform="translate(0 59)"><g transform="translate(0 0)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Stayed: lower voice, C4</text></g><g transform="translate(0 25.599999999999998)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Changed: upper voice, E4 to F4</text></g></g></g><g transform="translate(0 198)"><path d="M0 1 H744" stroke="#e5d6dc" stroke-width="1.5"/></g><g transform="translate(0 214)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#4F816B"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">perfect fourth · P4</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C4 + F4 · 5 semitones · 4 letters</text><path d="M354 28.5 h36 M382 22.5 l8 6 l-8 6" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(402 0)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#5366A0"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">diminished fifth · d5</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">B3 + F4 · 6 semitones · 5 letters</text></g><g transform="translate(0 59)"><g transform="translate(0 0)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Stayed: upper voice, F4</text></g><g transform="translate(0 25.599999999999998)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Changed: lower voice, C4 to B3</text></g></g></g></g></svg>
