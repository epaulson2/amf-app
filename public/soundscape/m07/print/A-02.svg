<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 483" width="760" height="483" role="img" aria-labelledby="m07-a-02-print-t m07-a-02-print-d"><title id="m07-a-02-print-t">The thirteen interval identity colours, Palette version 1.0</title><desc id="m07-a-02-print-d">Thirteen swatches in order from 0 to 12 semitones. 0: Perfect unison, #76848C; 1: Minor second, #C25562; 2: Major second, #C17D41; 3: Minor third, #8964A4; 4: Major third, #AB812D; 5: Perfect fourth, #4F816B; 6: Tritone, #5366A0; 7: Perfect fifth, #347B97; 8: Minor sixth, #A95E86; 9: Major sixth, #B47752; 10: Minor seventh, #367C79; 11: Major seventh, #7978B3; 12: Perfect octave, #89845D. The colours are an agreed artistic label for a pair of notes, not a property of sound.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">SHARED · COLOUR KEY</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Thirteen colours, one for each interval</text></g><g transform="translate(0 73)"><g transform="translate(0 0)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#76848C"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">0 · Perfect unison</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Pearl slate · #76848C</text></g><g transform="translate(0 48)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#C25562"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">1 · Minor second</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Soft coral · #C25562</text></g><g transform="translate(0 96)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#C17D41"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">2 · Major second</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Apricot ochre · #C17D41</text></g><g transform="translate(0 144)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#8964A4"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">3 · Minor third</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Orchid violet · #8964A4</text></g><g transform="translate(0 192)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#AB812D"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">4 · Major third</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Antique amber · #AB812D</text></g><g transform="translate(0 240)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#4F816B"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">5 · Perfect fourth</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Sage teal · #4F816B</text></g><g transform="translate(0 288)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#5366A0"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">6 · Tritone</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Deep periwinkle · #5366A0</text></g><g transform="translate(384 0)"><g transform="translate(0 0)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#347B97"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">7 · Perfect fifth</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Lake blue · #347B97</text></g><g transform="translate(0 48)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#A95E86"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">8 · Minor sixth</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Rose orchid · #A95E86</text></g><g transform="translate(0 96)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#B47752"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">9 · Major sixth</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Warm terracotta · #B47752</text></g><g transform="translate(0 144)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#367C79"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">10 · Minor seventh</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Deep sea teal · #367C79</text></g><g transform="translate(0 192)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#7978B3"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">11 · Major seventh</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Dusty lilac · #7978B3</text></g><g transform="translate(0 240)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#89845D"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">12 · Perfect octave</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Silver olive gold · #89845D</text></g></g></g><g transform="translate(0 419)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Palette identity colours, version 1.0. An agreed artistic label that always travels with a name</text><text x="0" y="32.9" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">and a number. It marks a pair of notes, never a voice.</text></g></g></svg>
