 cx="372" cy="16" r="13" fill="#fffdf8" stroke="#3e2241" stroke-width="2.2"/><text x="372" y="22" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#3e2241">3</text></g><g transform="translate(0 312)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Count the hops: every key, black ones too</text></g><g transform="translate(0 349)"><rect x="8.5" y="12" width="144.6" height="150" rx="6" fill="#efe9df" stroke="#3e2241" stroke-width="3"/><rect x="154.1" y="12" width="144.6" height="150" rx="6" fill="#fffdf8" stroke="#9a8798" stroke-width="1.4"/><rect x="299.7" y="12" width="144.6" height="150" rx="6" fill="#efe9df" stroke="#3e2241" stroke-width="3"/><rect x="445.29999999999995" y="12" width="144.6" height="150" rx="6" fill="#fffdf8" stroke="#9a8798" stroke-width="1.4"/><rect x="590.9" y="12" width="144.6" height="150" rx="6" fill="#fffdf8" stroke="#9a8798" stroke-width="1.4"/><rect x="101.18399999999998" y="11" width="84.448" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="267.168" y="11" width="84.448" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="535.072" y="11" width="84.448" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><text x="80.8" y="153" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#3e2241">C4</text><text x="226.39999999999998" y="153" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#6b5a68">D4</text><text x="372" y="153" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#3e2241">E4</text><text x="51