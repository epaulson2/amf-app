<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 623" width="760" height="623" role="img" aria-labelledby="m07-a-05-print-t m07-a-05-print-d"><title id="m07-a-05-print-t">Counting letters is not counting semitones</title><desc id="m07-a-05-print-d">Two copies of the keyboard from C4 to G4. First copy: C4 (lower voice) and E4 (upper voice) are marked; the keys C, D and E carry the numbers 1, 2 and 3. Second copy: four numbered hops, C4 to C♯4 to D4 to D♯4 to E4, include the two black keys. Three letters, four semitones.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">SHARED · TWO COUNTS</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Letters and semitones are different counts</text></g><g transform="translate(0 67)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Count the letters: C D E</text></g><g transform="translate(0 104)"><rect x="8.5" y="40" width="144.6" height="150" rx="6" fill="#efe9df" stroke="#3e2241" stroke-width="3"/><rect x="154.1" y="40" width="144.6" height="150" rx="6" fill="#fffdf8" stroke="#9a8798" stroke-width="1.4"/><rect x="299.7" y="40" width="144.6" height="150" rx="6" fill="#efe9df" stroke="#3e2241" stroke-width="3"/><rect x="445.29999999999995" y="40" width="144.6" height="150" rx="6" fill="#fffdf8" stroke="#9a8798" stroke-width="1.4"/><rect x="590.9" y="40