<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 772" width="760" height="772" role="img" aria-labelledby="m07-2b-02-print-t m07-2b-02-print-d"><title id="m07-2b-02-print-t">Kinds of motion, with exact examples</title><desc id="m07-2b-02-print-d">Four keyboards from B3 to G4. Oblique: C4 + E4 to C4 + F4. Contrary, apart: C4 + E4 to B3 + F4. Contrary, together: B3 + F4 to C4 + E4. Similar: C4 + E4 to D4 + F4. Notes and arrows only; no interval names.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LESSON 2B · STEP 4</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Three families of motion, exactly</text></g><g transform="translate(0 69)"><circle cx="14" cy="13" r="8" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="30" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a">lower voice</text><rect x="123.9" y="5" width="16" height="16" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="147.9" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a">upper voice</text><circle cx="249.8" cy="13" r="8" fill="none" stroke="#3e2241" stroke-width="2" stroke-dasharray="3.5 3"/><text x="265.8" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a">dashed: where it started</text></g><g transform="translate(0 109)"><g transform="translate(0 0)"><rect x="1" y="1" width="360" height="315.5" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.5"/><text x="8" y="24" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="700" text-anchor="start" fill="#4C2748">Oblique</text><text x="8" y="40" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">One voice holds while the other moves.</text><g transform="translate(8 65.5)"><rect x="8.5" y="64" width="54" height="150" rx="6" fill="#fffdf8" stroke="#9a8798" stroke-width="1.4"/><rect x="63.5" y="64" width="54" height="150" rx="6" fill="#efe9df" stroke="#3e2241" stroke-width="3"/><rect x="118.5" y="64" width="54" height="150" rx="6" fill="#fffdf8" stroke="#9a8798" stroke-width="1.4"/><rect x="173.5" y="64" width="54" height="150" rx="6" fill="#fffdf8" stroke="#9a8798" stroke-width="1.4"/><rect x="228.5" y="64" width="54" height="150" rx="6" fill="#efe9df" stroke="#3e2241" stroke-width="3"/><rect x="283.5" y="64" width="54" height="150" rx="6" fill="#fffdf8" stroke="#9a8798" stroke-width="1.4"/><rect x="98.19999999999999" y="63" width="31.9" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="160.89999999999998" y="63" width="31.9" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><rect x="262.1" y="63" width="31.9" height="93" rx="4" fill="#3a2140" stroke="#2a1630" stroke-width="1"/><text x="35.5" y="205" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#6b5a68">B3</text><text x="90.5" y="205" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#3e2241">C4</text><text x="145.5" y="205" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" f