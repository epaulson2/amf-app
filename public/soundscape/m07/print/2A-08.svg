<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 538" width="760" height="538" role="img" aria-labelledby="m07-2a-08-print-t m07-2a-08-print-d"><title id="m07-2a-08-print-t">Your keyboard sheet: build, then change</title><desc id="m07-2a-08-print-d">A worksheet with blank lines. Build a major third: lower note, upper note, letters, semitones. Build a minor third: the same four blanks. Three changes from C4 + E4: upper voice up 1 (worked example: C4 + F4, perfect fourth, 4 letters, 5 semitones), lower voice down 1 (blank), lower voice up 2 (blank).</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LESSON 2A · STEP 9</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Your keyboard sheet</text></g><g transform="translate(0 65)"><text x="0" y="34" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">Lower note</text><path d="M0 58 H176" stroke="#3e2241" stroke-width="1.6"/><text x="190" y="34" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">Upper note</text><path d="M190 58 H366" stroke="#3e2241" stroke-width="1.6"/><text x="380" y="34" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">Letters</text><path d="M380 58 H556" stroke="#3e2241" stroke-width="1.6"/><text x="570" y="34" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">Semitones</text><path d="M570 58 H746" stroke="#3e2241" stroke-width="1.6"/><text x="0" y="8" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Build a major third</text><g transform="translate(0 106)"><text x="0" y="34" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">Lower note</text><path d="M0 58 H176" stroke="#3e2241" stroke-width="1.6"/><text x="190" y="34" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">Upper note</text><path d="M190 58 H366" stroke="#3e2241" stroke-width="1.6"/><text x="380" y="34" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">Letters</text><path d="M380 58 H556" stroke="#3e2241" stroke-width="1.6"/><text x="570" y="34" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">Semitones</text><path d="M570 58 H746" stroke="#3e2241" stroke-width="1.6"/><text x="0" y="8" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Build a minor third</text></g><text x="0" y="232" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Three changes from C4 + E4</text><rect x="0" y="246" width="736" height="46" rx="10" fill="none" stroke="#9a8798" stroke-width="1.5"/><text x="12" y="266" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#3e2241">Upper voice up 1</text><rect x="190" y="258" width="8" height="24" rx="4" fill="#4F816B"/><text x="206" y="276" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#3e2241">C4 + F4 · P4 · 4 letters · 5 semitones</text><text x="730" y="266" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#6b5a68" font-style="italic">example</text><rect x="0" y="302" width="736" height="46" rx="10" fill="none" stroke="#9a8798" stroke-width="1.5"/><text x="12" y="322" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#3e2241">Lower voice down 1</text><path d="M190 334 H724" stroke="#3e2241" stroke-width="1.6"/><text x="190" y="324" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#6b5a68">New pair, letters, semitones</text><rect x="0" y="358" width="736" height="46" rx="10" fill="none" stroke="#9a8798" stroke-width="1.5"/><text x="12" y="378" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#3e2241">Lower voice up 2</text><path d="M190 390 H724" stroke="#3e2241" stroke-width="1.6"/><text x="190" y="380" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#6b5a68">New pair, letters, semitones</text></g><g transform="translate(0 493)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Do this on your own keyboard. Nothing here is scored or sent anywhere.</text></g></g></svg>
