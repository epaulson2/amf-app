<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 369" width="760" height="369" role="img" aria-labelledby="m07-2c-08-print-t m07-2c-08-print-d"><title id="m07-2c-08-print-t">What changes, and your response</title><desc id="m07-2c-08-print-d">Left panel, what changes, 14 to 20 seconds: Version A is C4 + F4, a perfect fourth of 5 semitones; Version B is B3 + F4, a diminished fifth of 6 semitones. Right panel, your response: blank lines for I kept, I moved, the result felt.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LESSON 2C · STEP 9</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">What changed, and what you make of it</text></g><g transform="translate(0 69)"><g transform="translate(0 0)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">What changes (fact)</text></g><g transform="translate(0 33)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">From 14 to 20 seconds:</text></g><g transform="translate(0 63.9)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Version A</text></g><g transform="translate(0 93.4)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#4F816B"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">perfect fourth · P4</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C4 + F4 · 5 semitones · 4 letters</text></g><g transform="translate(0 156.4)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Version B</text></g><g transform="translate(0 185.9)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#5366A0"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">diminished fifth · d5</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">B3 + F4 · 6 semitones · 5 letters</text></g><g transform="translate(394 0)"><text x="0" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Your response (open)</text><text x="0" y="62" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#3e2241">I kept</text><path d="M55.599999999999994 62 H360" stroke="#3e2241" stroke-width="1.5"/><text x="0" y="108" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#3e2241">I moved</text><path d="M63.199999999999996 108 H360" stroke="#3e2241" stroke-width="1.5"/><text x="0" y="154" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#3e2241">The result felt</text><path d="M124 154 H360" stroke="#3e2241" stroke-width="1.5"/></g></g><g transform="translate(0 323.9)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">There is no correct feeling to write. Your music stays in your own studio.</text></g></g></svg>
