<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 198" width="760" height="198" role="img" aria-labelledby="m07-h-01-print-t m07-h-01-print-d"><title id="m07-h-01-print-t">The Week 2 path: three lessons</title><desc id="m07-h-01-print-d">Three boxes joined by arrows: Lesson 2A, one voice moves; Lesson 2B, both voices move; Lesson 2C, two short sketches.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">WEEK 2 HUB</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Three lessons, one idea at a time</text></g><g transform="translate(0 73)"><g transform="translate(0 0)"><rect x="1" y="1" width="216.66666666666666" height="103" rx="14" fill="#fff" stroke="#9a8798" stroke-width="1.8"/><text x="14" y="28" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1">Lesson 2A</text><text x="14" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" text-anchor="start" fill="#4C2748">One voice moves</text><text x="14" y="66" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Count a distance, then</text><text x="14" y="83.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">move one note.</text></g><path d="M226.66666666666666 52.5 h28 M246.66666666666666 46.5 l8 6 l-8 6" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(262.66666666666663 0)"><rect x="1" y="1" width="216.66666666666666" height="103" rx="14" fill="#fff" stroke="#9a8798" stroke-width="1.8"/><text x="14" y="28" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1">Lesson 2B</text><text x="14" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" text-anchor="start" fill="#4C2748">Both voices move</text><text x="14" y="66" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Five changes from the</text><text x="14" y="83.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">same two notes.</text></g><path d="M489.33333333333326 52.5 h28 M509.33333333333326 46.5 l8 6 l-8 6" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(525.3333333333333 0)"><rect x="1" y="1" width="216.66666666666666" height="103" rx="14" fill="#fff" stroke="#9a8798" stroke-width="1.8"/><text x="14" y="28" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1">Lesson 2C</text><text x="14" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" text-anchor="start" fill="#4C2748">Two short sketches</text><text x="14" y="66" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">The same melody over two</text><text x="14" y="83.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">lower lines.</text></g></g></g></svg>
