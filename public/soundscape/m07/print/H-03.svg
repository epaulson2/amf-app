<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 612" width="760" height="612" role="img" aria-labelledby="m07-h-03-print-t m07-h-03-print-d"><title id="m07-h-03-print-t">From a note to harmony</title><desc id="m07-h-03-print-d">Five boxes in a chain: 1 Pitch, 2 Interval (worked example: C4 + E4, a major third, 4 semitones, 3 letters), 3 Voice, 4 Motion, 5 Harmony.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">WEEK 2 HUB</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">How the week builds</text></g><g transform="translate(0 73)"><g transform="translate(4 0)"><rect x="1" y="1" width="734" height="72" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.6"/><text x="18" y="31" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" text-anchor="start" fill="#4C2748">1 · Pitch</text><text x="18" y="52" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">One note, like C4.</text></g><path d="M372 76 v14 M365 84 l7 8 l7 -8" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(4 96)"><rect x="1" y="1" width="734" height="133" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.6"/><text x="18" y="31" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" text-anchor="start" fill="#4C2748">2 · Interval</text><text x="18" y="52" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Two notes: count the letters, then the semitones.</text><g transform="translate(18 70)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#AB812D"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">major third · M3</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C4 + E4 · 4 semitones · 3 letters</text></g></g><path d="M372 233 v14 M365 241 l7 8 l7 -8" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(4 253)"><rect x="1" y="1" width="734" height="72" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.6"/><text x="18" y="31" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" text-anchor="start" fill="#4C2748">3 · Voice</text><text x="18" y="52" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">One line of notes over time.</text></g><path d="M372 329 v14 M365 337 l7 8 l7 -8" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(4 349)"><rect x="1" y="1" width="734" height="72" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.6"/><text x="18" y="31" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" text-anchor="start" fill="#4C2748">4 · Motion</text><text x="18" y="52" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">How the voices change from one pair to the next.</text></g><path d="M372 425 v14 M365 433 l7 8 l7 -8" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(4 445)"><rect x="1" y="1" width="734" height="72" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.6"/><text x="18" y="31" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" text-anchor="start" fill="#4C2748">5 · Harmony</text><text x="18" y="52" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">What the pairs make when they sound together.</text></g></g></g></svg>
