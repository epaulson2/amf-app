', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#3e2241">F4</text><text x="675.3333333333333" y="205" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#6b5a68">G4</text><circle cx="190" cy="173" r="12" fill="none" stroke="#3e2241" stroke-width="2" stroke-dasharray="3.5 3"/><circle cx="311.3333333333333" cy="173" r="12" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><rect x="420.66666666666663" y="161" width="24" height="24" rx="3" fill="none" stroke="#3e2241" stroke-width="2" stroke-dasharray="3.5 3"/><rect x="542" y="161" width="24" height="24" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><circle cx="190" cy="56" r="5.5" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><path d="M190 56 Q250.66666666666666 12 309.71432384029583 54.825773334720054" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round"/><path d="M311.3333333333333 56 l-10.221109381868608 -1.2364962611660024 M311.3333333333333 56 l-4.349976055468884 -9.331543726353498" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round"/><text x="250.66666666666666" y="28" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">up 2</text><rect x="427.16666666666663" y="50.5" width="11" height="11" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><path d="M432.66666666666663 56 Q493.3333333333333 -24 552.7915177145161 54.40639698617513" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round"/><path d="M554 56 l-9.422177819239543 -4.1500078485022645 M554 56 l-1.454162750115195 -10.192419275921562" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round"/><text x="493.3333333333333" y="10" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="mi