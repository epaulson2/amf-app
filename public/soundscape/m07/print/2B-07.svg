<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" width="760" height="414" role="img" aria-labelledby="m07-2b-07-print-t m07-2b-07-print-d"><title id="m07-2b-07-print-t">Change 5: both rise, a major third becomes a minor third</title><desc id="m07-2b-07-print-d">Start C4 + E4, end D4 + F4. The lower voice moves from C4 to D4, up 2 semitones. The upper voice moves from E4 to F4, up 1 semitone. Similar motion, not strict parallel in this course. The pair changes from a major third (4 semitones) to a minor third (3 semitones).</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LESSON 2B · STEP 6</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Moving together: similar motion</text></g><g transform="translate(0 67)"><circle cx="14" cy="13" r="8" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="30" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a">lower voice</text><rect x="123.9" y="5" width="16" height="16" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="147.9" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a">upper voice</text><circle cx="249.8" cy="13" r="8" fill="none" stroke="#3e2241" stroke-width="2" stroke-dasharray="3.5 3"/><text x="265.8" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fil