14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Made-up pattern, only to show how a lane reads. Not a Week 2 exercise.</text></g></g></svg>
