<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" height="368" role="img" aria-labelledby="m07-a-04-print-t m07-a-04-print-d"><title id="m07-a-04-print-t">Reading a two-lane timeline</title><desc id="m07-a-04-print-d">A made-up reading example over four stages. Upper lane: E4 from 0 to 1, a rest from 1 to 2, F4 from 2 to 4. Lower lane: C4 from 0 to 4. A dashed vertical line at stage 3 crosses F4 above C4.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">SHARED · TIMELINE</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Each voice gets its own lane</text></g><g transform="translate(0 73)"><circle cx="14" cy="13" r="8" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="30" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a">lower voice</text><rect x="123.9" y="5" width="16" height="16" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="147.9" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a">upper voice</text></g><g transform="translate(0 117)"><rect x="6" y="46" width="12" height="12" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="26" y="57" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#3e2241">Upper voice</text><rect x="136" y="30" width="598" height="44" rx="8" fill="#fff" stroke="#e5d6dc" stroke-width="1.2"/><rect x="287.5" y="37" width="145.5" height="30" rx="6" fill="none" stroke="#9a8798" stroke-width="1.4" stroke-dasharray="5 4"/><text x="360.25" y="56.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#6b5a68" font-style="italic">rest</text><rect x="136" y="36" width="149.5" height="32" rx="7" fill="#fffdf8" stroke="#3e2241" stroke-width="2.6"/><rect x="144.4" y="47.4" width="9.2" height="9.2" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="216.75" y="58" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#3e2241">E4</text><rect x="435" y="36" width="299" height="32" rx="7" fill="#fffdf8" stroke="#3e2241" stroke-width="2.6"/><rect x="443.4" y="47.4" width="9.2" height="9.2" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="590.5" y="58" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#3e2241">F4</text><circle cx="12" cy="108" r="6" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="26" y="113" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#3e2241">Lower voice</text><rect x="136" y="86" width="598" height="44" rx="8" fill="#fff" stroke="#e5d6dc" stroke-width="1.2"/><rect x="136" y="92" width="598" height="32" rx="7" fill="#ece5d9" stroke="#3e2241" stroke-width="1.8"/><circle cx="149" cy="108" r="4.6" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="441" y="114" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#3e2241">C4</text><path d="M584.5 28 V138" stroke="#3e2241" stroke-width="2" stroke-dasharray="3 4"/><text x="584.5" y="16" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12