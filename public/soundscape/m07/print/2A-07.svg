<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 377" width="760" height="377" role="img" aria-labelledby="m07-2a-07-print-t m07-2a-07-print-d"><title id="m07-2a-07-print-t">Three changes from one beginning</title><desc id="m07-2a-07-print-d">All three start from C4 + E4, a major third of 4 semitones. Change 1, upper voice up one semitone: C4 + F4, a perfect fourth of 5 semitones. Change 2, lower voice down one semitone: B3 + E4, a perfect fourth of 5 semitones. Change 3, lower voice up two semitones: D4 + E4, a major second of 2 semitones.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LESSON 2A · STEPS 8 AND 10</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">One beginning, three changes</text></g><g transform="translate(0 67)"><rect x="1" y="1" width="742" height="88" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="700" text-anchor="start" fill="#4C2748">1 · Upper voice up one semitone</text><g transform="translate(14 38)"><rect x="0" y="0" width="9" height="30" rx="4" fill="#AB812D"/><text x="20" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">C4 + E4 · M3</text><text x="20" y="29" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">major third, 4 semitones</text></g><g transform="translate(372 38)"><rect x="0" y="0" width="9" height="30" rx="4" fill="#4F816B"/><text x="20" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">C4 + F4 · P4</text><text x="20" y="29" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">perfect fourth, 5 semitones</text></g></g><g transform="translate(0 167)"><rect x="1" y="1" width="742" height="88" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="700" text-anchor="start" fill="#4C2748">2 · Lower voice down one semitone</text><g transform="translate(14 38)"><rect x="0" y="0" width="9" height="30" rx="4" fill="#AB812D"/><text x="20" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">C4 + E4 · M3</text><text x="20" y="29" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">major third, 4 semitones</text></g><g transform="translate(372 38)"><rect x="0" y="0" width="9" height="30" rx="4" fill="#4F816B"/><text x="20" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">B3 + E4 · P4</text><text x="20" y="29" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">perfect fourth, 5 semitones</text></g></g><g transform="translate(0 267)"><rect x="1" y="1" width="742" height="88" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="700" text-anchor="start" fill="#4C2748">3 · Lower voice up two semitones</text><g transform="translate(14 38)"><rect x="0" y="0" width="9" height="30" rx="4" fill="#AB812D"/><text x="20" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">C4 + E4 · M3</text><text x="20" y="29" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">major third, 4 semitones</text></g><g transform="translate(372 38)"><rect x="0" y="0" width="9" height="30" rx="4" fill="#C17D41"/><text x="20" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">D4 + E4 · M2</text><text x="20" y="29" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">major second, 2 semitones</text></g></g></g></svg>
