<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 363" width="760" height="363" role="img" aria-labelledby="m07-2b-12-print-t m07-2b-12-print-d"><title id="m07-2b-12-print-t">Two kinds of words: along a path, up a stage</title><desc id="m07-2b-12-print-d">Two stages. Lower voice holds C4; upper voice goes from E4 to F4. Along the path: movement words. At stage 2, C4 + F4: a perfect fourth, 5 semitones, in the perfect fourth colour. Interval words describe the pair at a single stage.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LESSON 2B · STEPS 7 AND 9</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Two kinds of words</text></g><g transform="translate(0 65)"><circle cx="14" cy="13" r="8" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="30" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a">lower voice</text><rect x="123.9" y="5" width="16" height="16" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="147.9" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a">upper voice</text></g><g transform="translate(0 101)"><path d="M64 141 H738" stroke="#cdbac3" stroke-width="1"/><text x="58" y="145.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#3e2241">C4</text><path d="M64 119 H738" stroke="#e5d6dc" stroke-width="1"/><path d="M64 97 H738" stroke="#e5d6dc" stroke-width="1"/><path d="M64 75 H738" stroke="#e5d6dc" stroke-width="1"/><path d="M64 53 H738" stroke="#cdbac3" stroke-width="1"/><text x="58" y="57.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#3e2241">E4</text><path d="M64 31 H738" stroke="#cdbac3" stroke-width="1"/><text x="58" y="35.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#3e2241">F4</text><path d="M84 141 L702 141" fill="none" stroke="#3e2241" stroke-width="3"  stroke-linejoin="round" opacity=".55"/><path d="M84 53 L702 31" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-dasharray="1 0" stroke-linejoin="round" opacity=".55"/><circle cx="84" cy="141" r="8" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><rect x="76" y="45" width="16" height="16" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="84" y="174" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6b5a68">stage 1</text><path d="M702 141 V31" stroke="#4F816B" stroke-width="9" stroke-linecap="round" opacity=".85"/><circle cx="702" cy="141" r="8" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><rect x="694" y="23" width="16" height="16" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="702" y="174" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6b5a68">stage 2</text></g><g transform="translate(0 291)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Movement words: what each voice does from one stage to the next, along a path.</text></g><g transform="translate(0 321)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Interval words: the pair at one stage, C4 + F4, a perfect fourth.</text></g></g></svg>
