<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 407" width="760" height="407" role="img" aria-labelledby="m07-2b-08-print-t m07-2b-08-print-d"><title id="m07-2b-08-print-t">The five changes, all from C4 + E4</title><desc id="m07-2b-08-print-d">Five rows, each starting from C4 + E4. 1, Only upper rises, Oblique motion: C4 + F4, perfect fourth, 5 semitones. 2, Only lower falls, Oblique motion: B3 + E4, perfect fourth, 5 semitones. 3, Only lower rises, Oblique motion: D4 + E4, major second, 2 semitones. 4, Both move apart, Contrary motion: B3 + F4, diminished fifth, 6 semitones. 5, Both rise, Similar motion: D4 + F4, minor third, 3 semitones.</desc><rect width="100%" height="100%" fill="#fff"/><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LESSON 2B · STEPS 8, 9 AND 11</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Five changes, one beginning</text></g><g transform="translate(0 65)"><rect x="1" y="1" width="742" height="56" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.5"/><g transform="translate(14 8)"><text x="0" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">1 · Only upper rises</text></g><text x="262" y="24" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#4a3a4a">Oblique motion</text><text x="262" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a">C4 + E4 → C4 + F4</text><rect x="512" y="14" width="9" height="30" rx="4" fill="#4F816B"/><text x="528" y="28" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241">perfect fourth · P4</text><text x="528" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">5 semitones</text></g><g transform="translate(0 131)"><rect x="1" y="1" width="742" height="56" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.5"/><g transform="translate(14 8)"><text x="0" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">2 · Only lower falls</text></g><text x="262" y="24" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#4a3a4a">Oblique motion</text><text x="262" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a">C4 + E4 → B3 + E4</text><rect x="512" y="14" width="9" height="30" rx="4" fill="#4F816B"/><text x="528" y="28" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241">perfect fourth · P4</text><text x="528" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">5 semitones</text></g><g transform="translate(0 197)"><rect x="1" y="1" width="742" height="56" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.5"/><g transform="translate(14 8)"><text x="0" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">3 · Only lower rises</text></g><text x="262" y="24" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#4a3a4a">Oblique motion</text><text x="262" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a">C4 + E4 → D4 + E4</text><rect x="512" y="14" width="9" height="30" rx="4" fill="#C17D41"/><text x="528" y="28" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241">major second · M2</text><text x="528" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">2 semitones</text></g><g transform="translate(0 263)"><rect x="1" y="1" width="742" height="56" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.5"/><g transform="translate(14 8)"><text x="0" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">4 · Both move apart</text></g><text x="262" y="24" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#4a3a4a">Contrary motion</text><text x="262" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a">C4 + E4 → B3 + F4</text><rect x="512" y="14" width="9" height="30" rx="4" fill="#5366A0"/><text x="528" y="28" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241">diminished fifth · d5</text><text x="528" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">6 semitones</text></g><g transform="translate(0 329)"><rect x="1" y="1" width="742" height="56" rx="12" fill="#fff" stroke="#9a8798" stroke-width="1.5"/><g transform="translate(14 8)"><text x="0" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">5 · Both rise</text></g><text x="262" y="24" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#4a3a4a">Similar motion</text><text x="262" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a">C4 + E4 → D4 + F4</text><rect x="512" y="14" width="9" height="30" rx="4" fill="#8964A4"/><text x="528" y="28" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241">minor third · m3</text><text x="528" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">3 semitones</text></g></g></svg>
