<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 697" width="360" height="697" role="img" aria-labelledby="m07-2c-06-narrow-t m07-2c-06-narrow-d"><title id="m07-2c-06-narrow-t">Four words: voice, vertical interval, voice leading, counterpoint</title><desc id="m07-2c-06-narrow-d">Four cards. Voice: one line of notes over time. Vertical interval: the distance between two notes sounding together; example C4 + E4, a major third of 4 semitones. Voice leading: how each voice moves from one pair to the next. Counterpoint: two or more independent lines sounding together.</desc><defs>
