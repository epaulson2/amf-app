d" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">notes to the next.</text><g transform="translate(14 89)"><rect x="8" y="24" width="12" height="12" rx="3" fill="none" stroke="#3e2241" stroke-width="2" stroke-dasharray="3.5 3"/><path d="M26 30 h100.4 M118.4 24 l8 6 l-8 6" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="130.4" y="6" width="12" height="12" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><circle cx="189.6" cy="32" r="6" fill="none" stroke="#3e2241" stroke-width="2" stroke-dasharray="3.5 3"/><path d="M201.6 32 h98.6 M292.2 26 l8 6 l-8 6" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="306" cy="32" r="6" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/></g></g><g transform="translate(0 462.5)"><rect x="1" y="1" width="342" height="143" rx="12" fill="#fffaf3" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" text-anchor="start" fill="#4C2748">Counterpoint</text><text x="14" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Two or more independent lines sounding</text><text x="14" y="61.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">together.</text><g transform="translate(14 89)"><path d="M8 12 L126.4 12 L221.2 6 L308 12" fill="none" stroke="#3e2241" stroke-width="3" stroke-linejoin="round"/><path d="M8 34 L110.6 38 L205.4 30 L308 34" fill="none" stroke="#3e2241" stroke-width="3" stroke-linejoin="round" opacity=".6"/><rect x="3" y="7" width="10" height="10" rx="3" fill="#fffdf8" 