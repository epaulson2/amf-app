<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 861" width="360" height="861" role="img" aria-labelledby="m07-2b-06-narrow-t m07-2b-06-narrow-d"><title id="m07-2b-06-narrow-t">Change 4: moving apart, B3 and F4, a diminished fifth</title><desc id="m07-2b-06-narrow-d">Start C4 + E4, end B3 + F4. The lower voice moves from C4 to B3, down 1 semitone. The upper voice moves from E4 to F4, up 1 semitone. The new pair B3 + F4 spans 5 letters and 6 semitones: a diminished fifth, in the tritone colour #5366A0, Plogger bracket [6] (straight contour, shadow on both sides, midtone dotted fill).</desc><defs>
