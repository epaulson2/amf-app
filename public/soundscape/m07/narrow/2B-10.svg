<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 397" width="360" height="397" role="img" aria-labelledby="m07-2b-10-narrow-t m07-2b-10-narrow-d"><title id="m07-2b-10-narrow-t">A two-voice path in four stages</title><desc id="m07-2b-10-narrow-d">Four stages. Stage 1: C4 + E4, major third, 4 semitones. Stage 2: C4 + F4, perfect fourth, 5 semitones. Stage 3: B3 + F4, diminished fifth, 6 semitones. Stage 4: C4 + E4, major third, 4 semitones. Stages are steps in order, with no clock.</desc><defs>
