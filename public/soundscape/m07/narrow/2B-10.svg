<radialGradient id="m07-2b-10-narrow-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="m07-2b-10-narrow-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="m07-2b-10-narrow-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="m07-2b-10-narrow-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="m07-2b-10-narrow-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LESSON 2B · STEP 10</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">A path of four stages</text></g><g transform="translate(0 63)"><circle cx="14" cy="13" r="8" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="30" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a">lower voice</text><rect x="123.9" y="5" width="16" height="16" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="147.9" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a">upper voice</text></g><g transform="translate(0 101)"><path d="M48 163 H338" stroke="#cdbac3" stroke-width="1"/><text x="42" y="167.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#3e2241">B3</text><path d="M48 141 H338" stroke="#cdbac3" stroke-width="1"/><text x="42" y="145.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#3e2241">C4</text><path d="M48 119 H338" stroke="#e5d6dc" stroke-width="1"/><path d="M48 97 H338" stroke="#e5d6dc" stroke-width="1"/><path d="M48 75 H338" stroke="#e5d6dc" stroke-width="1"/><path d="M48 53 H338" stroke="#cdbac3" stroke-width="1"/><text x="42" y="57.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="end" fill