<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 417" width="360" height="417" role="img" aria-labelledby="m07-a-04-narrow-t m07-a-04-narrow-d"><title id="m07-a-04-narrow-t">Reading a two-lane timeline</title><desc id="m07-a-04-narrow-d">A made-up reading example over four stages. Upper lane: E4 from 0 to 1, a rest from 1 to 2, F4 from 2 to 4. Lower lane: C4 from 0 to 4. A dashed vertical line at stage 3 crosses F4 above C4.</desc><defs>
