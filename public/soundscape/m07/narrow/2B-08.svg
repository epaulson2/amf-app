<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 633" width="360" height="633" role="img" aria-labelledby="m07-2b-08-narrow-t m07-2b-08-narrow-d"><title id="m07-2b-08-narrow-t">The five changes, all from C4 + E4</title><desc id="m07-2b-08-narrow-d">Five rows, each starting from C4 + E4. 1, Only upper rises, Oblique motion: C4 + F4, perfect fourth, 5 semitones. 2, Only lower falls, Oblique motion: B3 + E4, perfect fourth, 5 semitones. 3, Only lower rises, Oblique motion: D4 + E4, major second, 2 semitones. 4, Both move apart, Contrary motion: B3 + F4, diminished fifth, 6 semitones. 5, Both rise, Similar motion: D4 + F4, minor third, 3 semitones.</desc><defs>
<linearGradient id="m07-2b-08-narrow-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="m07-2b-08-narrow-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="m07-2b-08-narrow-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="m07-2b-08-narrow-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="m07-2b-08-narrow-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="m07-2b-08-narrow-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="m07-2b-08-narrow-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LESSON 2B · STEPS 8, 9 AND 11</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Five changes, one beginning</text></g><g transform="translate(0 61)"><rect x="1" y="1" width="342" height="102" rx="12" fill="#fffaf3" stroke="#9a8798" stroke-width="1.5"/><g transform="translate(12 0)"><text x="0" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">1 · Only upper rises</text></g><text x="12" y="39" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Oblique motion · C4 + E4 → C4 + F4</text><rect x="12" y="66" width="9" height="28" rx="4" fill="#4F816B"/><text x="28" y="79" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241">perfect fourth · P4</text><text x="28" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">5 semitones</text></g><g transform="translate(0 173)"><rect x="1" y="1" width="342" height="102" rx="12" fill="#fffaf3" stroke="#9a8798" stroke-width="1.5"/><g transform="translate(12 0)"><text x="0" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">2 · Only lower falls</text></g><text x="12" y="39" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Oblique motion · C4 + E4 → B3 + E4</text><rect x="12" y="66" width="9" height="28" rx="4" fill="#4F816B"/><text x="28" y="79" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241">perfect fourth · P4</text><text x="28" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">5 semitones</text></g><g transform="translate(0 285)"><rect x="1" y="1" width="342" height="102" rx="12" fill="#fffaf3" stroke="#9a8798" stroke-width="1.5"/><g transform="translate(12 0)"><text x="0" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">3 · Only lower rises</text></g><text x="12" y="39" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Oblique motion · C4 + E4 → D4 + E4</text><rect x="12" y="66" width="9" height="28" rx="4" fill="#C17D41"/><text x="28" y="79" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241">major second · M2</text><text x="28" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">2 semitones</text></g><g transform="translate(0 397)"><rect x="1" y="1" width="342" height="102" rx="12" fill="#fffaf3" stroke="#9a8798" stroke-width="1.5"/><g transform="translate(12 0)"><text x="0" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">4 · Both move apart</text></g><text x="12" y="39" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Contrary motion · C4 + E4 → B3 + F4</text><rect x="12" y="66" width="9" height="28" rx="4" fill="#5366A0"/><text x="28" y="79" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241">diminished fifth · d5</text><text x="28" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">6 semitones</text></g><g transform="translate(0 509)"><rect x="1" y="1" width="342" height="102" rx="12" fill="#fffaf3" stroke="#9a8798" stroke-width="1.5"/><g transform="translate(12 0)"><text x="0" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">5 · Both rise</text></g><text x="12" y="39" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Similar motion · C4 + E4 → D4 + F4</text><rect x="12" y="66" width="9" height="28" rx="4" fill="#8964A4"/><text x="28" y="79" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241">minor third · m3</text><text x="28" y="94" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">3 semitones</text></g></g></svg>
