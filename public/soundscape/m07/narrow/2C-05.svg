<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 817" width="360" height="817" role="img" aria-labelledby="m07-2c-05-narrow-t m07-2c-05-narrow-d"><title id="m07-2c-05-narrow-t">Three snapshots: what stayed, what changed</title><desc id="m07-2c-05-narrow-d">Snapshot 4 to 10 s: A and B both C4 + E4, major third, 4 semitones. Snapshot 14 to 20 s: A C4 + F4, perfect fourth, 5 semitones; B B3 + F4, diminished fifth, 6 semitones. Snapshot 26 to 32 s: both C4 + E4 again.</desc><defs>
