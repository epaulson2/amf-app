<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 580" width="360" height="580" role="img" aria-labelledby="m07-2a-05-narrow-t m07-2a-05-narrow-d"><title id="m07-2a-05-narrow-t">One voice moves: a major third becomes a perfect fourth</title><desc id="m07-2a-05-narrow-d">Start C4 + E4, end C4 + F4. The lower voice holds C4. The upper voice moves from E4 to F4, up 1 semitone. The pair changes from a major third (4 semitones) to a perfect fourth (5 semitones).</desc><defs>
