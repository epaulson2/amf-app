ns-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">Upper note</text><path d="M0 98 H150" stroke="#3e2241" stroke-width="1.6"/><text x="0" y="114" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">Letters</text><path d="M0 138 H150" stroke="#3e2241" stroke-width="1.6"/><text x="0" y="154" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">Semitones</text><path d="M0 178 H150" stroke="#3e2241" stroke-width="1.6"/><text x="0" y="8" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Build a minor third</text></g><text x="0" y="500" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Three changes from C4 + E4</text><rect x="0" y="514" width="336" height="74" rx="10" fill="none" stroke="#9a8798" stroke-width="1.5"/><text x="12" y="534" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#3e2241">Upper voice up 1</text><rect x="12" y="546" width="8" height="24" rx="4" fill="#4F816B"/><text x="28" y="564" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#3e2241">C4 + F4 · P4 · 4 letters · 5 semitones</text><text x="330" y="534" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#6b5a68" font-style="italic">example</text><rect x="0" y="598" width="336" height="74" rx="10" fill="none" stroke="#9a8798" stroke-width="1.5"/><text x="12" y="618" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#3e2241">Lower voice down 1</text><path d="M12 652 H320" stroke="#3e2241" stroke-width="1.6"/><text x="12" y="642" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#6b5a68">New pair, letters, semitones</text><rect x="0" y="682" width="336" height="74" rx="10" fill="none" stroke="#9a8798" stroke-width="1.5"/><text x="12" y="702" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#3e2241">Lower voice up 2</text><path d="M12 736 H320" stroke="#3e2241" stroke-width="1.6"/><text x="12" y="726" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#6b5a68">New pair, letters, semitones</text></g><g transform="translate(0 841)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Do this on your own keyboard. Nothing here is</text><text x="0" y="32.9" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">scored or sent anywhere.</text></g></g></svg>
