<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 905" width="360" height="905" role="img" aria-labelledby="m07-2a-08-narrow-t m07-2a-08-narrow-d"><title id="m07-2a-08-narrow-t">Your keyboard sheet: build, then change</title><desc id="m07-2a-08-narrow-d">A worksheet with blank lines. Build a major third: lower note, upper note, letters, semitones. Build a minor third: the same four blanks. Three changes from C4 + E4: upper voice up 1 (worked example: C4 + F4, perfect fourth, 4 letters, 5 semitones), lower voice down 1 (blank), lower voice up 2 (blank).</desc><defs>
<linearGradient id="m07-2a-08-narrow-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="m07-2a-08-narrow-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="m07-2a-08-narrow-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="m07-2a-08-narrow-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="m07-2a-08-narrow-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="m07-2a-08-narrow-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="m07-2a-08-narrow-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
