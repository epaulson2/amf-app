<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 652" width="360" height="652" role="img" aria-labelledby="m07-2c-09-narrow-t m07-2c-09-narrow-d"><title id="m07-2c-09-narrow-t">Week 2 in three anchors</title><desc id="m07-2c-09-narrow-d">Three cards. 1 An interval: two notes together, counted in letters and semitones, example C4 + E4, a major third. 2 Motion: how two voices change between pairs: oblique, contrary, similar. 3 Two lines can make changing harmony: C4 + F4, a perfect fourth, against B3 + F4, a diminished fifth, under the same upper note.</desc><defs>
<linearGradient id="m07-2c-09-narrow-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="m07-2c-09-narrow-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="m07-2c-09-narrow-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="m07-2c-09-narrow-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="m07-2c-09-narrow-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="m07-2c-09-narrow-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="m07-2c-09-narrow-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LESSON 2C · STEP 10</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Week 2 in three ideas</text></g><g transform="translate(0 63)"><rect x="1" y="1" width="342" height="163" rx="12" fill="#fffaf3" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" text-anchor="start" fill="#4C2748">1 · An interval is a pair</text><text x="14" y="52" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Two notes together, counted in letters</text><text x="14" y="70" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">and in semitones.</text><g transform="translate(14 96)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#AB812D"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">major third · M3</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C4 + E4 · 4 semitones · 3 letters</text></g></g><g transform="translate(0 238)"><rect x="1" y="1" width="342" height="151.2" rx="12" fill="#fffaf3" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" text-anchor="start" fill="#4C2748">2 · Motion is what voices do</text><text x="14" y="52" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">How two voices change from one pair to</text><text x="14" y="70" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">the next.</text><g transform="translate(14 96)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Oblique: one holds. Contrary: opposite</text><text x="0" y="33.599999999999994" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">ways. Similar: the same way.</text></g></g><g transform="translate(0 401.2)"><rect x="1" y="1" width="342" height="228" rx="12" fill="#fffaf3" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" text-anchor="start" fill="#4C2748">3 · Two lines can change the harmony</text><text x="14" y="52" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Under the same upper note, a different</text><text x="14" y="70" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">lower note makes a different pair.</text><g transform="translate(14 96)"><g transform="translate(0 0)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#4F816B"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">perfect fourth · P4</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">C4 + F4 · 5 semitones · 4 letters</text></g><g transform="translate(0 65)"><rect x="0" y="4" width="8" height="49" rx="4" fill="#5366A0"/><text x="18" y="20" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">diminished fifth · d5</text><text x="18" y="44" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">B3 + F4 · 6 semitones · 5 letters</text></g></g></g></g></svg>
