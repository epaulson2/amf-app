<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 475" width="360" height="475" role="img" aria-labelledby="m07-2a-07-narrow-t m07-2a-07-narrow-d"><title id="m07-2a-07-narrow-t">Three changes from one beginning</title><desc id="m07-2a-07-narrow-d">All three start from C4 + E4, a major third of 4 semitones. Change 1, upper voice up one semitone: C4 + F4, a perfect fourth of 5 semitones. Change 2, lower voice down one semitone: B3 + E4, a perfect fourth of 5 semitones. Change 3, lower voice up two semitones: D4 + E4, a major second of 2 semitones.</desc><defs>
<linearGradient id="m07-2a-07-narrow-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="m07-2a-07-narrow-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="m07-2a-07-narrow-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="m07-2a-07-narrow-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="m07-2a-07-narrow-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="m07-2a-07-narrow-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="m07-2a-07-narrow-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">LESSON 2A · STEPS 8 AND 10</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">One beginning, three changes</text></g><g transform="translate(0 63)"><rect x="1" y="1" width="342" height="122" rx="12" fill="#fffaf3" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="700" text-anchor="start" fill="#4C2748">1 · Upper voice up one semitone</text><g transform="translate(14 38)"><rect x="0" y="0" width="9" height="30" rx="4" fill="#AB812D"/><text x="20" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">C4 + E4 · M3</text><text x="20" y="29" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">major third, 4 semitones</text></g><g transform="translate(14 76)"><rect x="0" y="0" width="9" height="30" rx="4" fill="#4F816B"/><text x="20" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">C4 + F4 · P4</text><text x="20" y="29" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">perfect fourth, 5 semitones</text></g></g><g transform="translate(0 197)"><rect x="1" y="1" width="342" height="122" rx="12" fill="#fffaf3" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="700" text-anchor="start" fill="#4C2748">2 · Lower voice down one semitone</text><g transform="translate(14 38)"><rect x="0" y="0" width="9" height="30" rx="4" fill="#AB812D"/><text x="20" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">C4 + E4 · M3</text><text x="20" y="29" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">major third, 4 semitones</text></g><g transform="translate(14 76)"><rect x="0" y="0" width="9" height="30" rx="4" fill="#4F816B"/><text x="20" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">B3 + E4 · P4</text><text x="20" y="29" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">perfect fourth, 5 semitones</text></g></g><g transform="translate(0 331)"><rect x="1" y="1" width="342" height="122" rx="12" fill="#fffaf3" stroke="#9a8798" stroke-width="1.5"/><text x="14" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-weight="700" text-anchor="start" fill="#4C2748">3 · Lower voice up two semitones</text><g transform="translate(14 38)"><rect x="0" y="0" width="9" height="30" rx="4" fill="#AB812D"/><text x="20" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">C4 + E4 · M3</text><text x="20" y="29" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">major third, 4 semitones</text></g><g transform="translate(14 76)"><rect x="0" y="0" width="9" height="30" rx="4" fill="#C17D41"/><text x="20" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">D4 + E4 · M2</text><text x="20" y="29" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#6b5a68">major second, 2 semitones</text></g></g></g></svg>
