</defs><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">WEEK 2 HUB</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Three lessons, one idea at a</text><text x="0" y="61" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">time</text></g><g transform="translate(0 93)"><g transform="translate(0 0)"><rect x="1" y="1" width="342" height="85.5" rx="14" fill="#fffaf3" stroke="#9a8798" stroke-width="1.8"/><text x="14" y="28" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1">Lesson 2A</text><text x="14" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" text-anchor="start" fill="#4C2748">One voice moves</text><text x="14" y="66" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Count a distance, then move one note.</text></g><path d="M172 91.5 v22 M165 106.5 l7 8 l7 -8" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0 119.5)"><rect x="1" y="1" width="342" height="85.5" rx="14" fill="#fffaf3" stroke="#9a8798" stroke-width="1.8"/><text x="14" y="28" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1">Lesson 2B</text><text x="14" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" text-anchor="start" fill="#4C2748">Both voices move</text><text x="14" y="66" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Five changes from the same two notes.</text></g><path d="M172 211 v22 M165 226 l7 8 l7 -8" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0 239)"><rect x="1" y="1" width="342" height="85.5" rx="14" fill="#fffaf3" stroke="#9a8798" stroke-width="1.8"/><text x="14" y="28" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1">Lesson 2C</text><text x="14" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" text-anchor="start" fill="#4C2748">Two short sketches</text><text x="14" y="66" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">The same melody over two lower lines.</text></g></g></g></svg>
