<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="360" height="440" role="img" aria-labelledby="m07-h-01-narrow-t m07-h-01-narrow-d"><title id="m07-h-01-narrow-t">The Week 2 path: three lessons</title><desc id="m07-h-01-narrow-d">Three boxes joined by arrows: Lesson 2A, one voice moves; Lesson 2B, both voices move; Lesson 2C, two short sketches.</desc><defs>
