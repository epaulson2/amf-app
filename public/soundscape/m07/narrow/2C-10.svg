<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 423" width="360" height="423" role="img" aria-labelledby="m07-2c-10-narrow-t m07-2c-10-narrow-d"><title id="m07-2c-10-narrow-t">The truth check: the lower voice moves while the upper rests</title><desc id="m07-2c-10-narrow-d">Upper voice: E4 4 to 10 s, F4 14 to 20 s, E4 26 to 32 s (rests in between). Lower voice: C4 0 to 12 s, B3 12 to 24 s, C4 24 to 36 s. Dashed markers at 12 and 24 seconds: the upper voice is resting at both. F4 sounds only from 14 to 20 seconds, over B3: B3 + F4, a diminished fifth, 6 semitones, in the tritone colour.</desc><defs>
