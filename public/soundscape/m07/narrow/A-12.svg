<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 567" width="360" height="567" role="img" aria-labelledby="m07-a-12-narrow-t m07-a-12-narrow-d"><title id="m07-a-12-narrow-t">How to read our pictures</title><desc id="m07-a-12-narrow-d">A legend. Filled circle: the lower voice. Light square with a dark outline: the upper voice. Dashed shape: where a voice started before it moved. Solid bar: a note sounding, as wide as it lasts. Dashed box: a rest, which is silence in that voice. Colour bar: names one pair of notes. Colour belongs to the pair, never to a voice. Numbers on arcs: semitone hops, counting every key, black ones too. Plogger chip: a separate historic lens (outline, shadow, fill). It is not the colour. Note names keep their octave number: B3 and B4 are different keys.</desc><defs>
<linearGradient id="m07-a-12-narrow-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="m07-a-12-narrow-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="m07-a-12-narrow-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="m07-a-12-narrow-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="m07-a-12-narrow-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="m07-a-12-narrow-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="m07-a-12-narrow-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">SHARED · LEGEND</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">How to read our pictures</text></g><g transform="translate(0 57)"><circle cx="20" cy="17" r="9" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="52" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Filled circle: the lower voice.</text></g><g transform="translate(0 95)"><rect x="11" y="8" width="18" height="18" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="52" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Light square with a dark outline:</text><text x="52" y="36" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">the upper voice.</text></g><g transform="translate(0 143)"><circle cx="20" cy="17" r="9" fill="none" stroke="#3e2241" stroke-width="2" stroke-dasharray="3.5 3"/><text x="52" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Dashed shape: where a voice</text><text x="52" y="36" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">started before it moved.</text></g><g transform="translate(0 191)"><rect x="2" y="6" width="38" height="22" rx="7" fill="#ece5d9" stroke="#3e2241" stroke-width="2" /><text x="52" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Solid bar: a note sounding, as</text><text x="52" y="36" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">wide as it lasts.</text></g><g transform="translate(0 239)"><rect x="2" y="6" width="38" height="22" rx="7" fill="none" stroke="#9a8798" stroke-width="1.6" stroke-dasharray="5 4"/><text x="52" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Dashed box: a rest, which is</text><text x="52" y="36" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">silence in that voice.</text></g><g transform="translate(0 287)"><rect x="2" y="2" width="9" height="30" rx="4" fill="#AB812D"/><rect x="16" y="2" width="9" height="30" rx="4" fill="#8964A4"/><text x="52" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Colour bar: names one pair of</text><text x="52" y="36" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">notes. Colour belongs to the pair,</text><text x="52" y="54" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">never to a voice.</text></g><g transform="translate(0 353)"><text x="20" y="24" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#3e2241">1 2 3</text><text x="52" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Numbers on arcs: semitone hops,</text><text x="52" y="36" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">counting every key, black ones</text><text x="52" y="54" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">too.</text></g><g transform="translate(0 419)"><g transform="translate(-6 0) scale(0.5)"><path d="M3 8 H89 V50 H3 Z" transform="translate(3 0)" fill="#5c465b" opacity=".5"/><g transform="translate(12 0)"><defs><clipPath id="m07-a-12-narrow-clk5"><path d="M3 8 H89 V50 H3 Z"/></clipPath></defs><path d="M3 8 H89 V50 H3 Z" fill="#4C2748"/><path d="M3 8 H89 V50 H3 Z" fill="none" stroke="#4C2748" stroke-width="2.4" stroke-linejoin="round"/><text x="46" y="35" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#fffaf3">[5]</text></g></g><text x="52" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Plogger chip: a separate historic</text><text x="52" y="36" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">lens (outline, shadow, fill). It</text><text x="52" y="54" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">is not the colour.</text></g><g transform="translate(0 485)"><text x="20" y="24" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#3e2241">B3</text><text x="52" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Note names keep their octave</text><text x="52" y="36" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">number: B3 and B4 are different</text><text x="52" y="54" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#2f2230" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">keys.</text></g></g></svg>
