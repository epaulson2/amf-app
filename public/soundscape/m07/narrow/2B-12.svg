<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 395" width="360" height="395" role="img" aria-labelledby="m07-2b-12-narrow-t m07-2b-12-narrow-d"><title id="m07-2b-12-narrow-t">Two kinds of words: along a path, up a stage</title><desc id="m07-2b-12-narrow-d">Two stages. Lower voice holds C4; upper voice goes from E4 to F4. Along the path: movement words. At stage 2, C4 + F4: a perfect fourth, 5 semitones, in the perfect fourth colour. Interval words describe the pair at a single stage.</desc><defs>
