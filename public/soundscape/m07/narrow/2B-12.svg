="#3e2241">F4</text><path d="M68 141 L302 141" fill="none" stroke="#3e2241" stroke-width="3"  stroke-linejoin="round" opacity=".55"/><path d="M68 53 L302 31" fill="none" stroke="#3e2241" stroke-width="2.4" stroke-dasharray="1 0" stroke-linejoin="round" opacity=".55"/><circle cx="68" cy="141" r="8" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><rect x="60" y="45" width="16" height="16" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="68" y="174" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6b5a68">stage 1</text><path d="M302 141 V31" stroke="#4F816B" stroke-width="9" stroke-linecap="round" opacity=".85"/><circle cx="302" cy="141" r="8" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><rect x="294" y="23" width="16" height="16" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><text x="302" y="174" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6b5a68">stage 2</text></g><g transform="translate(0 287)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Movement words: what each voice does from</text><text x="0" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">one stage to the next, along a path.</text></g><g transform="translate(0 335)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Interval words: the pair at one stage, C4</text><text x="0" y="32" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">+ F4, a perfect fourth.</text></g></g></svg>
