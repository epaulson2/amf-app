<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 829" width="360" height="829" role="img" aria-labelledby="m07-a-02-narrow-t m07-a-02-narrow-d"><title id="m07-a-02-narrow-t">The thirteen interval identity colours, Palette version 1.0</title><desc id="m07-a-02-narrow-d">Thirteen swatches in order from 0 to 12 semitones. 0: Perfect unison, #76848C; 1: Minor second, #C25562; 2: Major second, #C17D41; 3: Minor third, #8964A4; 4: Major third, #AB812D; 5: Perfect fourth, #4F816B; 6: Tritone, #5366A0; 7: Perfect fifth, #347B97; 8: Minor sixth, #A95E86; 9: Major sixth, #B47752; 10: Minor seventh, #367C79; 11: Major seventh, #7978B3; 12: Perfect octave, #89845D. The colours are an agreed artistic label for a pair of notes, not a property of sound.</desc><defs>
<linearGradient id="m07-a-02-narrow-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="m07-a-02-narrow-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="m07-a-02-narrow-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="m07-a-02-narrow-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="m07-a-02-narrow-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="m07-a-02-narrow-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="m07-a-02-narrow-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">SHARED · COLOUR KEY</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Thirteen colours, one for each</text><text x="0" y="61" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">interval</text></g><g transform="translate(0 93)"><g transform="translate(0 0)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#76848C"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">0 · Perfect unison</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Pearl slate · #76848C</text></g><g transform="translate(0 48)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#C25562"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">1 · Minor second</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Soft coral · #C25562</text></g><g transform="translate(0 96)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#C17D41"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">2 · Major second</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Apricot ochre · #C17D41</text></g><g transform="translate(0 144)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#8964A4"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">3 · Minor third</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Orchid violet · #8964A4</text></g><g transform="translate(0 192)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#AB812D"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">4 · Major third</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Antique amber · #AB812D</text></g><g transform="translate(0 240)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#4F816B"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">5 · Perfect fourth</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Sage teal · #4F816B</text></g><g transform="translate(0 288)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#5366A0"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">6 · Tritone</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Deep periwinkle · #5366A0</text></g><g transform="translate(0 336)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#347B97"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">7 · Perfect fifth</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Lake blue · #347B97</text></g><g transform="translate(0 384)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#A95E86"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">8 · Minor sixth</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Rose orchid · #A95E86</text></g><g transform="translate(0 432)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#B47752"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">9 · Major sixth</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Warm terracotta · #B47752</text></g><g transform="translate(0 480)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#367C79"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">10 · Minor seventh</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Deep sea teal · #367C79</text></g><g transform="translate(0 528)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#7978B3"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">11 · Major seventh</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Dusty lilac · #7978B3</text></g><g transform="translate(0 576)"><rect x="0" y="2" width="56" height="34" rx="8" fill="#89845D"/><text x="70" y="18" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" text-anchor="start" fill="#3e2241" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">12 · Perfect octave</text><text x="70" y="38" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b5a68">Silver olive gold · #89845D</text></g></g><g transform="translate(0 727)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Palette identity colours, version 1.0. An</text><text x="0" y="32.9" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">agreed artistic label that always travels</text><text x="0" y="51.8" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">with a name and a number. It marks a pair of</text><text x="0" y="70.69999999999999" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">notes, never a voice.</text></g></g></svg>
