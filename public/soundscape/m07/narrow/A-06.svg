<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1074" width="360" height="1074" role="img" aria-labelledby="m07-a-06-narrow-t m07-a-06-narrow-d"><title id="m07-a-06-narrow-t">Four motion glyphs</title><desc id="m07-a-06-narrow-d">Four tiles. Oblique: the lower circle stays level while the upper square rises. Contrary: the lower circle falls while the upper square rises. Similar: both rise, the lower by more than the upper. Strict parallel: both rise by the same amount, shown with two equal dotted brackets. No pitch names are shown.</desc><defs>
<linearGradient id="m07-a-06-narrow-w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset=".78" stop-color="#f7efe2"/><stop offset="1" stop-color="#eadfcd"/></linearGradient>
<linearGradient id="m07-a-06-narrow-b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a4d"/><stop offset=".85" stop-color="#2a1630"/><stop offset="1" stop-color="#3a2140"/></linearGradient>
<radialGradient id="m07-a-06-narrow-home" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffd98a"/><stop offset=".55" stop-color="#f6b94f"/><stop offset="1" stop-color="#f3a53a" stop-opacity=".92"/></radialGradient>
<radialGradient id="m07-a-06-narrow-lower" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#ffe0a6"/><stop offset="1" stop-color="#f3b25a"/></radialGradient>
<radialGradient id="m07-a-06-narrow-upper" cx=".5" cy=".82" r=".75"><stop offset="0" stop-color="#bfe7e2"/><stop offset="1" stop-color="#8fcdc6"/></radialGradient>
<linearGradient id="m07-a-06-narrow-shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6c46a"/><stop offset=".5" stop-color="#efe6c4"/><stop offset="1" stop-color="#8fcdc6"/></linearGradient>
<filter id="m07-a-06-narrow-glow" x="-40%" y="-20%" width="180%" height="150%"><feGaussianBlur stdDeviation="9"/></filter>
</defs><g transform="translate(8 8)"><g transform="translate(0 0)"><text x="0" y="13" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#8a5a66" letter-spacing="1.1" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">SHARED · MOVEMENT WORDS</text><text x="0" y="37" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="600" text-anchor="start" fill="#4C2748" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Four ways two voices can travel</text></g><g transform="translate(0 69)"><g transform="translate(0 0)"><rect x="0" y="0" width="344" height="216" rx="12" fill="#fffaf3" stroke="#e5d6dc" stroke-width="1.5"/><text x="14" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Oblique</text><path d="M38 66 L298 36 M298 36 l-10.194272920198113 -4.1324084537368115 M298 36 l-8.985290976626565 6.345435057216583" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><rect x="31" y="59" width="14" height="14" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><path d="M38 112 L298 112 M298 112 l-9.6534081807941 -5.273680924646233 M298 112 l-9.6534081807941 5.273680924646233" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="38" cy="112" r="7" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="14" y="172" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">One voice holds; the other moves.</text></g><g transform="translate(0 230)"><rect x="0" y="0" width="344" height="216" rx="12" fill="#fffaf3" stroke="#e5d6dc" stroke-width="1.5"/><text x="14" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Contrary</text><path d="M38 66 L298 40 M298 40 l-10.130251017099885 -4.286958634107257 M298 40 l-9.080749287235083 6.208058664540753" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><rect x="31" y="59" width="14" height="14" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><path d="M38 112 L298 138 M298 138 l-9.080749287235083 -6.208058664540753 M298 138 l-10.130251017099885 4.286958634107257" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="38" cy="112" r="7" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="14" y="172" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">The voices go opposite ways, apart or</text><text x="14" y="189.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">together.</text></g><g transform="translate(0 460)"><rect x="0" y="0" width="344" height="216" rx="12" fill="#fffaf3" stroke="#e5d6dc" stroke-width="1.5"/><text x="14" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Similar</text><path d="M38 66 L298 32 M298 32 l-10.255725604481066 -3.9774479664216233 M298 32 l-8.888099249779009 6.480871216594094" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><rect x="31" y="59" width="14" height="14" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><path d="M38 112 L298 96 M298 96 l-9.9591027384042 -4.670789295816066 M298 96 l-9.31125984251802 5.856657762334356" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="38" cy="112" r="7" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><text x="14" y="172" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Both go the same way, by different</text><text x="14" y="189.5" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">amounts.</text></g><g transform="translate(0 690)"><rect x="0" y="0" width="344" height="216" rx="12" fill="#fffaf3" stroke="#e5d6dc" stroke-width="1.5"/><text x="14" y="26" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#3e2241">Strict parallel</text><path d="M38 66 L298 42 M298 42 l-10.097282735289827 -4.364044152345162 M298 42 l-9.127801675498675 6.1386673287256395" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><rect x="31" y="59" width="14" height="14" rx="3" fill="#fffdf8" stroke="#3e2241" stroke-width="3"/><path d="M38 112 L298 88 M298 88 l-10.097282735289827 -4.364044152345162 M298 88 l-9.127801675498675 6.1386673287256395" stroke="#3e2241" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="38" cy="112" r="7" fill="#3e2241" stroke="#fffdf8" stroke-width="2"/><path d="M310 66 V42 M310 112 V88" stroke="#9a8798" stroke-width="2.4" stroke-dasharray="2 4"/><text x="14" y="172" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#4a3a4a" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Same way, same number of semitones.</text></g></g><g transform="translate(0 991)"><text x="0" y="14" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Circle = lower voice, square = upper voice.</text><text x="0" y="32.9" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">Arrows only; the exact notes are on the</text><text x="0" y="51.8" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" text-anchor="start" fill="#6b5a68" stroke="#f9f5ed" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke fill">lesson pictures.</text></g></g></svg>
