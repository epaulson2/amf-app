<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 643" width="360" height="643" role="img" aria-labelledby="m07-a-05-narrow-t m07-a-05-narrow-d"><title id="m07-a-05-narrow-t">Counting letters is not counting semitones</title><desc id="m07-a-05-narrow-d">Two copies of the keyboard from C4 to G4. First copy: C4 (lower voice) and E4 (upper voice) are marked; the keys C, D and E carry the numbers 1, 2 and 3. Second copy: four numbered hops, C4 to C♯4 to D4 to D♯4 to E4, include the two black keys. Three letters, four semitones.</desc><defs>
