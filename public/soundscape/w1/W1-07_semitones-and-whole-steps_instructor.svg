<svg xmlns="http://www.w3.org/2000/svg" width="960" height="664" viewBox="0 0 960 664" role="img" aria-labelledby="t d"><title id="t">W1-07 Semitones and Whole Steps (instructor)</title><desc id="d">A keyboard from C4 to C5. Every neighbouring key, black or white, is one semitone. C to D crosses two hops, so it is a whole step; E to F and B to C have no black key between them and are each one semitone. The C-major pattern W W H W W W H follows.</desc><metadata id="amf-source">{&quot;asset_id&quot;: &quot;W1-07&quot;, &quot;hops&quot;: {&quot;B-C&quot;: 1, &quot;C-C#&quot;: 1, &quot;C-D&quot;: 2, &quot;E-F&quot;: 1, &quot;F-G&quot;: 2}, &quot;pattern&quot;: &quot;WWHWWWH&quot;, &quot;scale&quot;: [&quot;C4&quot;, &quot;D4&quot;, &quot;E4&quot;, &quot;F4&quot;, &quot;G4&quot;, &quot;A4&quot;, &quot;B4&quot;, &quot;C5&quot;], &quot;source_data_sha256&quot;: &quot;3e9b25419a690bd3d7a4242d27f83f2ec4e68ee01d52f9af9f473f656bffd6c0&quot;, &quot;steps&quot;: [2, 2, 1, 2, 2, 2, 1], &quot;view&quot;: &quot;instructor&quot;}</metadata><defs><marker id="arr-lower" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="arr-upper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8470F"/></marker><marker id="arr-third" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3A8C"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8C96A3" stroke-width="1.5"/></pattern></defs><rect width="960" height="664" fill="#FBFAF6"/><rect x="0.0" y="0.0" width="960.0" height="78.0" rx="0" fill="#1B2430"/><text x="24.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#FBFAF6">W1-07</text><text x="24.0" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#FBFAF6">Semitones and Whole Steps</text><text x="936.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#FBFAF6">Instructor view: facts revealed</text><text x="936.0" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#FBFAF6">measure with neighbouring keys</text><g transform="translate(0,78)"><text x="30.0" y="28.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1B2430">Count every key, white and black. One neighbouring key = 1 semitone (half step).</text><path d="M110.0,102.0 Q129.0,64.0 148.0,102.0" fill="none" stroke="#1B2430" stroke-width="2.5" marker-end="url(#arr-ink)" data-from="60" data-to="61"/><text x="129.0" y="77.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430" stroke="#FBFAF6" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1</text><path d="M148.0,102.0 Q179.0,64.0 210.0,102.0" fill="none" stroke="#1B2430" stroke-width="2.5" marker-end="url(#arr-ink)" data-from="61" data-to="62"/><text x="179.0" y="77.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430" stroke="#FBFAF6" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1</text><path d="M310.0,102.0 Q360.0,64.0 410.0,102.0" fill="none" stroke="#A8470F" stroke-width="2.5" marker-end="url(#arr-ink)" data-from="64" data-to="65"/><text x="360.0" y="77.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430" stroke="#FBFAF6" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1</text><path d="M710.0,102.0 Q760.0,64.0 810.0,102.0" fill="none" stroke="#A8470F" stroke-width="2.5" marker-end="url(#arr-ink)" data-from="71" data-to="72"/><text x="760.0" y="77.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430" stroke="#FBFAF6" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1</text><path d="M410.0,102.0 Q428.0,64.0 446.0,102.0" fill="none" stroke="#1B2430" stroke-width="2.5" marker-end="url(#arr-ink)" data-from="65" data-to="66"/><text x="428.0" y="77.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430" stroke="#FBFAF6" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1</text><path d="M446.0,102.0 Q478.0,64.0 510.0,102.0" fill="none" stroke="#1B2430" stroke-width="2.5" marker-end="url(#arr-ink)" data-from="66" data-to="67"/><text x="478.0" y="77.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430" stroke="#FBFAF6" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1</text><g data-layer="keyboard"><rect x="60.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.6" data-midi="60" data-key="white"/><rect x="160.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.6" data-midi="62" data-key="white"/><rect x="260.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#FDE9C9" stroke="#1B2430" stroke-width="1.6" data-midi="64" data-key="white"/><rect x="360.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#FDE9C9" stroke="#1B2430" stroke-width="1.6" data-midi="65" data-key="white"/><rect x="460.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.6" data-midi="67" data-key="white"/><rect x="560.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#FFFFFF" stroke="#1B2430" stroke-width="1.6" data-midi="69" data-key="white"/><rect x="660.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#FDE9C9" stroke="#1B2430" stroke-width="1.6" data-midi="71" data-key="white"/><rect x="760.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#FDE9C9" stroke="#1B2430" stroke-width="1.6" data-midi="72" data-key="white"/><rect x="119.0" y="110.0" width="58.0" height="105.4" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="61" data-key="black"/><rect x="243.0" y="110.0" width="58.0" height="105.4" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="63" data-key="black"/><rect x="417.0" y="110.0" width="58.0" height="105.4" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="66" data-key="black"/><rect x="531.0" y="110.0" width="58.0" height="105.4" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="68" data-key="black"/><rect x="645.0" y="110.0" width="58.0" height="105.4" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="70" data-key="black"/><text x="110.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">C</text><text x="210.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">D</text><text x="310.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">E</text><text x="410.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">F</text><text x="510.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">G</text><text x="610.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">A</text><text x="710.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">B</text><text x="810.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">C</text><text x="110.0" y="298.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">60</text><text x="210.0" y="298.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">62</text><text x="310.0" y="298.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">64</text><text x="410.0" y="298.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">65</text><text x="510.0" y="298.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">67</text><text x="610.0" y="298.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">69</text><text x="710.0" y="298.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">71</text><text x="810.0" y="298.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#4B5563">72</text></g><text x="30.0" y="330.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1B2430">C → C♯ → D: two hops = 2 semitones = one whole step.     F → F♯ → G: also a whole step.</text><text x="30.0" y="354.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1B2430">E → F and B → C: no black key between them, so each is already 1 semitone (a half step), even though both are white keys.</text><text x="30.0" y="400.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1B2430">C major, step by step:</text><rect x="114.0" y="414.0" width="92.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#1D4E89" stroke-width="2.5"/><text x="160.0" y="438.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1D4E89">W</text><rect x="214.0" y="414.0" width="92.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#1D4E89" stroke-width="2.5"/><text x="260.0" y="438.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1D4E89">W</text><rect x="314.0" y="414.0" width="92.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#A8470F" stroke-width="2.5"/><text x="360.0" y="438.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#A8470F">H</text><rect x="414.0" y="414.0" width="92.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#1D4E89" stroke-width="2.5"/><text x="460.0" y="438.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1D4E89">W</text><rect x="514.0" y="414.0" width="92.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#1D4E89" stroke-width="2.5"/><text x="560.0" y="438.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1D4E89">W</text><rect x="614.0" y="414.0" width="92.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#1D4E89" stroke-width="2.5"/><text x="660.0" y="438.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1D4E89">W</text><rect x="714.0" y="414.0" width="92.0" height="34.0" rx="6" fill="#FFFFFF" stroke="#A8470F" stroke-width="2.5"/><text x="760.0" y="438.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#A8470F">H</text><text x="30.0" y="476.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1B2430">W – W – H – W – W – W – H   (W = whole step, 2 semitones.   H = half step, 1 semitone.)</text><text x="30.0" y="500.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1B2430">White keys are not equally far apart. The pattern, not 'only white keys', makes a major scale.</text></g><text x="24.0" y="620.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">A semitone is not a rhythm value. It is the smallest ordinary pitch step on this keyboard.</text><text x="24.0" y="650.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">Original AMF graphic, rendered from data (no AI-drawn notation). C4 = MIDI 60.</text></svg>
