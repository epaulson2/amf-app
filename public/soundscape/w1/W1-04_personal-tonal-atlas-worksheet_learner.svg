2F86" stroke-width="1.5" stroke-dasharray="6 4"/><text x="568.0" y="165.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6B2F86">D:</text><rect x="560.0" y="204.0" width="340.0" height="44.0" rx="6" fill="#F6EEFA" stroke="#6B2F86" stroke-width="1.5" stroke-dasharray="6 4"/><text x="568.0" y="221.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6B2F86">E:</text><rect x="560.0" y="260.0" width="340.0" height="44.0" rx="6" fill="#F6EEFA" stroke="#6B2F86" stroke-width="1.5" stroke-dasharray="6 4"/><text x="568.0" y="277.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6B2F86">F:</text><rect x="560.0" y="316.0" width="340.0" height="44.0" rx="6" fill="#F6EEFA" stroke="#6B2F86" stroke-width="1.5" stroke-dasharray="6 4"/><text x="568.0" y="333.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6B2F86">G:</text><rect x="560.0" y="372.0" width="340.0" height="44.0" rx="6" fill="#F6EEFA" stroke="#6B2F86" stroke-width="1.5" stroke-dasharray="6 4"/><text x="568.0" y="389.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6B2F86">A:</text><rect x="560.0" y="428.0" width="340.0" height="44.0" rx="6" fill="#F6EEFA" stroke="#6B2F86" stroke-width="1.5" stroke-dasharray="6 4"/><text x="568.0" y="445.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#6B2F86">B:</text><text x="560.0" y="500.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#4B5563">Ideas to try (all optional): restful, hovering, reaching, or your own word.</text></g><text x="24.0" y="580.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1B2430">No note has a built-in feeling. Write what you notice, not what you think you should.</text></g><text x="24.0" y="720.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">Print it, write on it, keep it. This page is yours.</text><text x="24.0" y="750.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">Original AMF graphic, rendered from data (no AI-drawn notation). C4 = MIDI 60.</text></svg>
