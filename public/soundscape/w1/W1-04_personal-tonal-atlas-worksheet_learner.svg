<svg xmlns="http://www.w3.org/2000/svg" width="960" height="764" viewBox="0 0 960 764" role="img" aria-labelledby="t d"><title id="t">W1-04 Personal Tonal Atlas Worksheet (learner)</title><desc id="d">A circle of twelve pitch positions with home C at the top and the seven white-key notes marked, beside seven open boxes where the learner writes their own words, colours or images for what each note feels like. The factual circle and the personal boxes are kept separate.</desc><metadata id="amf-source">{&quot;answer_data&quot;: &quot;withheld; see the source or instructor master&quot;, &quot;asset_id&quot;: &quot;W1-04&quot;, &quot;source_data_sha256&quot;: &quot;d57788ce12c6e586a16c24b29a8ce45e77f4e21bef87964264c14ed1bcfc67c7&quot;, &quot;view&quot;: &quot;learner&quot;}</metadata><defs><marker id="arr-lower" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="arr-upper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8470F"/></marker><marker id="arr-third" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3A8C"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8C96A3" stroke-width="1.5"/