<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" role="img" aria-labelledby="t d"><title id="t">W1-05 Hear, Imagine, Sing, Find (learner)</title><desc id="d">A four-step card: hear the sound, imagine it, sing or hum it, then find it on an instrument. Each step has an alternative route for silent, quiet or no-voice practice, and the cycle repeats with a new note.</desc><metadata id="amf-source">{&quot;answer_data&quot;: &quot;withheld; see the source or instructor master&quot;, &quot;asset_id&quot;: &quot;W1-05&quot;, &quot;source_data_sha256&quot;: &quot;8a61373d06f6eea293ab45caee56a0b5a3230ce52d816ca2b400bf34d6a0ec48&quot;, &quot;view&quot;: &quot;learner&quot;}</metadata><defs><marker id="arr-lower" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="arr-upper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8470F"/></marker><marker id="arr-third" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3A8C"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8C96A3" stroke-width="1.5"/></pattern></defs><rect width="960" height="544" fill="#FBFAF6"/><rect x="0.0" y="0.0" width="960.0" height="78.0" rx="0" fill="#1B2430"/><text x="24.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#FBFAF6">W1-05</text><text x="24.0" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#FBFAF6">Hear, Imagine, Sing, Find</text><text x="936.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#FBFAF6">Learner view: hear first, then reveal</text><text x="936.0" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#FBFAF6">a repeating practice cycle</text><g transform="translate(0,78)"><rect x="24.0" y="20.0" width="214.0" height="300.0" rx="10" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.5"/><text x="38.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1B2430">1</text><g transform="translate(103.0,64) scale(1.17)"><g id="icon-hear" role="img" aria-label="Hear: sound waves arriving"><title>Hear: sound waves arriving</title><g stroke="#1B2430" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="24" r="4" fill="#1B2430"/><path d="M22 14 Q30 24 22 34"/><path d="M29 8 Q42 24 29 40"/></g></g></g><text x="131.0" y="160.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1B2430">Hear</text><text x="131.0" y="190.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1B2430">Listen to the sound,</text><text x="131.0" y="210.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1B2430">more than once.</text><text x="131.0" y="252.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">Or: No sound? Feel it or</text><text x="131.0" y="270.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">read it described.</text><line x1="240.0" y1="170.0" x2="254.0" y2="170.0" stroke="#1B2430" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-ink)"/><rect x="256.0" y="20.0" width="214.0" height="300.0" rx="10" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.5"/><text x="270.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1B2430">2</text><g transform="translate(335.0,64) scale(1.17)"><g id="icon-imagine" role="img" aria-label="Imagine: a thought bubble"><title>Imagine: a thought bubble</title><g stroke="#1B2430" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="20" r="14" stroke-dasharray="5 4"/><circle cx="10" cy="38" r="3"/><circle cx="16" cy="32" r="2"/></g></g></g><text x="363.0" y="160.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1B2430">Imagine</text><text x="363.0" y="190.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1B2430">Hear it again in your</text><text x="363.0" y="210.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1B2430">head.</text><text x="363.0" y="252.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">Or: Silent is fine.</text><line x1="472.0" y1="170.0" x2="486.0" y2="170.0" stroke="#1B2430" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-ink)"/><rect x="488.0" y="20.0" width="214.0" height="300.0" rx="10" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.5"/><text x="502.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1B2430">3</text><g transform="translate(567.0,64) scale(1.17)"><g id="icon-sing" role="img" aria-label="Sing or hum: a voice wave"><title>Sing or hum: a voice wave</title><g stroke="#1B2430" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="24" rx="19" ry="12"/><path d="M10 24 q3.5 -8 7 0 t7 0 t7 0 t7 0"/></g></g></g><text x="595.0" y="160.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1B2430">Sing or hum</text><text x="595.0" y="190.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1B2430">Match it with your</text><text x="595.0" y="210.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1B2430">voice.</text><text x="595.0" y="252.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">Or: Hum quietly, or tap</text><text x="595.0" y="270.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">the pulse instead.</text><line x1="704.0" y1="170.0" x2="718.0" y2="170.0" stroke="#1B2430" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-ink)"/><rect x="720.0" y="20.0" width="214.0" height="300.0" rx="10" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.5"/><text x="734.0" y="48.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="22" text-anchor="start" font-weight="bold" fill="#1B2430">4</text><g transform="translate(799.0,64) scale(1.17)"><g id="icon-find" role="img" aria-label="Find: a magnifier"><title>Find: a magnifier</title><g stroke="#1B2430" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="12"/><path d="M29 29 L41 41"/><circle cx="20" cy="20" r="2" fill="#1B2430"/></g></g></g><text x="827.0" y="160.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#1B2430">Find</text><text x="827.0" y="190.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1B2430">Locate it on your</text><text x="827.0" y="210.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1B2430">instrument or app.</text><text x="827.0" y="252.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">Or: Any instrument. Take</text><text x="827.0" y="270.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">your time.</text><text x="480.0" y="350.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#4B5563">Then go round again with a new note.</text></g><text x="24.0" y="500.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">Use any step on its own. The cycle is a guide, not a test.</text><text x="24.0" y="530.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">Original AMF graphic, rendered from data (no AI-drawn notation). C4 = MIDI 60.</text></svg>
