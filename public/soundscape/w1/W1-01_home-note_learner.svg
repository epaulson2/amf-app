<svg xmlns="http://www.w3.org/2000/svg" width="960" height="548.0" viewBox="0 0 960 548.0" role="img" aria-labelledby="t d"><title id="t">W1-01 The Home Note (learner)</title><desc id="d">One held voice at C4 (MIDI 60) marked with a double ring as the proposed home note, sounding for eight beats as a drone. The second half is hidden so the learner can imagine what comes next.</desc><metadata id="amf-source">{&quot;answer_data&quot;: &quot;withheld; see the source or instructor master&quot;, &quot;asset_id&quot;: &quot;W1-01&quot;, &quot;source_data_sha256&quot;: &quot;48225197bae69f5f21630ec2ad047ed6b2d171e0f02cc01adabdaafd5967f4bd&quot;, &quot;view&quot;: &quot;learner&quot;}</metadata><defs><marker id="arr-lower" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="arr-upper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8470F"/></marker><marker id="arr-third" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3A8C"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8C96A3" stroke-width="1.5"/></pattern></defs><rect width="960" height="548.0" fill="#FBFAF6"/><rect x="0.0" y="0.0" width="960.0" height="78.0" rx="0" fill="#1B2430"/><text x="24.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#FBFAF6">W1-01</text><text x="24.0" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#FBFAF6">The Home Note</text><text x="936.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#FBFAF6">Learner view: hear first, then reveal</text><text x="936.0" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#FBFAF6">one note, held</text><g transform="translate(0,78)"><g transform="translate(24,12)"><g id="w101"><g id="w101-grid" data-layer="grid"><line x1="58.0" y1="289.0" x2="898.0" y2="289.0" stroke="#D3D7DD" stroke-width="1.1" stroke-linecap="round"/><text x="50.0" y="294.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#4B5563">A3</text><line x1="58.0" y1="259.0" x2="898.0" y2="259.0" stroke="#D3D7DD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="58.0" y1="229.0" x2="898.0" y2="229.0" stroke="#D3D7DD" stroke-width="1.1" stroke-linecap="round"/><text x="50.0" y="234.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#4B5563">B3</text><line x1="58.0" y1="199.0" x2="898.0" y2="199.0" stroke="#D3D7DD" stroke-width="1.1" stroke-linecap="round"/><text x="50.0" y="204.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="bold" fill="#4B5563">C4</text><line x1="58.0" y1="169.0" x2="898.0" y2="169.0" stroke="#D3D7DD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="58.0" y1="139.0" x2="898.0" y2="139.0" stroke="#D3D7DD" stroke-width="1.1" stroke-linecap="round"/><text x="50.0" y="144.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#4B5563">D4</text><line x1="58.0" y1="109.0" x2="898.0" y2="109.0" stroke="#D3D7DD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="58.0" y1="79.0" x2="898.0" y2="79.0" stroke="#D3D7DD" stroke-width="1.1" stroke-linecap="round"/><text x="50.0" y="84.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#4B5563">E4</text><line x1="58.0" y1="49.0" x2="898.0" y2="49.0" stroke="#D3D7DD" stroke-width="1.1" stroke-linecap="round"/><text x="50.0" y="54.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#4B5563">F4</text><line x1="80.0" y1="34.0" x2="80.0" y2="304.0" stroke="#D3D7DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="182.2" y1="34.0" x2="182.2" y2="304.0" stroke="#D3D7DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="284.5" y1="34.0" x2="284.5" y2="304.0" stroke="#D3D7DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="386.8" y1="34.0" x2="386.8" y2="304.0" stroke="#D3D7DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="489.0" y1="34.0" x2="489.0" y2="304.0" stroke="#D3D7DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="591.2" y1="34.0" x2="591.2" y2="304.0" stroke="#D3D7DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="693.5" y1="34.0" x2="693.5" y2="304.0" stroke="#D3D7DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="795.8" y1="34.0" x2="795.8" y2="304.0" stroke="#D3D7DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="898.0" y1="34.0" x2="898.0" y2="304.0" stroke="#D3D7DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><text x="131.1" y="324.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">beat 1</text><text x="233.4" y="324.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">beat 2</text><text x="335.6" y="324.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">beat 3</text><text x="437.9" y="324.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">beat 4</text><text x="540.1" y="324.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">beat 5</text><text x="642.4" y="324.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">beat 6</text><text x="744.6" y="324.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">beat 7</text><text x="846.9" y="324.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">beat 8</text></g><rect x="489.0" y="34.0" width="409.0" height="270.0" rx="6" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.9"/><text x="693.5" y="163.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#4B5563">?</text><text x="693.5" y="191.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#4B5563">what will happen next?</text><g id="w101-voices" data-layer="voices"><line x1="80.0" y1="199.0" x2="489.0" y2="199.0" stroke="#1D4E89" stroke-width="6" stroke-linecap="butt"/><circle cx="80.0" cy="199.0" r="16" fill="none" stroke="#1B2430" stroke-width="2.5"/><circle cx="80.0" cy="199.0" r="9" fill="#1D4E89" stroke="#1D4E89" stroke-width="2.5" data-midi="60" data-voice="lower" data-start="0" data-uid="w101"/></g></g></g><text x="24.0" y="370.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1B2430">Listen to one steady note. Hum it. Make it your home.</text><text x="24.0" y="392.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1B2430">What do you imagine happening next?</text></g><text x="24.0" y="504.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">Home is a note you choose to return to. It is not a feeling the note carries on its own.</text><text x="24.0" y="534.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">Original AMF graphic, rendered from data (no AI-drawn notation). C4 = MIDI 60.</text></svg>
