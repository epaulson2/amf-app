<svg xmlns="http://www.w3.org/2000/svg" width="960" height="536.0" viewBox="0 0 960 536.0" role="img" aria-labelledby="t d"><title id="t">SYS-04 Voice-Path Chart (learner)</title><desc id="d">A pitch-versus-time chart with two named voices over two beats. The first beat is drawn; labels and the second beat are withheld for hearing first.</desc><metadata id="amf-source">{&quot;answer_data&quot;: &quot;withheld; see the source or instructor master&quot;, &quot;asset_id&quot;: &quot;SYS-04&quot;, &quot;source_data_sha256&quot;: &quot;94c2baf3a723e50058a96754721afb1cba5aacb7ab6d31820d08b96bf7ba20f4&quot;, &quot;view&quot;: &quot;learner&quot;}</metadata><defs><marker id="arr-lower" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="arr-upper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8470F"/></marker><marker id="arr-third" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3A8C"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8C96A3" stroke-width="1.5"/></pattern></defs><rect width="960" height="536.0" fill="#FBFAF6"/><rect x="0.0" y="0.0" width="960.0" height="78.0" rx="0" fill="#1B2430"/><text x="24.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#FBFAF6">SYS-04</text><text x="24.0" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#FBFAF6">Voice-Path Chart</text><text x="936.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#FBFAF6">Learner view: hear first, then reveal</text><text x="936.0" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#FBFAF6">two or more voices over time</text><g transform="translate(0,78)"><g transform="translate(24,10)"><g id="sys04"><g id="sys04-grid" data-layer="grid"><line x1="58.0" y1="289.0" x2="506.0" y2="289.0" stroke="#D3D7DD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="58.0" y1="259.0" x2="506.0" y2="259.0" stroke="#D3D7DD" stroke-width="1.1" stroke-linecap="round"/><text x="50.0" y="264.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#4B5563">B3</text><line x1="58.0" y1="229.0" x2="506.0" y2="229.0" stroke="#D3D7DD" stroke-width="1.1" stroke-linecap="round"/><text x="50.0" y="234.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="bold" fill="#4B5563">C4</text><line x1="58.0" y1="199.0" x2="506.0" y2="199.0" stroke="#D3D7DD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="58.0" y1="169.0" x2="506.0" y2="169.0" stroke="#D3D7DD" stroke-width="1.1" stroke-linecap="round"/><text x="50.0" y="174.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#4B5563">D4</text><line x1="58.0" y1="139.0" x2="506.0" y2="139.0" stroke="#D3D7DD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="58.0" y1="109.0" x2="506.0" y2="109.0" stroke="#D3D7DD" stroke-width="1.1" stroke-linecap="round"/><text x="50.0" y="114.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#4B5563">E4</text><line x1="58.0" y1="79.0" x2="506.0" y2="79.0" stroke="#D3D7DD" stroke-width="1.1" stroke-linecap="round"/><text x="50.0" y="84.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#4B5563">F4</text><line x1="58.0" y1="49.0" x2="506.0" y2="49.0" stroke="#D3D7DD" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="3 5"/><line x1="80.0" y1="34.0" x2="80.0" y2="304.0" stroke="#D3D7DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="293.0" y1="34.0" x2="293.0" y2="304.0" stroke="#D3D7DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="506.0" y1="34.0" x2="506.0" y2="304.0" stroke="#D3D7DD" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><text x="186.5" y="324.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">beat 1</text><text x="399.5" y="324.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">beat 2</text></g><rect x="293.0" y="34.0" width="213.0" height="270.0" rx="6" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.9"/><text x="399.5" y="163.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="34" text-anchor="middle" font-weight="bold" fill="#4B5563">?</text><text x="399.5" y="191.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#4B5563">hear it, then sketch</text><g id="sys04-voices" data-layer="voices"><line x1="80.0" y1="229.0" x2="293.0" y2="229.0" stroke="#1D4E89" stroke-width="6" stroke-linecap="butt"/><circle cx="80.0" cy="229.0" r="9" fill="#1D4E89" stroke="#1D4E89" stroke-width="2.5" data-midi="60" data-voice="lower" data-start="0" data-uid="sys04"/><line x1="80.0" y1="109.0" x2="293.0" y2="109.0" stroke="#A8470F" stroke-width="6" stroke-linecap="butt" stroke-dasharray="10 6"/><rect x="71.0" y="100.0" width="18" height="18" fill="#A8470F" stroke="#A8470F" stroke-width="2.5" data-midi="64" data-voice="upper" data-start="0" data-uid="sys04"/></g></g></g><text x="570.0" y="56.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1B2430">How to read it</text><text x="570.0" y="86.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">Left to right is time.</text><text x="570.0" y="110.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">Up and down is pitch (register).</text><text x="570.0" y="134.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">A flat bar is a note being held.</text><text x="570.0" y="158.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">A step with an arrow is a voice moving.</text><text x="570.0" y="182.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">Hatched = silence (see W1-03).</text><text x="570.0" y="218.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">Each voice keeps its own colour,</text><text x="570.0" y="242.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">line pattern and node shape.</text></g><text x="24.0" y="522.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">Original AMF graphic, rendered from data (no AI-drawn notation). C4 = MIDI 60.</text></svg>
