idth="1.2"/><g transform="translate(335,28) scale(1.17)"><g id="icon-imagine" role="img" aria-label="Imagine: a thought bubble"><title>Imagine: a thought bubble</title><g stroke="#1B2430" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="20" r="14" stroke-dasharray="5 4"/><circle cx="10" cy="38" r="3"/><circle cx="16" cy="32" r="2"/></g></g></g><text x="363.0" y="114.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#1B2430">Imagine</text><text x="363.0" y="142.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">Or: silently, in your head</text><rect x="488.0" y="14.0" width="214.0" height="180.0" rx="10" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.2"/><g transform="translate(567,28) scale(1.17)"><g id="icon-sing" role="img" aria-label="Sing or hum: a voice wave"><title>Sing or hum: a voice wave</title><g stroke="#1B2430" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="24" rx="19" ry="12"/><path d="M10 24 q3.5 -8 7 0 t7 0 t7 0 t7 0"/></g></g></g><text x="595.0" y="114.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#1B2430">Sing / hum</text><text x="595.0" y="142.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">Or: or tap the pulse</text><rect x="720.0" y="14.0" width="214.0" height="180.0" rx="10" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.2"/><g transform="translate(799,28) scale(1.17)"><g id="icon-move" role="img" aria-label="Move: a note shifting up and down"><title>Move: a note shifting up and down</title><g stroke="#1B2430" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 38 V10"/><path d="M10 16 L16 9 L22 16"/><path d="M32 10 V3