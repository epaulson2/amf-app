nchor="middle" font-weight="normal" fill="#4B5563">Or: one change at a time</text><rect x="488.0" y="214.0" width="214.0" height="180.0" rx="10" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.2"/><g transform="translate(567,228) scale(1.17)"><g id="icon-create" role="img" aria-label="Create: a spark of something new"><title>Create: a spark of something new</title><g stroke="#1B2430" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6 V18 M24 30 V42 M6 24 H18 M30 24 H42"/><circle cx="24" cy="24" r="3" fill="#1B2430"/></g></g></g><text x="595.0" y="314.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#1B2430">Create</text><text x="595.0" y="342.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">Or: make something of your</text><text x="595.0" y="360.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">own</text><rect x="720.0" y="214.0" width="214.0" height="180.0" rx="10" fill="#F1EFE8" stroke="#9AA3AF" stroke-width="1.2"/><g transform="translate(799,228) scale(1.17)"><g id="icon-reflect" role="img" aria-label="Reflect: a loop back"><title>Reflect: a loop back</title><g stroke="#1B2430" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M38 24 A14 14 0 1 1 30 11"/><path d="M26 6 L32 11 L26 16"/></g></g></g><text x="827.0" y="314.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#1B2430">Reflect</text><text x="827.0" y="342.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4B5563">Or: write, speak or just</text><text x="827.0" y="360.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="no