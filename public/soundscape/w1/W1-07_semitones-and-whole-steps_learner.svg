<svg xmlns="http://www.w3.org/2000/svg" width="960" height="494" viewBox="0 0 960 494" role="img" aria-labelledby="t d"><title id="t">W1-07 Hum, Predict, Then Count (learner)</title><desc id="d">A keyboard from C4 to C5 with the eight notes C D E F G A B C numbered one to eight, to hum and predict before any step sizes are named.</desc><metadata id="amf-source">{&quot;answer_data&quot;: &quot;withheld; see the source or instructor master&quot;, &quot;asset_id&quot;: &quot;W1-07&quot;, &quot;source_data_sha256&quot;: &quot;b84c76ea44814d5879612ba8af92b95bef37b8056a320a7de8599cc33d362328&quot;, &quot;view&quot;: &quot;learner&quot;}</metadata><defs><marker id="arr-lower" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E89"/></marker><marker id="arr-upper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A8470F"/></marker><marker id="arr-third" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B3A8C"/></marker><marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker><marker id="arr-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8C96A3" stroke-width="1.5"/></pattern></defs><rect width="960" height="494" fill="#FBFAF6"/><rect x="0.0" y="0.0" width="960.0" height="78.0" rx="0" fill="#1B2430"/><text x="24.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#FBFAF6">W1-07</text><text x="24.0" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#FBFAF6">Hum, Predict, Then Count</text><text x="936.0" y="34.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#FBFAF6">Learner view: hear first, then reveal</text><text x="936.0" y="62.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="normal" fill="#FBFAF6">measure with neighbouring keys</text><g transform="translate(0,78)"><text x="30.0" y="28.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#1B2430">Hum C D E F G A B and stop. What does your ear want next?</text><g data-layer="keyboard"><rect x="60.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#CFE0F5" stroke="#1B2430" stroke-width="1.6" data-midi="60" data-key="white"/><rect x="160.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#CFE0F5" stroke="#1B2430" stroke-width="1.6" data-midi="62" data-key="white"/><rect x="260.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#CFE0F5" stroke="#1B2430" stroke-width="1.6" data-midi="64" data-key="white"/><rect x="360.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#CFE0F5" stroke="#1B2430" stroke-width="1.6" data-midi="65" data-key="white"/><rect x="460.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#CFE0F5" stroke="#1B2430" stroke-width="1.6" data-midi="67" data-key="white"/><rect x="560.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#CFE0F5" stroke="#1B2430" stroke-width="1.6" data-midi="69" data-key="white"/><rect x="660.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#CFE0F5" stroke="#1B2430" stroke-width="1.6" data-midi="71" data-key="white"/><rect x="760.0" y="110.0" width="100.0" height="170.0" rx="0" fill="#CFE0F5" stroke="#1B2430" stroke-width="1.6" data-midi="72" data-key="white"/><rect x="119.0" y="110.0" width="58.0" height="105.4" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="61" data-key="black"/><rect x="243.0" y="110.0" width="58.0" height="105.4" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="63" data-key="black"/><rect x="417.0" y="110.0" width="58.0" height="105.4" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="66" data-key="black"/><rect x="531.0" y="110.0" width="58.0" height="105.4" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="68" data-key="black"/><rect x="645.0" y="110.0" width="58.0" height="105.4" rx="0" fill="#1B2430" stroke="#1B2430" stroke-width="1.6" data-midi="70" data-key="black"/><text x="110.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">1</text><text x="210.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">2</text><text x="310.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">3</text><text x="410.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">4</text><text x="510.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">5</text><text x="610.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">6</text><text x="710.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">7</text><text x="810.0" y="268.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1B2430">8</text></g><text x="30.0" y="330.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1B2430">Predict first. Then play it and listen to the ending.</text></g><text x="24.0" y="450.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#1B2430">Use your ears first. The keyboard is a map for what you hear.</text><text x="24.0" y="480.0" font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#4B5563">Original AMF graphic, rendered from data (no AI-drawn notation). C4 = MIDI 60.</text></svg>
